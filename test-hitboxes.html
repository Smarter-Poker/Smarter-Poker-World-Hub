<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Entry Modal Hitbox Test</title>
    <style>
        body {
            background-color: #242526;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
        }

        /* ═══════ DYNAMIC DIAMOND MODAL ═══════ */
        .diamond-modal {
            position: relative;
            width: 90%;
            max-width: 440px;
            margin: 0 auto;
        }

        .diamond-modal__bg {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Base Hitbox */
        .dm-hitbox {
            position: absolute;
            cursor: pointer;
            background: rgba(255, 0, 0, 0.4);
            /* RED overlay for testing */
            border: 2px solid red;
            outline: none;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hitbox regions */
        .dm-close {
            top: 15.5%;
            right: 20%;
            width: 9%;
            height: 8.5%;
            border-radius: 50%;
        }

        .dm-vip {
            top: 71%;
            left: 20%;
            width: 29%;
            height: 8%;
            border-radius: 12px;
        }

        .dm-accept {
            top: 71%;
            right: 18%;
            width: 31%;
            height: 8%;
            border-radius: 12px;
        }

        /* Dynamic Balance Box */
        .dm-balance {
            position: absolute;
            bottom: 11.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            height: 7%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 0, 0.4);
            /* GREEN overlay for testing */
            border: 2px solid green;
            color: #4df8ff;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(77, 248, 255, 0.4);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="diamond-modal">
        <img src="public/images/trivia/diamond-entry-modal.png" alt="Diamond Entry Modal" class="diamond-modal__bg" />

        <button class="dm-hitbox dm-close"></button>
        <button class="dm-hitbox dm-vip"></button>
        <button class="dm-hitbox dm-accept"></button>
        <div class="dm-balance">1,250 💎</div>
    </div>
</body>

</html>
