<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venue Logo Review - All 677 Venues</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: #0a0e1a; color: #e2e8f0; padding: 20px; 
  }
  header { text-align: center; margin-bottom: 30px; }
  h1 { color: #38bdf8; font-size: 28px; margin-bottom: 8px; }
  .stats { color: #94a3b8; font-size: 14px; margin-bottom: 15px; }
  .stats span { color: #22d3ee; font-weight: bold; }
  
  .controls { 
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; 
  }
  .controls input { 
    padding: 8px 14px; border-radius: 6px; border: 1px solid #334155; 
    background: #1e293b; color: #e2e8f0; font-size: 14px; width: 300px; 
  }
  .controls button { 
    padding: 8px 16px; border-radius: 6px; border: 1px solid #334155; 
    background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 13px; 
  }
  .controls button.active { background: #0ea5e9; border-color: #0ea5e9; color: #000; font-weight: bold; }
  .controls button:hover { background: #334155; }
  .controls button.active:hover { background: #38bdf8; }

  .grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
    gap: 12px; 
  }
  .card { 
    background: #1e293b; padding: 12px; border-radius: 8px; 
    border: 1px solid #334155; text-align: center; transition: 0.2s;
  }
  .card:hover { border-color: #0ea5e9; transform: translateY(-2px); }
  .card.supabase { border-left: 3px solid #22c55e; }
  .card.local { border-left: 3px solid #eab308; }
  .card.missing { border-left: 3px solid #ef4444; }

  .logo-wrap { 
    width: 80px; height: 80px; margin: 0 auto 8px; 
    background: #111827; border-radius: 6px; display: flex; 
    align-items: center; justify-content: center; overflow: hidden; 
    border: 1px solid #374151; 
  }
  .logo-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logo-wrap .no-logo { color: #4b5563; font-size: 11px; }

  .name { font-size: 12px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .meta { font-size: 10px; color: #64748b; font-family: monospace; }
  .state-badge {
    display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: #1e3a5f; color: #38bdf8; margin-top: 4px;
  }
  .source-badge {
    display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-top: 2px;
  }
  .source-badge.cdn { background: #14532d; color: #4ade80; }
  .source-badge.local { background: #422006; color: #fbbf24; }
  .source-badge.none { background: #3f1219; color: #f87171; }

  .legend { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .legend-dot.green { background: #22c55e; }
  .legend-dot.yellow { background: #eab308; }
  .legend-dot.red { background: #ef4444; }

  #loading { text-align: center; padding: 60px; color: #64748b; font-size: 18px; }
</style>
</head>
<body>
  <header>
    <h1>Venue Logo Review</h1>
    <div class="stats" id="stats">Loading...</div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot green"></div> Supabase CDN</div>
      <div class="legend-item"><div class="legend-dot yellow"></div> Local/Other</div>
      <div class="legend-item"><div class="legend-dot red"></div> No Logo</div>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="Search by name, state, or ID..." />
      <button class="active" data-filter="all">All</button>
      <button data-filter="supabase">Supabase CDN</button>
      <button data-filter="local">Local/Other</button>
      <button data-filter="missing">No Logo</button>
    </div>
  </header>

  <div id="loading">Loading venue data...</div>
  <div class="grid" id="grid"></div>

  <script>
    let allVenues = [];
    let currentFilter = 'all';

    async function loadVenues() {
      const resp = await fetch('/data/all-venues.json');
      const data = await resp.json();
      allVenues = data.venues || data;
      updateStats();
      renderGrid();
    }

    function getLogoType(v) {
      if (!v.logo_url || v.logo_url.length === 0) return 'missing';
      if (v.logo_url.includes('supabase')) return 'supabase';
      return 'local';
    }

    function updateStats() {
      const total = allVenues.length;
      const supabase = allVenues.filter(v => getLogoType(v) === 'supabase').length;
      const local = allVenues.filter(v => getLogoType(v) === 'local').length;
      const missing = allVenues.filter(v => getLogoType(v) === 'missing').length;
      document.getElementById('stats').innerHTML = 
        `<span>${total}</span> total venues · <span>${supabase}</span> Supabase CDN · <span>${local}</span> local/other · <span>${missing}</span> no logo`;
    }

    function renderGrid() {
      const search = document.getElementById('search').value.toLowerCase();
      const grid = document.getElementById('grid');
      document.getElementById('loading').style.display = 'none';

      let filtered = allVenues.filter(v => {
        const type = getLogoType(v);
        if (currentFilter !== 'all' && type !== currentFilter) return false;
        if (search) {
          const hay = `${v.name} ${v.state} ${v.id} ${v.city}`.toLowerCase();
          return hay.includes(search);
        }
        return true;
      });

      grid.innerHTML = filtered.map(v => {
        const type = getLogoType(v);
        const logoHtml = v.logo_url 
          ? `<img src="${v.logo_url}" alt="${v.name}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=no-logo>BROKEN</div>'" />`
          : `<div class="no-logo">NO LOGO</div>`;
        const badgeClass = type === 'supabase' ? 'cdn' : type === 'local' ? 'local' : 'none';
        const badgeText = type === 'supabase' ? 'CDN' : type === 'local' ? 'LOCAL' : 'NONE';
        return `<div class="card ${type}">
          <div class="logo-wrap">${logoHtml}</div>
          <div class="name">${v.name}</div>
          <div class="meta">ID: ${v.id}</div>
          <span class="state-badge">${v.state || '??'}</span>
          <span class="source-badge ${badgeClass}">${badgeText}</span>
        </div>`;
      }).join('');
    }

    // Event listeners
    document.getElementById('search').addEventListener('input', renderGrid);
    document.querySelectorAll('.controls button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderGrid();
      });
    });

    loadVenues();
  </script>
</body>
</html>
