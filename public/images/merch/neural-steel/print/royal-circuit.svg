<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3600" height="4800" viewBox="0 0 3600 4800" role="img" aria-labelledby="title desc">
  <title id="title">Royal Circuit</title>
  <desc id="desc">Five engineered poker cards rise from a faceted electric-blue diamond.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f7c88"/>
      <stop offset="0.22" stop-color="#f3f8fc"/>
      <stop offset="0.48" stop-color="#9aa9b6"/>
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#596673"/>
    </linearGradient>
    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222d38"/>
      <stop offset="0.5" stop-color="#070b11"/>
      <stop offset="1" stop-color="#121b24"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafaff"/>
      <stop offset="0.28" stop-color="#62dbff"/>
      <stop offset="0.58" stop-color="#0078ff"/>
      <stop offset="1" stop-color="#052c76"/>
    </linearGradient>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="card" d="M1260 620 L2250 620 L2380 750 L2380 2860 L2250 2990 L1260 2990 L1130 2860 L1130 750 Z"/>
    <path id="spade" d="M1755 1040 C1535 1280 1375 1425 1375 1665 C1375 1870 1545 1980 1725 1890 C1685 2070 1595 2180 1460 2260 L2050 2260 C1915 2180 1825 2070 1785 1890 C1965 1980 2135 1870 2135 1665 C2135 1425 1975 1280 1755 1040 Z"/>
    <g id="cardFace">
      <use xlink:href="#card" fill="url(#gunmetal)" stroke="#07111e" stroke-width="170" stroke-linejoin="miter"/>
      <use xlink:href="#card" fill="url(#gunmetal)" stroke="url(#steel)" stroke-width="92" stroke-linejoin="miter"/>
      <use xlink:href="#card" fill="none" stroke="#00a8ff" stroke-width="28" stroke-linejoin="miter"/>
      <use xlink:href="#spade" fill="#07111e" stroke="url(#steel)" stroke-width="56" stroke-linejoin="miter"/>
      <use xlink:href="#spade" fill="none" stroke="#00a8ff" stroke-width="18" filter="url(#blueGlow)"/>
      <g fill="none" stroke="#00a8ff" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M1300 920 H1490 V1110 H1595"/>
        <path d="M2210 920 H2020 V1110 H1915"/>
        <path d="M1290 2550 H1510 V2380 H1620"/>
        <path d="M2220 2550 H2000 V2380 H1890"/>
      </g>
      <g fill="#dff7ff" stroke="#00a8ff" stroke-width="20">
        <circle cx="1300" cy="920" r="34"/><circle cx="2210" cy="920" r="34"/>
        <circle cx="1290" cy="2550" r="34"/><circle cx="2220" cy="2550" r="34"/>
      </g>
    </g>
  </defs>

  <g transform="rotate(-31 1755 2450) translate(-115 -120)"><use xlink:href="#cardFace"/></g>
  <g transform="rotate(31 1755 2450) translate(115 -120)"><use xlink:href="#cardFace"/></g>
  <g transform="rotate(-16 1755 2450) translate(-55 -40)"><use xlink:href="#cardFace"/></g>
  <g transform="rotate(16 1755 2450) translate(55 -40)"><use xlink:href="#cardFace"/></g>
  <g><use xlink:href="#cardFace"/></g>

  <g stroke-linejoin="miter">
    <path d="M1755 2320 L2505 3220 L2240 4020 L1755 4480 L1270 4020 L1005 3220 Z" fill="#05080d" stroke="#07111e" stroke-width="190"/>
    <path d="M1755 2320 L2505 3220 L2240 4020 L1755 4480 L1270 4020 L1005 3220 Z" fill="url(#gunmetal)" stroke="url(#steel)" stroke-width="96"/>
    <path d="M1755 2320 L2505 3220 L2240 4020 L1755 4480 L1270 4020 L1005 3220 Z" fill="none" stroke="#00a8ff" stroke-width="26" filter="url(#blueGlow)"/>
    <path d="M1755 2630 L2240 3270 L1755 4030 L1270 3270 Z" fill="url(#diamond)" stroke="#dff7ff" stroke-width="54"/>
    <path d="M1755 2630 L1755 4030 M1270 3270 H2240 M1755 2630 L1510 3270 L1755 4030 L2000 3270 Z" fill="none" stroke="#eafaff" stroke-width="24" opacity="0.85"/>
    <path d="M1040 3180 L520 3500 L1085 3550 M2470 3180 L2990 3500 L2425 3550" fill="none" stroke="url(#steel)" stroke-width="92"/>
    <path d="M1180 3820 L720 4140 L1320 4080 M2330 3820 L2790 4140 L2190 4080" fill="none" stroke="#00a8ff" stroke-width="34"/>
  </g>
</svg>
