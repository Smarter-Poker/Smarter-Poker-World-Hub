<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0a1628; color: white; font-family: sans-serif; }
        .card { 
            width: 300px; 
            margin: 20px; 
            border: 1px solid red; 
            display: inline-block; 
            vertical-align: top;
        }
        img { width: 100%; display: block; }
        .check {
            background-image: linear-gradient(45deg, #808080 25%, transparent 25%), linear-gradient(-45deg, #808080 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #808080 75%), linear-gradient(-45deg, transparent 75%, #808080 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body>
    <h1>Test Results (20% Fuzz Floodfill)</h1>
    
    <div class="card">
        <h3>MTT Scenarios (Dark BG)</h3>
        <img src="mtt-scenarios_test.png">
    </div>
    
    <div class="card check">
        <h3>MTT Scenarios (Check BG)</h3>
        <img src="mtt-scenarios_test.png">
    </div>

    <div class="card">
        <h3>GTO Master (Dark BG)</h3>
        <img src="gto-master_test.png">
    </div>

    <div class="card check">
        <h3>GTO Master (Check BG)</h3>
        <img src="gto-master_test.png">
    </div>
</body>
</html>
