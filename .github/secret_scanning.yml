# Secret Scanning Configuration
# https://docs.github.com/en/code-security/secret-scanning
#
# 2026-08-15: `**/*.md` and `**/*.txt` were previously excluded here. That is
# why a live service_role JWT pasted into an audit log went unflagged. Do not
# re-add extension-based excludes.

paths-ignore:
  - '**/node_modules/**'
  - '**/.next/**'
  - '**/dist/**'
