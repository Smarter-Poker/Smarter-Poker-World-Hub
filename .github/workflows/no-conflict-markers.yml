# Fails any push or PR that contains unresolved git merge-conflict markers
# in tracked source files. Caught by Phase 42 audit after several
# migration files were committed with markers buried in them.
name: No Conflict Markers
on:
  push:
    branches: [main]
    # COST: every Club Arena merge rsyncs a compiled bundle into this repo and
    # pushes it to main. On 2026-08-22 that happened 76 times, and each one woke
    # nine workflows here that have nothing to say about minified output — 947
    # runs in Club Arena produced 950 in World Hub. GitHub bills per JOB rounded
    # up to a whole minute, so a 20-second guard costs a full minute.
    #
    # ONLY the `push` trigger is filtered. Never add paths-ignore to
    # `pull_request`: a PR touching only these paths would then never report
    # this context, and a required check that never reports is a pull request
    # that never merges.
    # Skipped here because the bundle is produced by a fresh build + rsync --delete, so it cannot contain a conflict marker.
    paths-ignore:
      - 'public/hub/club-arena/**'
  pull_request:
    branches: [main]
# A newer push supersedes an older run. Without this, a burst of merges
# leaves a queue of runs all checking commits that are no longer the tip,
# and every one of them is billed.
concurrency:
  group: no-conflict-markers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The context a ruleset can require is the JOB name, not the workflow name.
    # Both this job and undefined-identifier-guard's were called `check`, so
    # both reported as the context `check` and a required-checks rule naming it
    # would have been ambiguous - satisfiable by whichever reported first.
    name: No Conflict Markers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Scan for conflict markers
        shell: bash
        run: |
          # Look for any unescaped marker line in tracked source files.
          # Excludes node_modules + dist + .next via path filter; ripgrep
          # respects .gitignore by default.
          set -e
          if grep -rEn '^<<<<<<< |^>>>>>>> |^======= ' \
               --include='*.sql' \
               --include='*.js' \
               --include='*.jsx' \
               --include='*.ts' \
               --include='*.tsx' \
               --include='*.md' \
               --include='*.yml' \
               --include='*.yaml' \
               --include='*.json' \
               --exclude-dir=node_modules \
               --exclude-dir=.next \
               --exclude-dir=dist \
               --exclude-dir=public \
               .; then
              echo ""
              echo "::error::Conflict markers found in tracked files. Resolve them before merging."
              exit 1
          fi
          echo "OK — no conflict markers."
