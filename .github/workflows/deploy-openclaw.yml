name: Deploy Open Claw Cron Dispatcher

# Auto-deploys scripts/openclaw-cron-dispatcher.py to the openclaw VM on
# Hetzner whenever it changes on main, and restarts systemd openclaw.service.
#
# Uses the SAME repo secrets as the YT worker deploy
# (HETZNER_SSH_PRIVATE_KEY, HETZNER_HOST, HETZNER_SSH_USER) — Open Claw runs
# on the same Hetzner CX22 box as the worker, just under a different systemd
# unit (openclaw.service) and a different install path (/opt/openclaw/).
#
# Note: this workflow uses `on: push`, NOT `schedule:`, so it does not
# violate the cron-governance rule in CLAUDE.md §11.5.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/openclaw-cron-dispatcher.py'
      - '.github/workflows/deploy-openclaw.yml'
  workflow_dispatch:

concurrency:
  group: deploy-openclaw
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Trust Hetzner host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Diff local dispatcher vs remote (idempotent skip if same)
        id: diff
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_SSH_USER || 'openclaw' }}
        run: |
          LOCAL_SHA=$(sha256sum scripts/openclaw-cron-dispatcher.py | cut -d' ' -f1)
          # tolerate missing remote file (first deploy) — sha256sum exits 1 then,
          # which would `set -e` us out without the `|| echo`
          REMOTE_SHA=$(ssh -o BatchMode=yes "$USER@$HOST" \
            "sudo sha256sum /opt/openclaw/dispatcher.py 2>/dev/null | cut -d' ' -f1 || echo missing")
          echo "local:  $LOCAL_SHA"
          echo "remote: $REMOTE_SHA"
          if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dispatcher SHA unchanged — skipping scp + restart"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: scp dispatcher + restart systemd + verify
        if: steps.diff.outputs.skip != 'true'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_SSH_USER || 'openclaw' }}
        run: |
          # Use a staging path the openclaw user can write to without sudo,
          # then move into /opt/openclaw/ as root via sudo.
          scp scripts/openclaw-cron-dispatcher.py \
            "$USER@$HOST:/tmp/openclaw-cron-dispatcher.py"
          ssh "$USER@$HOST" '
            set -e
            # Make sure the install dir exists (idempotent — first deploy safe)
            sudo mkdir -p /opt/openclaw
            sudo mv /tmp/openclaw-cron-dispatcher.py /opt/openclaw/dispatcher.py
            sudo chmod 0644 /opt/openclaw/dispatcher.py
            # Restart the systemd unit. is-active check before we move on so a
            # crashed dispatcher fails this step instead of silently dying.
            sudo systemctl restart openclaw.service
            sleep 3
            sudo systemctl is-active openclaw.service
            echo "--- last 30 dispatcher log lines ---"
            sudo journalctl -u openclaw.service -n 30 --no-pager
          '
