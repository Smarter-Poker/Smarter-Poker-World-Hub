name: Deploy Open Claw Dispatcher + Script Jobs

# Immutable Open Claw releases. Host-managed credentials are validated in
# place, never printed, copied into artifacts, derived from one another, or
# overwritten by deployment. GitHub-managed delivery keys are main's legacy
# alert keys plus the API-restricted YouTube discovery key. They are merged
# key by key and atomically after the full contract validates.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/openclaw-cron-dispatcher.py'
      - 'scripts/video_source_registry_ingest.py'
      - 'scripts/video_enrichment_worker.py'
      - 'scripts/video_reel_candidate_worker.py'
      - 'scripts/video_library_to_reels.py'
      - 'scripts/openclaw-requirements.txt'
      - 'scripts/openclaw-requirements.lock'
      - 'scripts/openclaw.service'
      - 'supabase/migrations/20260906235959_video_reels_integrity_foundation.sql'
      - '.github/workflows/deploy-openclaw.yml'
  workflow_dispatch:
    inputs:
      source_registry_max_sources:
        description: Bounded registry sources to ingest after exact-main promotion
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '25'
          - '100'
      publisher_backfill_batches:
        description: Verified 500-item Reel publisher batches to run after promotion
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
      publisher_backfill_cleanup_operations:
        description: Exact stale backfill operation identities as run_id:attempt CSV
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-openclaw
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require the exact merged main revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPENCLAW_SSH_PRIVATE_KEY }}

      # Canonical openclaw-dispatcher: Hetzner server 127861894.
      - name: Trust the independently pinned Open Claw host key
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          EXPECTED_ED25519_FINGERPRINT: SHA256:MnBhnIy9+ocCKI8Dlg74XgqBIdMK+M7TNFKMC9OeVyM
        run: |
          set -euo pipefail
          test -n "$HOST"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -t ed25519 -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          actual_fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | sort -u)"
          test "$actual_fingerprint" = "$EXPECTED_ED25519_FINGERPRINT"
          chmod 0600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host *' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' > ~/.ssh/config
          chmod 0600 ~/.ssh/config

      - name: Stop explicitly identified stale Reel backfill units
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publisher_backfill_cleanup_operations != '' }}
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
          CLEANUP_OPERATIONS: ${{ inputs.publisher_backfill_cleanup_operations }}
        run: |
          set -euo pipefail
          normalized_operations="$(python3 - "$CLEANUP_OPERATIONS" <<'PY'
          import re
          import sys

          raw = sys.argv[1]
          if len(raw) > 256:
              raise SystemExit('cleanup operation list is too long')
          operations = [item.strip() for item in raw.split(',')]
          if not 1 <= len(operations) <= 10:
              raise SystemExit('cleanup requires between one and ten operation identities')
          if len(set(operations)) != len(operations):
              raise SystemExit('cleanup operation identities must be unique')
          for operation in operations:
              if not re.fullmatch(r'[1-9][0-9]*:[1-9][0-9]{0,2}', operation):
                  raise SystemExit('cleanup identities must be run_id:attempt')
              print(operation)
          PY
          )"
          mapfile -t cleanup_operations <<< "$normalized_operations"
          test "${#cleanup_operations[@]}" -ge 1
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$HOST" 'bash -s' -- "${cleanup_operations[@]}" <<'EOSSH'
          set -euo pipefail
          for operation in "$@"; do
            run_id="${operation%%:*}"
            run_attempt="${operation##*:}"
            case "$run_id" in (*[!0-9]*|'') exit 2 ;; esac
            case "$run_attempt" in (*[!0-9]*|'') exit 2 ;; esac
            for batch in 1 2 3; do
              unit="openclaw-reels-backfill-${run_id}-${run_attempt}-${batch}.service"
              load_state="$(sudo systemctl show "$unit" -p LoadState --value 2>/dev/null || true)"
              if [ -z "$load_state" ] || [ "$load_state" = not-found ]; then
                printf 'Reel backfill unit absent: %s\n' "$unit"
                continue
              fi
              sudo systemctl stop "$unit"
              active_state="$(sudo systemctl show "$unit" -p ActiveState --value 2>/dev/null || true)"
              case "$active_state" in (''|inactive|failed) ;; (*) exit 1 ;; esac
              sudo systemctl reset-failed "$unit" >/dev/null 2>&1 || true
              printf 'Reel backfill unit stopped: %s\n' "$unit"
            done
          done
          EOSSH

      - name: Verify runtime and prepare release directories
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
        run: |
          ssh "$SSH_USER@$HOST" 'bash -s' <<'EOSSH'
          set -euo pipefail
          # Runtime provisioning is separate; publication never installs on Hetzner.
          test -x /usr/bin/python3
          command -v curl >/dev/null
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 10), "Open Claw lock requires CPython 3.10"'
          id -u openclaw >/dev/null
          # The incumbent dispatcher (possibly the hand-installed legacy unit
          # with WorkingDirectory=/opt/openclaw, running as openclaw) keeps
          # running until promotion. Nothing here changes the owner or mode of
          # an existing directory: /opt/openclaw becomes root-owned only inside
          # the promotion step, whose rollback restores the captured original.
          # Only the new release root and missing runtime directories are made.
          if sudo test -L /opt/openclaw; then exit 1; fi
          if ! sudo test -e /opt/openclaw; then
            sudo install -d -o root -g root -m 0755 /opt/openclaw
          fi
          sudo test -d /opt/openclaw
          if sudo test -L /opt/openclaw/releases; then exit 1; fi
          if ! sudo test -e /opt/openclaw/releases; then
            sudo install -d -o root -g root -m 0755 /opt/openclaw/releases
          fi
          test "$(sudo stat -c '%U:%G %a' /opt/openclaw/releases)" = 'root:root 755'
          for runtime_dir in \
            /opt/openclaw/.smarter-poker \
            /opt/openclaw/.smarter-poker/logs \
            /var/log/openclaw \
            /var/lib/openclaw \
            /var/lib/openclaw/evidence; do
            if sudo test -L "$runtime_dir"; then exit 1; fi
            if ! sudo test -e "$runtime_dir"; then
              sudo install -d -o openclaw -g openclaw -m 0750 "$runtime_dir"
            fi
            sudo test -d "$runtime_dir"
            sudo -u openclaw -- test -w "$runtime_dir"
          done
          EOSSH

      # Legacy alert delivery keys stay GitHub-managed exactly as on main:
      # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER and
      # ADMIN_PHONE. A configured secret replaces only its own key, after the
      # whole merged contract validates, through a root-owned 0600 temporary
      # file and one atomic rename. Outer copy/paste whitespace is normalized.
      # An unset or still-malformed secret is never uploaded and leaves the
      # host value alone; the complete host contract is then required below,
      # so fallback cannot turn a missing/invalid destination into a pass.
      # YOUTUBE_DATA_API_KEY is also GitHub-managed because the supported
      # registry worker requires it for every scheduled discovery cycle. Every
      # other key (CRON_SECRET, WORKERS_CRON_SECRET, Supabase and routing) stays
      # host-managed. Values are never printed; diagnostics name only the key.
      - name: Validate the complete runtime contract and merge managed delivery keys
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          managed="$(mktemp "$RUNNER_TEMP/openclaw-managed-alert.XXXXXX")"
          trap 'rm -f -- "$managed"' EXIT
          python3 - "$managed" <<'PY'
          import os
          import sys

          MANAGED_KEYS = (
              'TWILIO_ACCOUNT_SID', 'TWILIO_AUTH_TOKEN', 'TWILIO_PHONE_NUMBER',
              'ADMIN_PHONE', 'YOUTUBE_DATA_API_KEY',
          )
          lines = []
          for key in MANAGED_KEYS:
              raw_value = os.environ.get(key, '')
              if not raw_value:
                  continue
              value = raw_value.strip()
              if (len(value) < 2 or any(ch.isspace() for ch in value)
                      or any(ch in value for ch in ('"', "'", '\\'))):
                  print(
                      f'::warning title=Open Claw managed secret fallback::{key} is malformed; '
                      'retaining the validated host value',
                      file=sys.stderr,
                  )
                  continue
              lines.append(f'{key}={value}\n')
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              handle.writelines(lines)
          PY
          scp "$managed" "$SSH_USER@$HOST:openclaw-managed-alert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          ssh "$SSH_USER@$HOST" 'bash -s' -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'EOSSH'
          set -euo pipefail
          case "$1" in (*[!0-9]*|'') exit 2 ;; esac
          case "$2" in (*[!0-9]*|'') exit 2 ;; esac
          managed_upload="$HOME/openclaw-managed-alert-$1-$2.env"
          trap 'rm -f -- "$managed_upload"' EXIT
          test -f "$managed_upload"
          test ! -L "$managed_upload"
          sudo test -f /etc/openclaw.env
          if sudo test -L /etc/openclaw.env; then exit 1; fi
          test "$(sudo stat -c '%U:%G %a' /etc/openclaw.env)" = 'root:root 600'
          sudo /usr/bin/python3 - /etc/openclaw.env "$managed_upload" <<'PY'
          import ipaddress
          import os
          import re
          import sys
          import tempfile
          import urllib.parse
          from pathlib import Path

          ENV_PATH = Path(sys.argv[1])
          MANAGED_PATH = Path(sys.argv[2])
          MANAGED_KEYS = (
              'TWILIO_ACCOUNT_SID', 'TWILIO_AUTH_TOKEN', 'TWILIO_PHONE_NUMBER',
              'ADMIN_PHONE', 'YOUTUBE_DATA_API_KEY',
          )

          def parse(text):
              values = {}
              for line_number, raw in enumerate(text.splitlines(), 1):
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  if '=' not in line:
                      raise SystemExit(f'invalid /etc/openclaw.env line {line_number}')
                  key, value = line.split('=', 1)
                  key = key.strip()
                  if not re.fullmatch(r'[A-Z][A-Z0-9_]*', key):
                      raise SystemExit(f'invalid /etc/openclaw.env key at line {line_number}')
                  if key in values:
                      raise SystemExit(f'duplicate /etc/openclaw.env key: {key}')
                  value = value.strip()
                  if value[:1] in ('"', "'"):
                      if len(value) < 2 or value[-1] != value[0]:
                          raise SystemExit(f'unbalanced quotes for /etc/openclaw.env key: {key}')
                      value = value[1:-1]
                  elif value[-1:] in ('"', "'"):
                      raise SystemExit(f'unbalanced quotes for /etc/openclaw.env key: {key}')
                  values[key] = value
              return values

          original = ENV_PATH.read_bytes()
          original_text = original.decode('utf-8')
          values = parse(original_text)

          managed = {}
          for line_number, raw in enumerate(MANAGED_PATH.read_text(encoding='utf-8').splitlines(), 1):
              key, separator, value = raw.partition('=')
              if not separator or key not in MANAGED_KEYS or key in managed:
                  raise SystemExit(f'unexpected managed delivery line {line_number}')
              if (len(value) < 2 or any(ch.isspace() for ch in value)
                      or any(ch in value for ch in ('"', "'", '\\'))):
                  raise SystemExit(f'malformed managed delivery key: {key}')
              managed[key] = value

          merged = dict(values)
          merged.update(managed)

          def required(name, minimum=1):
              value = merged.get(name, '')
              if (len(value) < minimum or value != value.strip()
                      or any(ch.isspace() for ch in value) or any(ch in value for ch in ('"', '\\'))):
                  raise SystemExit(f'missing or malformed /etc/openclaw.env key: {name}')
              return value

          required('CRON_SECRET', 20)
          required('WORKERS_CRON_SECRET', 20)
          required('SUPABASE_SERVICE_ROLE_KEY', 20)
          supabase = urllib.parse.urlsplit(required('NEXT_PUBLIC_SUPABASE_URL'))
          if (supabase.scheme != 'https' or not supabase.hostname
                  or supabase.username or supabase.password or supabase.query or supabase.fragment
                  or supabase.path not in ('', '/')):
              raise SystemExit('NEXT_PUBLIC_SUPABASE_URL must be a credential-free HTTPS origin')
          workers = urllib.parse.urlsplit(required('WORKERS_BASE_URL'))
          if (workers.scheme not in ('http', 'https') or not workers.hostname
                  or workers.username or workers.password or workers.query or workers.fragment
                  or workers.path not in ('', '/')):
              raise SystemExit('WORKERS_BASE_URL must be a credential-free HTTP(S) origin')
          ipaddress.ip_address(required('DISPATCHER_PRIVATE_IP'))
          if required('DISPATCHER_ROLE') not in ('primary', 'secondary'):
              raise SystemExit('DISPATCHER_ROLE must be primary or secondary')
          # Require every GitHub-managed delivery key before promotion.
          for key in MANAGED_KEYS:
              required(key, 2)

          changed = sorted(key for key, value in managed.items() if values.get(key) != value)
          if not changed:
              print('Runtime contract valid; managed delivery keys unchanged')
              raise SystemExit(0)

          merged_lines = []
          replaced = set()
          for raw in original_text.splitlines():
              line = raw.strip()
              key = line.split('=', 1)[0].strip() if '=' in line and not line.startswith('#') else ''
              if key in managed:
                  merged_lines.append(f'{key}={managed[key]}')
                  replaced.add(key)
              else:
                  merged_lines.append(raw)
          merged_lines.extend(f'{key}={managed[key]}' for key in MANAGED_KEYS
                              if key in managed and key not in replaced)
          content = '\n'.join(merged_lines) + '\n'
          if parse(content) != merged:
              raise SystemExit('merged /etc/openclaw.env does not round-trip')

          # mkstemp creates the file 0600 and owned by the effective user (root
          # under sudo); the caller re-checks root:root 600 after the rename.
          descriptor, staged = tempfile.mkstemp(prefix='.openclaw.env.', dir=str(ENV_PATH.parent))
          try:
              with os.fdopen(descriptor, 'w', encoding='utf-8') as handle:
                  handle.write(content)
                  handle.flush()
                  os.fsync(handle.fileno())
              if ENV_PATH.read_bytes() != original:
                  raise SystemExit('/etc/openclaw.env changed during validation; not replaced')
              os.replace(staged, ENV_PATH)
          except BaseException:
              if os.path.lexists(staged):
                  os.unlink(staged)
              raise
          directory = os.open(str(ENV_PATH.parent), os.O_RDONLY)
          try:
              os.fsync(directory)
          finally:
              os.close(directory)
          print('Runtime contract valid; merged managed delivery keys: ' + ', '.join(changed))
          PY
          test "$(sudo stat -c '%U:%G %a' /etc/openclaw.env)" = 'root:root 600'
          EOSSH

      - name: Build on the runner, import and preflight immutable release
        env:
          BUILD_IMAGE: ${{ vars.VIDEO_OPENCLAW_BUILD_IMAGE }}
          HOST: ${{ secrets.OPENCLAW_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def normalized(name):
              return re.sub(r'[-_.]+', '-', name).lower()

          direct = {}
          for raw in Path('scripts/openclaw-requirements.txt').read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              match = re.fullmatch(r'([A-Za-z0-9_.-]+)==([^\s]+)', line)
              if not match:
                  raise SystemExit(f'unpinned direct Open Claw requirement: {line}')
              direct[normalized(match.group(1))] = match.group(2)

          locked = {}
          for raw in Path('scripts/openclaw-requirements.lock').read_text().splitlines():
              match = re.match(r'^([A-Za-z0-9_.-]+)(?:\[[A-Za-z0-9_,.-]+\])?==([^\s]+)\s+\\$', raw)
              if match:
                  locked[normalized(match.group(1))] = match.group(2)

          mismatch = {
              name: (version, locked.get(name))
              for name, version in direct.items()
              if locked.get(name) != version
          }
          if mismatch:
              raise SystemExit(f'Direct Open Claw requirements do not match hash lock: {mismatch}')
          PY
          # GitHub-hosted runners hold no pre-seeded build image. Pull only an
          # immutable registry digest; the selection below still re-validates the
          # reference, the resolved image ID and the platform before anything
          # runs, and a bare image ID that is not present fails closed there.
          if [[ "$BUILD_IMAGE" =~ ^[a-zA-Z0-9./:_-]+@sha256:[0-9a-f]{64}$ ]]; then
            timeout --signal=TERM --kill-after=10s 600s \
              docker pull --quiet --platform linux/amd64 "$BUILD_IMAGE" >/dev/null
          fi
          # Existing lock is Linux x86_64/CPython3.10; no host/site dependencies.
          # Accept only immutable registry digests or a qualified local image ID.
          [[ "$BUILD_IMAGE" =~ ^([a-zA-Z0-9./:_-]+@)?sha256:[0-9a-f]{64}$ ]] || exit 1
          image_id="$(docker image inspect --format '{{.Id}}' "$BUILD_IMAGE")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          if [[ "$BUILD_IMAGE" = sha256:* ]]; then test "$image_id" = "$BUILD_IMAGE"; fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" = linux/amd64
          local_stage="$(mktemp -d "$RUNNER_TEMP/openclaw-stage.XXXXXX")"
          build_container="wh-openclaw-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$build_container" >/dev/null 2>&1 || true; rm -rf -- "$local_stage"' EXIT
          cp scripts/openclaw-cron-dispatcher.py scripts/video_source_registry_ingest.py scripts/video_enrichment_worker.py scripts/video_reel_candidate_worker.py \
            scripts/video_library_to_reels.py scripts/openclaw-requirements.txt \
            scripts/openclaw-requirements.lock "$local_stage/"
          timeout --signal=TERM --kill-after=10s 900s docker run --rm --pull=never \
            --name "$build_container" --platform linux/amd64 --cpus=2 \
            --memory=1g --memory-swap=1g --pids-limit=256 --read-only \
            --tmpfs /tmp:rw,nosuid,size=256m --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$local_stage,dst=/release" \
            --workdir /release --entrypoint /bin/sh "$image_id" -eu -c '
              python3 -c "import sys,platform; assert sys.version_info[:2] == (3,10); assert platform.machine() == \"x86_64\""
              python3 -m pip install --disable-pip-version-check --no-cache-dir \
                --no-compile --only-binary=:all: --require-hashes \
                --target vendor --requirement openclaw-requirements.lock
              PYTHONPATH=/release/vendor python3 -s -c "import apscheduler,requests,supabase,yt_dlp"
            '
          # The import probe must not add timestamp-bearing bytecode to the
          # immutable input. Otherwise two builds of one SHA can produce
          # different manifests and a safe same-SHA backfill dispatch cannot
          # prove it is reusing the release that main already promoted.
          test -z "$(find "$local_stage" -type d -name __pycache__ -print -quit)"
          test -z "$(find "$local_stage" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
          (cd "$local_stage" && find . -type f ! -name release-manifest.sha256 -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > release-manifest.sha256)
          archive="$RUNNER_TEMP/openclaw-${GITHUB_SHA}.tgz"
          upload="openclaw-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          tar -czf "$archive" -C "$local_stage" .
          manifest_hash="$(sha256sum "$local_stage/release-manifest.sha256" | awk '{print $1}')"
          archive_hash="$(sha256sum "$archive" | awk '{print $1}')"
          dispatcher_hash="$(sha256sum scripts/openclaw-cron-dispatcher.py | awk '{print $1}')"
          scraper_hash="$(sha256sum scripts/video_source_registry_ingest.py | awk '{print $1}')"
          enrichment_hash="$(sha256sum scripts/video_enrichment_worker.py | awk '{print $1}')"
          candidate_hash="$(sha256sum scripts/video_reel_candidate_worker.py | awk '{print $1}')"
          publisher_hash="$(sha256sum scripts/video_library_to_reels.py | awk '{print $1}')"
          lock_hash="$(sha256sum scripts/openclaw-requirements.lock | awk '{print $1}')"
          scp "$archive" "$SSH_USER@$HOST:$upload"
          ssh "$SSH_USER@$HOST" 'bash -s' -- \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$archive_hash" "$dispatcher_hash" "$scraper_hash" "$enrichment_hash" "$candidate_hash" "$publisher_hash" "$lock_hash" "$manifest_hash" <<'EOSSH'
          set -euo pipefail
          release_sha="$1"
          run_id="$2"
          run_attempt="$3"
          archive_hash="$4"
          dispatcher_hash="$5"
          scraper_hash="$6"
          enrichment_hash="$7"
          candidate_hash="$8"
          publisher_hash="$9"
          lock_hash="${10}"
          manifest_hash="${11}"
          case "$release_sha" in (*[!0-9a-f]*|'') exit 2 ;; esac
          test "${#release_sha}" -eq 40
          case "$run_id" in (*[!0-9]*|'') exit 2 ;; esac
          case "$run_attempt" in (*[!0-9]*|'') exit 2 ;; esac
          for expected_hash in "$archive_hash" "$dispatcher_hash" "$scraper_hash" "$enrichment_hash" "$candidate_hash" "$publisher_hash" "$lock_hash" "$manifest_hash"; do
            case "$expected_hash" in (*[!0-9a-f]*|'') exit 2 ;; esac
            test "${#expected_hash}" -eq 64
          done

          upload="$HOME/openclaw-${release_sha}-${run_id}-${run_attempt}.tgz"
          release="/opt/openclaw/releases/${release_sha}"
          created=false
          keep_release=false
          cleanup() {
            status=$?
            rm -f "$upload"
            if [ "$created" = true ] && [ "$keep_release" != true ]; then
              test "$release" = "/opt/openclaw/releases/${release_sha}"
              sudo rm -rf -- "$release"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          echo "$archive_hash  $upload" | sha256sum -c -

          if sudo test -e "$release"; then
            test ! -L "$release"
            sudo test -d "$release"
            sudo test -f "$release/release-manifest.sha256"
            test "$(sudo stat -c '%U:%G' "$release")" = 'root:root'
            test -z "$(sudo find "$release" -xdev \( ! -user root -o ! -group root \) -print -quit)"
            test -z "$(sudo find "$release" -xdev -perm /022 -print -quit)"
            sudo sh -c "cd '$release' && sha256sum --quiet -c release-manifest.sha256"
          else
            sudo install -d -o root -g root -m 0755 "$release"
            created=true
            sudo tar --no-same-owner -xzf "$upload" -C "$release"
            test "$(sudo sha256sum "$release/release-manifest.sha256" | awk '{print $1}')" = "$manifest_hash"
            sudo chown -R root:root "$release"
            sudo chmod -R u=rwX,go=rX "$release"
            test -z "$(sudo find "$release" -xdev \( ! -user root -o ! -group root \) -print -quit)"
            test -z "$(sudo find "$release" -xdev -perm /022 -print -quit)"
            sudo sh -c "cd '$release' && sha256sum --quiet -c release-manifest.sha256"
          fi
          test "$(sudo sha256sum "$release/release-manifest.sha256" | awk '{print $1}')" = "$manifest_hash"
          sudo env -u PYTHONHOME -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$release/vendor" /usr/bin/python3 -s - "$release" <<'PY'
          import importlib.metadata, re, sys
          from pathlib import Path
          release = Path(sys.argv[1])
          expected = dict(re.findall(r'^([A-Za-z0-9_.-]+)(?:\[[A-Za-z0-9_,.-]+\])?==([^\s]+)\s+\\$', (release / 'openclaw-requirements.lock').read_text(), re.M))
          normalize = lambda value: re.sub(r'[-_.]+', '-', value).lower()
          actual = {normalize(d.metadata['Name']): d.version for d in importlib.metadata.distributions(path=[str(release / 'vendor')])}
          if actual != {normalize(k): v for k, v in expected.items()}:
              raise SystemExit('Open Claw installed dependency closure differs from lock')
          import apscheduler, requests, supabase, yt_dlp
          PY
          rm -f "$upload"

          test "$(sudo sha256sum "$release/openclaw-cron-dispatcher.py" | awk '{print $1}')" = "$dispatcher_hash"
          test "$(sudo sha256sum "$release/video_source_registry_ingest.py" | awk '{print $1}')" = "$scraper_hash"
          test "$(sudo sha256sum "$release/video_enrichment_worker.py" | awk '{print $1}')" = "$enrichment_hash"
          test "$(sudo sha256sum "$release/video_reel_candidate_worker.py" | awk '{print $1}')" = "$candidate_hash"
          test "$(sudo sha256sum "$release/video_library_to_reels.py" | awk '{print $1}')" = "$publisher_hash"
          test "$(sudo sha256sum "$release/openclaw-requirements.lock" | awk '{print $1}')" = "$lock_hash"

          run_preflight() {
            unit_name="$1"
            shift
            sudo systemd-run --quiet --wait --collect --unit "$unit_name" \
              --property Type=oneshot \
              --property User=openclaw \
              --property WorkingDirectory="$release" \
              --property EnvironmentFile=/etc/openclaw.env \
              --setenv=PYTHONNOUSERSITE=1 \
              --setenv=PYTHONDONTWRITEBYTECODE=1 \
              --setenv=SP_LOG_DIR=/var/log/openclaw \
              --setenv=SP_EVIDENCE_DIR=/var/lib/openclaw/evidence \
              /usr/bin/timeout --signal=TERM --kill-after=5s 140s "$@"
          }
          run_preflight "openclaw-dispatcher-preflight-${run_id}-${run_attempt}" \
            /usr/bin/env -u PYTHONHOME -u PYTHONPATH "PYTHONPATH=$release/vendor" /usr/bin/python3 -s "$release/openclaw-cron-dispatcher.py" --preflight-only
          run_preflight "openclaw-scraper-preflight-${run_id}-${run_attempt}" \
            /usr/bin/env -u PYTHONHOME -u PYTHONPATH "PYTHONPATH=$release/vendor" /usr/bin/python3 -s "$release/video_source_registry_ingest.py" --preflight-only
          run_preflight "openclaw-enrichment-preflight-${run_id}-${run_attempt}" \
            /usr/bin/env -u PYTHONHOME -u PYTHONPATH "PYTHONPATH=$release/vendor" /usr/bin/python3 -s "$release/video_enrichment_worker.py" --preflight-only
          run_preflight "openclaw-candidate-preflight-${run_id}-${run_attempt}" \
            /usr/bin/env -u PYTHONHOME -u PYTHONPATH "PYTHONPATH=$release/vendor" /usr/bin/python3 -s "$release/video_reel_candidate_worker.py" --preflight-only
          run_preflight "openclaw-publisher-preflight-${run_id}-${run_attempt}" \
            /usr/bin/env -u PYTHONHOME -u PYTHONPATH "PYTHONPATH=$release/vendor" /usr/bin/python3 -s "$release/video_library_to_reels.py" --preflight-only
          sudo systemd-run --quiet --wait --collect \
            --unit "openclaw-workers-auth-preflight-${run_id}-${run_attempt}" \
            --property Type=oneshot \
            --property EnvironmentFile=/etc/openclaw.env \
            /bin/bash -c '
              set -euo pipefail
              production_status="$(printf '\''header = "Authorization: Bearer %s"\n'\'' \
                "$CRON_SECRET" \
                | curl --disable --silent --show-error --output /dev/null --write-out '\''%{http_code}'\'' \
                    --connect-timeout 10 --max-time 20 --config - \
                    https://smarter.poker/api/internal/cron-auth-probe)"
              test "$production_status" = 200
              workers_status="$(printf '\''header = "Authorization: Bearer %s"\nheader = "X-Forwarded-For: %s"\n'\'' \
                "$WORKERS_CRON_SECRET" "$DISPATCHER_PRIVATE_IP" \
                | curl --disable --silent --show-error --output /dev/null --write-out '\''%{http_code}'\'' \
                    --connect-timeout 10 --max-time 20 --config - \
                    "$WORKERS_BASE_URL/cron/__auth_probe_no_such_route__")"
              test "$workers_status" = 404
            '
          keep_release=true
          trap - EXIT
          EOSSH

      - name: Atomically promote, restart, and verify exact release
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
        run: |
          set -euo pipefail
          unit_upload="openclaw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          unit_hash="$(sha256sum scripts/openclaw.service | awk '{print $1}')"
          dispatcher_hash="$(sha256sum scripts/openclaw-cron-dispatcher.py | awk '{print $1}')"
          scraper_hash="$(sha256sum scripts/video_source_registry_ingest.py | awk '{print $1}')"
          enrichment_hash="$(sha256sum scripts/video_enrichment_worker.py | awk '{print $1}')"
          candidate_hash="$(sha256sum scripts/video_reel_candidate_worker.py | awk '{print $1}')"
          publisher_hash="$(sha256sum scripts/video_library_to_reels.py | awk '{print $1}')"
          scp scripts/openclaw.service "$SSH_USER@$HOST:$unit_upload"
          ssh "$SSH_USER@$HOST" 'bash -s' -- \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$unit_hash" "$dispatcher_hash" "$scraper_hash" "$enrichment_hash" "$candidate_hash" "$publisher_hash" <<'EOSSH'
          set -euo pipefail
          release_sha="$1"
          run_id="$2"
          run_attempt="$3"
          unit_hash="$4"
          dispatcher_hash="$5"
          scraper_hash="$6"
          enrichment_hash="$7"
          candidate_hash="$8"
          publisher_hash="$9"
          case "$release_sha" in (*[!0-9a-f]*|'') exit 2 ;; esac
          test "${#release_sha}" -eq 40
          case "$run_id" in (*[!0-9]*|'') exit 2 ;; esac
          case "$run_attempt" in (*[!0-9]*|'') exit 2 ;; esac
          for expected_hash in "$unit_hash" "$dispatcher_hash" "$scraper_hash" "$enrichment_hash" "$candidate_hash" "$publisher_hash"; do
            case "$expected_hash" in (*[!0-9a-f]*|'') exit 2 ;; esac
            test "${#expected_hash}" -eq 64
          done

          release="/opt/openclaw/releases/${release_sha}"
          current=/opt/openclaw/current
          unit=/etc/systemd/system/openclaw.service
          unit_upload="$HOME/openclaw-${run_id}-${run_attempt}.service"
          unit_backup="/opt/openclaw/releases/.unit-backup-${run_id}-${run_attempt}"
          next_link="/opt/openclaw/.current-${run_id}-${run_attempt}"
          sudo test -d "$release"
          test ! -L "$release"
          sudo sh -c "cd '$release' && sha256sum --quiet -c release-manifest.sha256"
          test "$(sha256sum "$unit_upload" | awk '{print $1}')" = "$unit_hash"

          old_target=''
          had_current=false
          had_unit=false
          # The legacy layout has /opt/openclaw owned by openclaw. The immutable
          # layout needs it root-owned so the service account cannot swap
          # current or releases. Capture the incumbent owner and mode first so
          # rollback returns the legacy dispatcher its WorkingDirectory as it was.
          sudo test -d /opt/openclaw
          if sudo test -L /opt/openclaw; then exit 1; fi
          base_owner_before="$(sudo stat -c '%u:%g' /opt/openclaw)"
          base_mode_before="$(sudo stat -c '%a' /opt/openclaw)"
          case "$base_owner_before" in (*[!0-9:]*|:*|*:|'') exit 1 ;; esac
          case "$base_mode_before" in (*[!0-7]*|'') exit 1 ;; esac
          base_changed=false
          enabled_before="$(sudo systemctl is-enabled openclaw.service 2>/dev/null || true)"
          case "$enabled_before" in enabled|disabled) ;; *) exit 1 ;; esac
          active_before="$(sudo systemctl show openclaw.service -p ActiveState --value)"
          case "$active_before" in active|inactive) ;; *) exit 1 ;; esac
          was_active=false
          if sudo test -e "$current" || sudo test -L "$current"; then
            had_current=true
            sudo test -L "$current"
            old_target="$(sudo readlink "$current")"
          fi
          if sudo test -f "$unit"; then
            sudo cp -a "$unit" "$unit_backup"
            had_unit=true
          fi
          if [ "$active_before" = active ]; then
            was_active=true
          fi

          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$had_unit" = true ]; then
              sudo cp -a "$unit_backup" "$unit"
            else
              sudo rm -f "$unit"
            fi
            sudo rm -f "$current" "$next_link"
            if [ "$had_current" = true ]; then sudo ln -s "$old_target" "$current"; fi
            if [ "$base_changed" = true ]; then
              sudo chown "$base_owner_before" /opt/openclaw
              sudo chmod "$base_mode_before" /opt/openclaw
            fi
            sudo systemctl daemon-reload
            # The first immutable deploy migrates an active legacy unit that
            # has no /opt/openclaw/current symlink yet. Restoring that unit is
            # sufficient to restart it because legacy sources are retained
            # until after readiness succeeds.
            if [ "$was_active" = true ] && [ "$had_unit" = true ]; then
              sudo systemctl reset-failed openclaw.service >/dev/null 2>&1
              sudo systemctl restart openclaw.service
            else
              sudo systemctl stop openclaw.service
            fi
            sudo rm -f "$unit_backup"
            rm -f "$unit_upload"
            exit "$status"
          }
          trap rollback ERR

          if [ "$(sudo stat -c '%U:%G %a' /opt/openclaw)" != 'root:root 755' ]; then
            base_changed=true
            sudo chown root:root /opt/openclaw
            sudo chmod 0755 /opt/openclaw
          fi
          test "$(sudo stat -c '%U:%G %a' /opt/openclaw)" = 'root:root 755'
          test "$(sudo stat -c '%U:%G %a' /opt/openclaw/releases)" = 'root:root 755'
          # Re-verify the release now that no service account can rename it.
          test -z "$(sudo find "$release" -xdev \( ! -user root -o ! -group root \) -print -quit)"
          test -z "$(sudo find "$release" -xdev -perm /022 -print -quit)"
          sudo sh -c "cd '$release' && sha256sum --quiet -c release-manifest.sha256"
          sudo rm -f "$next_link"
          sudo ln -s "$release" "$next_link"
          sudo mv -Tf "$next_link" "$current"
          # Verify after the candidate symlink exists so the first immutable
          # migration does not fail merely because the unit's absolute
          # ExecStart paths had no /opt/openclaw/current target beforehand.
          sudo systemd-analyze verify "$unit_upload"
          sudo install -o root -g root -m 0644 "$unit_upload" "$unit"
          test "$(sudo sha256sum "$unit" | awk '{print $1}')" = "$unit_hash"
          sudo systemctl daemon-reload
          # BEGIN preserve-active-state
          if [ "$was_active" = true ]; then
          previous_invocation="$(sudo systemctl show openclaw.service -p InvocationID --value 2>/dev/null || true)"
          sudo systemctl reset-failed openclaw.service >/dev/null 2>&1 || true
          sudo systemctl restart openclaw.service
          invocation_one="$(sudo systemctl show openclaw.service -p InvocationID --value)"
          test -n "$invocation_one"
          test "$invocation_one" != "$previous_invocation"
          sudo systemctl is-active --quiet openclaw.service
          sleep 8
          sudo systemctl is-active --quiet openclaw.service
          invocation_two="$(sudo systemctl show openclaw.service -p InvocationID --value)"
          test "$invocation_two" = "$invocation_one"
          test "$(sudo readlink "$current")" = "$release"
          test "$(sudo sha256sum "$current/openclaw-cron-dispatcher.py" | awk '{print $1}')" = "$dispatcher_hash"
          test "$(sudo sha256sum "$current/video_source_registry_ingest.py" | awk '{print $1}')" = "$scraper_hash"
          test "$(sudo sha256sum "$current/video_enrichment_worker.py" | awk '{print $1}')" = "$enrichment_hash"
          test "$(sudo sha256sum "$current/video_reel_candidate_worker.py" | awk '{print $1}')" = "$candidate_hash"
          test "$(sudo sha256sum "$current/video_library_to_reels.py" | awk '{print $1}')" = "$publisher_hash"
          sudo sh -c "cd '$current' && sha256sum --quiet -c release-manifest.sha256"
          test "$(sudo systemctl show openclaw.service -p User --value)" = openclaw
          pid="$(sudo systemctl show openclaw.service -p MainPID --value)"
          test "${pid:-0}" -gt 1
          for key in \
            CRON_SECRET WORKERS_CRON_SECRET WORKERS_BASE_URL DISPATCHER_PRIVATE_IP DISPATCHER_ROLE \
            NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            sudo grep -zq "^${key}=" "/proc/$pid/environ"
          done
          for route in \
            /api/cron/video-library-scraper \
            /api/cron/video-reel-candidates \
            /api/cron/video-library-reels; do
            # Do not use grep -q here. With pipefail enabled, grep can close the
            # pipe on the first match and journalctl then exits on SIGPIPE (141),
            # turning a successful registration check into a failed release.
            sudo journalctl "_SYSTEMD_INVOCATION_ID=$invocation_two" --no-pager \
              | grep -F "Registered: $route  [" >/dev/null
          done
          if sudo journalctl "_SYSTEMD_INVOCATION_ID=$invocation_two" --no-pager \
            | grep -E 'ERROR|Exception|Traceback' >/dev/null; then
            # Never print the journal wholesale: service output can carry request
            # URLs, headers or environment-derived values. Show the unit state and
            # a bounded tail with credential-looking lines dropped and URL
            # userinfo, query strings, JWTs and long opaque strings masked.
            sudo systemctl status openclaw.service --no-pager --lines=0 | head -n 12 || true
            sudo journalctl "_SYSTEMD_INVOCATION_ID=$invocation_two" --no-pager \
              | grep -Eiv 'secret|token|passw|authorization|bearer|cookie|credential|api[_-]?key|service_role|environ' \
              | sed -E \
                  -e 's#(https?://)[^/@[:space:]]+@#\1[REDACTED]@#g' \
                  -e 's#[?][^[:space:]]*#?[REDACTED]#g' \
                  -e 's#eyJ[A-Za-z0-9_.-]+#[REDACTED]#g' \
                  -e 's#[A-Za-z0-9_+=-]{32,}#[REDACTED]#g' \
              | cut -c1-400 | tail -n 60 || true
            # `false`, not `exit 1`: an explicit exit bypasses the ERR trap and
            # would leave the failed release promoted without rollback.
            false
          fi

          else
            test "$(sudo systemctl show openclaw.service -p ActiveState --value)" = inactive
            echo "Immutable release verified; Open Claw remains inactive."
          fi
          # END preserve-active-state
          test "$(sudo systemctl is-enabled openclaw.service 2>/dev/null || true)" = "$enabled_before"
          test "$(sudo readlink "$current")" = "$release"
          sudo sh -c "cd '$current' && sha256sum --quiet -c release-manifest.sha256"

          trap - ERR
          sudo rm -f "$unit_backup"
          rm -f "$unit_upload"
          EOSSH

      - name: Run requested bounded source-registry ingestion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_registry_max_sources != '0' }}
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
          SOURCE_REGISTRY_MAX_SOURCES: ${{ inputs.source_registry_max_sources }}
        run: |
          set -euo pipefail
          case "$SOURCE_REGISTRY_MAX_SOURCES" in 25|100) ;; *) exit 2 ;; esac
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$HOST" 'bash -s' -- \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$SOURCE_REGISTRY_MAX_SOURCES" <<'EOSSH'
          set -euo pipefail
          release_sha="$1"
          run_id="$2"
          run_attempt="$3"
          max_sources="$4"
          case "$release_sha" in (*[!0-9a-f]*|'') exit 2 ;; esac
          test "${#release_sha}" -eq 40
          case "$run_id" in (*[!0-9]*|'') exit 2 ;; esac
          case "$run_attempt" in (*[!0-9]*|'') exit 2 ;; esac
          case "$max_sources" in 25|100) ;; *) exit 2 ;; esac

          current=/opt/openclaw/current
          release="/opt/openclaw/releases/${release_sha}"
          unit="openclaw-source-registry-${run_id}-${run_attempt}"
          sudo test -L "$current"
          test "$(sudo readlink "$current")" = "$release"
          sudo sh -c "cd '$current' && sha256sum --quiet -c release-manifest.sha256"
          sudo test -f /etc/openclaw.env
          test "$(sudo stat -c '%U:%G %a' /etc/openclaw.env)" = 'root:root 600'

          cleanup() {
            rc=$?
            trap - EXIT HUP INT TERM
            sudo systemctl stop "$unit.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "$unit.service" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT HUP INT TERM
          set +e
          sudo systemd-run \
            --quiet \
            --wait \
            --collect \
            --unit "$unit" \
            --property=User=openclaw \
            --property=Group=openclaw \
            --property=WorkingDirectory="$current" \
            --property=EnvironmentFile=/etc/openclaw.env \
            --property=RuntimeMaxSec=1200 \
            /usr/bin/env -u PYTHONHOME -u PYTHONPATH \
              "PYTHONPATH=$current/vendor" \
              /usr/bin/python3 -s "$current/video_source_registry_ingest.py" \
                --max-sources "$max_sources"
          worker_rc=$?
          set -e
          summary="$(sudo journalctl -u "$unit.service" --no-pager --output=cat | /usr/bin/python3 -c '
          import json
          import sys
          for line in reversed(sys.stdin.read().splitlines()):
              try:
                  payload = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(payload, dict) and "sources_processed" in payload and "totals" in payload:
                  print(json.dumps(payload, sort_keys=True))
                  raise SystemExit(0)
          raise SystemExit("registry ingestion emitted no structured summary")
          ')"
          test -n "$summary"
          /usr/bin/python3 - "$summary" "$worker_rc" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          worker_rc = int(sys.argv[2])
          if payload.get('sources_processed', 0) < 1:
              raise SystemExit('registry ingestion processed no sources')
          totals = payload.get('totals') or {}
          for key in ('candidates', 'qualified', 'inserted', 'duplicates', 'rejected', 'quota_units'):
              if not isinstance(totals.get(key), int) or totals[key] < 0:
                  raise SystemExit(f'invalid registry total: {key}')
          print(json.dumps({
              'sources_processed': payload['sources_processed'],
              'totals': totals,
              'failed_sources': [
                  {
                      'source_id': row.get('source_id'),
                      'source_name': row.get('source_name'),
                      'failure_code': row.get('failure_code'),
                  }
                  for row in payload.get('results', []) if row.get('status') == 'failed'
              ],
          }, sort_keys=True))
          if worker_rc:
              raise SystemExit(f'registry ingestion worker exited {worker_rc}')
          PY
          trap - EXIT HUP INT TERM
          EOSSH

      - name: Run requested bounded Reel backfill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publisher_backfill_batches != '0' }}
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
          PUBLISHER_BACKFILL_BATCHES: ${{ inputs.publisher_backfill_batches }}
        run: |
          set -euo pipefail
          case "$PUBLISHER_BACKFILL_BATCHES" in 1|2|3) ;; *) exit 2 ;; esac
          # A verified batch may run silently for several minutes while the
          # transient systemd unit waits on upstream video probes. Keep the
          # encrypted SSH transport active so an idle intermediary cannot
          # sever the proof-bearing wait before systemd returns its exit code.
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$HOST" 'bash -s' -- \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$PUBLISHER_BACKFILL_BATCHES" <<'EOSSH'
          set -euo pipefail
          release_sha="$1"
          run_id="$2"
          run_attempt="$3"
          batch_count="$4"
          case "$release_sha" in (*[!0-9a-f]*|'') exit 2 ;; esac
          test "${#release_sha}" -eq 40
          case "$run_id" in (*[!0-9]*|'') exit 2 ;; esac
          case "$run_attempt" in (*[!0-9]*|'') exit 2 ;; esac
          case "$batch_count" in 1|2|3) ;; *) exit 2 ;; esac

          current=/opt/openclaw/current
          release="/opt/openclaw/releases/${release_sha}"
          sudo test -L "$current"
          test "$(sudo readlink "$current")" = "$release"
          sudo sh -c "cd '$current' && sha256sum --quiet -c release-manifest.sha256"
          sudo test -f /etc/openclaw.env
          test "$(sudo stat -c '%U:%G %a' /etc/openclaw.env)" = 'root:root 600'

          active_unit=''
          cleanup_active_unit() {
            rc=$?
            trap - EXIT HUP INT TERM
            if [ -n "$active_unit" ]; then
              sudo systemctl stop "$active_unit.service" || rc=$?
              sudo systemctl reset-failed "$active_unit.service" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap cleanup_active_unit EXIT HUP INT TERM

          for batch in $(seq 1 "$batch_count"); do
            unit="openclaw-reels-backfill-${run_id}-${run_attempt}-${batch}"
            active_unit="$unit"
            # The interactive recovery path must close its feed-visibility
            # proof inside the script's 1,650-second budget and before the
            # 1,800-second unit ceiling. Exact run 36324447969 exhausted that
            # script budget after only 570 of 675 interleaved attempts. Exact
            # run 36327553029 then proved that --limit 500 still admitted an
            # independent 500-row auxiliary failure queue and timed out after
            # 718 fresh probes. This manual supply path therefore uses a
            # conservative 500-candidate bound and explicitly defers the
            # auxiliary failure queue to the ordinary scheduled maintenance
            # contract.
            if sudo systemd-run \
              --quiet \
              --wait \
              --collect \
              --unit "$unit" \
              --property=User=openclaw \
              --property=Group=openclaw \
              --property=WorkingDirectory="$current" \
              --property=EnvironmentFile=/etc/openclaw.env \
              --property=RuntimeMaxSec=1800 \
              /usr/bin/env -u PYTHONHOME -u PYTHONPATH \
                "PYTHONPATH=$current/vendor" \
                /usr/bin/python3 -s "$current/video_library_to_reels.py" \
                  --limit 500 --failure-verify-limit 0 --verify --release-recovery; then
              unit_rc=0
            else
              unit_rc=$?
            fi
            active_unit=''
            publisher_result="$(
              sudo journalctl -u "$unit.service" --no-pager --output=cat \
                | sed -n 's/^.*Publisher results: /Publisher results: /p' \
                | tail -n 1
            )"
            test -n "$publisher_result"
            printf 'Batch %s %s\n' "$batch" "$publisher_result"
            test "$unit_rc" -eq 0
          done
          trap - EXIT HUP INT TERM
          EOSSH

      - name: Revoke current Reel backfill custody
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publisher_backfill_batches != '0' }}
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$HOST" 'bash -s' -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'EOSSH'
          set -euo pipefail
          run_id="$1"
          run_attempt="$2"
          case "$run_id" in (*[!0-9]*|'') exit 2 ;; esac
          case "$run_attempt" in (*[!0-9]*|'') exit 2 ;; esac
          for batch in 1 2 3; do
            unit="openclaw-reels-backfill-${run_id}-${run_attempt}-${batch}.service"
            load_state="$(sudo systemctl show "$unit" -p LoadState --value 2>/dev/null || true)"
            if [ -z "$load_state" ] || [ "$load_state" = not-found ]; then
              continue
            fi
            sudo systemctl stop "$unit"
            active_state="$(sudo systemctl show "$unit" -p ActiveState --value 2>/dev/null || true)"
            case "$active_state" in (''|inactive|failed) ;; (*) exit 1 ;; esac
            sudo systemctl reset-failed "$unit" >/dev/null 2>&1 || true
            printf 'Reel backfill custody revoked: %s\n' "$unit"
          done
          EOSSH
