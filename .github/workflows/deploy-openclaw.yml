name: Deploy Open Claw Cron Dispatcher

# Auto-deploys scripts/openclaw-cron-dispatcher.py to the openclaw VM on
# Hetzner canonical Open Claw host whenever the dispatcher
# changes on main, AND self-bootstraps Open Claw on a fresh box.
#
# Bootstrap behaviour: if openclaw.service is missing on the VM, this
# workflow installs python3 + apscheduler/requests + the systemd unit +
# the env file, then starts the service. Subsequent runs only scp the
# dispatcher and restart.
#
# OPENCLAW_HOST is deliberately separate from HETZNER_HOST. The latter belongs
# to the PepNation/worker host and must never receive the cron dispatcher.
# OPENCLAW_SSH_PRIVATE_KEY is likewise scoped to the scheduler host.
#
# Note: `on: push`, NOT `schedule:`, so it does not violate
# the cron-governance rule in CLAUDE.md §11.5.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/openclaw-cron-dispatcher.py'
      - 'scripts/openclaw.service'
      - '.github/workflows/deploy-openclaw.yml'
  workflow_dispatch:

concurrency:
  group: deploy-openclaw
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPENCLAW_SSH_PRIVATE_KEY }}

      - name: Require the canonical Open Claw host
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
        run: test -n "$HOST"

      - name: Trust Hetzner host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.OPENCLAW_HOST }}" >> ~/.ssh/known_hosts

      - name: Bootstrap (idempotent — installs python3 + apscheduler + dirs)
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
        run: |
          ssh "$USER@$HOST" 'bash -s' <<'EOSSH'
          set -e
          if ! id openclaw >/dev/null 2>&1; then
            sudo useradd --system --home-dir /opt/openclaw --create-home --shell /bin/bash openclaw
          fi
          # Python deps for apscheduler/requests — idempotent.
          if ! python3 -c 'import apscheduler, requests' 2>/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y python3 python3-pip
            sudo pip3 install --break-system-packages apscheduler requests 2>/dev/null \
              || sudo pip3 install apscheduler requests
          fi
          python3 -c 'import apscheduler, requests; print("openclaw deps OK")'
          sudo mkdir -p /opt/openclaw /var/log/openclaw /var/lib/openclaw
          sudo chown openclaw:openclaw /opt/openclaw /var/log/openclaw /var/lib/openclaw
          EOSSH

      - name: Merge managed dispatcher secrets into the canonical env file
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.HENDON_AUTO_SYNC_SECRET || '' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: |
          umask 077
          # ── Never overwrite a WORKING credential with one production rejects ──
          #
          # This step used to stamp secrets.CRON_SECRET onto /etc/openclaw.env
          # unconditionally on every push to main that touches the dispatcher.
          # On 2026-08-31 the GitHub copy was two weeks stale (last set
          # 2026-08-16) while Vercel's had been rotated, so each deploy silently
          # re-poisoned the box: all 89 dispatcher routes 401'd, a hand-repair on
          # the VM at 13:49 UTC was erased by the very next dispatcher merge at
          # 14:54, and the auth-drift watchdog paged Dan once per restart.
          #
          # The candidate is now PROVED against the same no-side-effect auth
          # boundary the watchdog uses before it is allowed to replace anything.
          # If it fails, we leave the host's existing value alone (it may be the
          # good one, hand-repaired) and fail the workflow at the end — loudly,
          # because a stale GitHub secret is a real problem that needs a human to
          # re-copy the value from Vercel. Silence is what let this run for weeks.
          PROBE_URL="https://smarter.poker/api/internal/cron-auth-probe"
          CRON_SECRET_OK=no
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is empty in GitHub secrets — leaving the host's copy untouched"
          else
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                     -H "Authorization: Bearer $CRON_SECRET" "$PROBE_URL" || echo 000)
            case "$code" in
              200) CRON_SECRET_OK=yes; echo "CRON_SECRET accepted by production (200) — safe to write" ;;
              401) echo "::error::GitHub's CRON_SECRET is REJECTED by production (401). It is stale. Copy the current value from the Vercel hub-vanguard env into the repo secret CRON_SECRET. Leaving /etc/openclaw.env untouched so a working host value is not destroyed." ;;
              *)   echo "::warning::CRON_SECRET probe inconclusive (HTTP $code) — refusing to write on an unproven result" ;;
            esac
          fi
          echo "cron_secret_ok=$CRON_SECRET_OK" >> "$GITHUB_ENV"
          {
            if [ "$CRON_SECRET_OK" = yes ]; then printf 'CRON_SECRET=%s\n' "$CRON_SECRET"; fi
            printf 'TWILIO_ACCOUNT_SID=%s\n' "$TWILIO_ACCOUNT_SID"
            printf 'TWILIO_AUTH_TOKEN=%s\n' "$TWILIO_AUTH_TOKEN"
            printf 'TWILIO_PHONE_NUMBER=%s\n' "$TWILIO_PHONE_NUMBER"
            printf 'ADMIN_PHONE=%s\n' "$ADMIN_PHONE"
          } > /tmp/openclaw-managed.env
          scp /tmp/openclaw-managed.env "$USER@$HOST:/tmp/openclaw-managed.env"
          ssh "$USER@$HOST" 'bash -s' <<'EOSSH'
          set -e
          sudo touch /etc/openclaw.env
          if [ -f /opt/openclaw/.env ]; then
            while IFS= read -r line; do
              key=${line%%=*}
              [ -n "$key" ] || continue
              sudo grep -q "^${key}=" /etc/openclaw.env || printf '%s\n' "$line" | sudo tee -a /etc/openclaw.env >/dev/null
            done < /opt/openclaw/.env
          fi
          while IFS= read -r line; do
            key=${line%%=*}
            sudo sed -i "/^${key}=/d" /etc/openclaw.env
            printf '%s\n' "$line" | sudo tee -a /etc/openclaw.env >/dev/null
          done < /tmp/openclaw-managed.env
          sudo rm -f /tmp/openclaw-managed.env
          sudo chmod 600 /etc/openclaw.env
          sudo chown root:root /etc/openclaw.env
          EOSSH
          rm -f /tmp/openclaw-managed.env

      - name: Sync dispatcher.py + systemd unit
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
        run: |
          scp scripts/openclaw-cron-dispatcher.py \
            "$USER@$HOST:/tmp/openclaw-cron-dispatcher.py"
          scp scripts/openclaw.service \
            "$USER@$HOST:/tmp/openclaw.service"
          ssh "$USER@$HOST" '
            set -e
            sudo mv /tmp/openclaw-cron-dispatcher.py /opt/openclaw/dispatcher.py
            sudo chmod 0644 /opt/openclaw/dispatcher.py
            sudo mv /tmp/openclaw.service /etc/systemd/system/openclaw.service
            sudo chmod 0644 /etc/systemd/system/openclaw.service
            sudo systemctl daemon-reload
          '

      - name: Enable + (re)start openclaw.service and verify
        env:
          HOST: ${{ secrets.OPENCLAW_HOST }}
          USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
        run: |
          expected_dispatcher=$(sha256sum scripts/openclaw-cron-dispatcher.py | cut -d' ' -f1)
          expected_unit=$(sha256sum scripts/openclaw.service | cut -d' ' -f1)
          ssh "$USER@$HOST" '
            set -e
            sudo systemctl enable openclaw.service
            sudo systemctl restart openclaw.service
            sleep 3
            sudo systemctl is-active openclaw.service
            test "$(sudo systemctl show openclaw.service -p User --value)" = openclaw
            for key in CRON_SECRET TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_PHONE_NUMBER ADMIN_PHONE; do
              sudo grep -q "^${key}=.." /etc/openclaw.env
            done
            sudo journalctl -u openclaw.service -n 30 --no-pager
          '
          remote_dispatcher=$(ssh "$USER@$HOST" 'sha256sum /opt/openclaw/dispatcher.py' | cut -d' ' -f1)
          remote_unit=$(ssh "$USER@$HOST" 'sha256sum /etc/systemd/system/openclaw.service' | cut -d' ' -f1)
          test "$remote_dispatcher" = "$expected_dispatcher"
          test "$remote_unit" = "$expected_unit"

      # The deploy itself succeeded above — the dispatcher is running the new
      # code. This step exists so a stale GitHub CRON_SECRET cannot sit
      # unnoticed: the box keeps whatever value it had, and the run goes red
      # until a human re-copies the current value from the Vercel hub-vanguard
      # env into the repo secret. Before this guard, the same stale value was
      # stamped onto the VM on every dispatcher merge and the only symptom was
      # an SMS to Dan's phone once per restart.
      - name: Fail if GitHub's CRON_SECRET is stale
        if: env.cron_secret_ok != 'yes'
        run: |
          echo "The dispatcher deployed, but GitHub's CRON_SECRET was NOT written"
          echo "to /etc/openclaw.env because production did not accept it."
          echo
          echo "FIX: copy CRON_SECRET from the Vercel hub-vanguard project env"
          echo "into this repo's secret of the same name, then re-run this workflow."
          echo "Until then the dispatcher authenticates with whatever the host"
          echo "already held, which the auth-drift watchdog reports every 5 min."
          exit 1
