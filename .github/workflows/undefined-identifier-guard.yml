name: Undefined Identifier Guard

# .eslintrc.json sets "no-undef": "off". On 2026-08-19 that let two separate
# undefined identifiers reach production in a single day -- one of which took
# the messenger down for two days behind an error boundary, and one of which
# broke the Vercel build and blocked a security fix from deploying.
#
# This runs the rule anyway, with a baseline of the 175 that already existed,
# and fails only on NEW ones. Rationale and the baseline policy are documented
# in scripts/ci/check-undefined-identifiers.mjs.
#
# No `schedule:` trigger, per the cron-governance rule: push and PR only.

on:
  push:
    branches: [main]
    # COST: every Club Arena merge rsyncs a compiled bundle into this repo and
    # pushes it to main. On 2026-08-22 that happened 76 times, and each one woke
    # nine workflows here that have nothing to say about minified output — 947
    # runs in Club Arena produced 950 in World Hub. GitHub bills per JOB rounded
    # up to a whole minute, so a 20-second guard costs a full minute.
    #
    # ONLY the `push` trigger is filtered. Never add paths-ignore to
    # `pull_request`: a PR touching only these paths would then never report
    # this context, and a required check that never reports is a pull request
    # that never merges.
    # Skipped here because it scans hand-written source; minified output is not that.
    paths-ignore:
      - 'public/hub/club-arena/**'
  pull_request:
    branches: [main]

concurrency:
  group: undefined-identifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Named for the same reason as no-conflict-markers.yml: a bare `check` job
    # produces a context that collides with every other bare `check` job.
    name: No New Undefined Identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'

      - name: Check for new undefined identifiers
        run: node scripts/ci/check-undefined-identifiers.mjs
