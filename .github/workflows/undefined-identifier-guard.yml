name: Undefined Identifier Guard

# .eslintrc.json sets "no-undef": "off". On 2026-08-19 that let two separate
# undefined identifiers reach production in a single day -- one of which took
# the messenger down for two days behind an error boundary, and one of which
# broke the Vercel build and blocked a security fix from deploying.
#
# This runs the rule anyway, with a baseline of the 175 that already existed,
# and fails only on NEW ones. Rationale and the baseline policy are documented
# in scripts/ci/check-undefined-identifiers.mjs.
#
# No `schedule:` trigger, per the cron-governance rule: push and PR only.

on:
  push:
    branches: [main]
    # COST: every Club Arena merge rsyncs a compiled bundle into this repo and
    # pushes it to main. On 2026-08-22 that happened 76 times, and each one woke
    # nine workflows here that have nothing to say about minified output — 947
    # runs in Club Arena produced 950 in World Hub. GitHub bills per JOB rounded
    # up to a whole minute, so a 20-second guard costs a full minute.
    #
    # ONLY the `push` trigger is filtered. Never add paths-ignore to
    # `pull_request`: a PR touching only these paths would then never report
    # this context, and a required check that never reports is a pull request
    # that never merges.
    # Skipped here because it scans hand-written source; minified output is not that.
    paths-ignore:
  pull_request:
    branches: [main]

concurrency:
  group: undefined-identifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Named for the same reason as no-conflict-markers.yml: a bare `check` job
    # produces a context that collides with every other bare `check` job.
    name: No New Undefined Identifiers
    # PULL REQUEST ONLY (2026-09-04). This ran again on every push to main -
    # on the squash commit of a pull request it had just passed - so every
    # merge queued a second full copy of this repo's thirteen workflows behind
    # the NEXT pull request's checks, on six runners. Measured on #1336: jobs
    # that ran in 0.2-2.1 minutes waited 8-14 minutes for a runner. The
    # ruleset enforces this check on the pull request; the merge commit is
    # the same tree. Club Arena made the same call on 2026-08-23.
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'

      # THIS JOB FAILED ON EVERY PULL REQUEST UNTIL 2026-11-09, for three
      # reasons that compounded:
      #
      #   1. A cache this job writes is never restorable. GitHub scopes a cache
      #      saved on a branch to that branch; only a cache saved on the DEFAULT
      #      branch is readable from every pull request. This job is
      #      `pull_request` only (see the note above), so `nm-wh-guard-*` was
      #      written on PR branches and read by nobody. Every run was a cold,
      #      full install.
      #   2. That full install was a plain `npm ci` on Node 22. `canvas` ships
      #      no prebuilt binary for that ABI, so npm built it from source, which
      #      needs pixman and cairo. The hosted runner has neither, so npm ci
      #      exited 1 before the check this job exists to run ever started. The
      #      jobs that install the same way on Node 24 are fine, because a
      #      prebuild exists there and nothing is compiled. Measured, not
      #      assumed: shared-schema-lineage (Node 24, plain `npm ci`) installs
      #      1178 packages in 31 seconds and passes.
      #   3. The checker needs none of it. It imports eslint, the TypeScript
      #      parser and globals - all pure JavaScript. `canvas` is used by one
      #      standalone card-drawing script and nothing on this path.
      #
      # Fixed by restoring the cache that `build-safety-gate.yml` writes on
      # main (`nm-wh-noscripts`, Node 24, --ignore-scripts). That key IS written
      # on the default branch, so it restores here, and the node version is
      # matched to it so the tree is the one that was cached. On a miss the
      # install no longer builds a native module it does not use.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-noscripts-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --prefer-offline --no-audit
        env:
          HUSKY: '0'

      - name: Check for new undefined identifiers
        run: node scripts/ci/check-undefined-identifiers.mjs
