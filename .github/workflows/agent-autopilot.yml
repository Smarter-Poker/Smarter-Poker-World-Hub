# ─────────────────────────────────────────────────────────────────────────────
# AGENT AUTOPILOT — event-driven protected merge authority.
#
# This workflow always executes reviewed default-branch code on a fresh hosted
# runner. It never checks out pull-request code and receives no PAT fallback.
# The GitHub App token is minted for one run and the job fails closed when that
# authority is unavailable. There is no timer, reconciler, branch refresher,
# empty-commit writer, stuck-run canceller, or admin merge path.
# ─────────────────────────────────────────────────────────────────────────────
name: Agent Autopilot

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-autopilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  queue-pr:
    name: Queue this PR for protected squash merge
    # pull_request_target can read the App secret, so same-repository branch
    # ownership is the authorization boundary. A fork may run ordinary CI but
    # can never mint merge authority, even when every check passes.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed default-branch automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history is required so read-only `git merge-base` and
          # `git merge-tree --write-tree` can validate the PR head against the
          # current default branch before minting merge authority.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-noscripts-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      # Close the strict:false parallel-PR merge-tree race window BEFORE minting
      # the GitHub App token or arming auto-merge. PR code is NEVER checked out
      # or executed here: we fetch only git objects read-only and run main's own
      # reviewed AST/import/route/JSON validator over `git merge-tree --write-tree`.
      - name: Verify read-only simulated merge onto default branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid PR_HEAD_SHA: $PR_HEAD_SHA"
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" "$PR_HEAD_SHA"
          node scripts/ci/check-module-parse-and-bindings.mjs \
            --merge-only \
            --merge-against "origin/${BASE_BRANCH}" \
            --head FETCH_HEAD

      - name: Mint the GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Verify merge authority
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/check-token.sh

      - name: Enable protected squash auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          case ",$LABELS," in
            *,do-not-merge,*|*,hold,*|*,wip,*)
              echo "PR #$PR carries a hold label ($LABELS); leaving it alone."
              exit 0 ;;
          esac
          bash .github/scripts/queue-pr.sh "$REPO" "$PR"
