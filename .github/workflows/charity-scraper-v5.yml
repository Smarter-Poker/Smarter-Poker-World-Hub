name: Charity Scraper V5 (3-Day Autopilot)

on:
  schedule:
    # Runs every 3 days at 05:00 UTC
    - cron: '0 5 */3 * *'
  workflow_dispatch:
    inputs:
      venue:
        description: 'Specific venue filter (optional)'
        required: false
        default: ''

jobs:
  scrape-charity-venues:
    name: "Run Charity Scraper V5"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install scrapling==0.4.2 camoufox playwright openai pdfplumber supabase
          playwright install chromium --with-deps
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Create required directories
        run: |
          mkdir -p data/scrape-evidence
          mkdir -p data/charity-scraper-logs

      - name: Execute Scraper
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.venue }}" ]; then
            python scripts/scrape_charity_v5.py --venue "${{ github.event.inputs.venue }}"
          else
            python scripts/scrape_charity_v5.py
          fi
