# Venue Intelligence Scraper — OUR OWN ENGINE, NOT A RENTED ONE.
#
# Runs every 3 days (Mon/Thu at midnight EST).
#
#   Tier 1: venue direct websites
#   Tier 2: PokerAtlas fallback for venues without a website
#
# WHY THIS NO LONGER CALLS AN API ROUTE
# This job used to curl /api/venue-scraper/trigger, which asked Manus AI to
# dispatch a browser agent per venue. Every scheduled run since at least
# 2026-08-17 has failed, ten out of ten, with the same answer:
#
#   HTTP 500
#   {"error":"MANUS_API_KEY is malformed: expected a three-segment JWT.
#     Set it in the smarter.poker Vercel project (Production) and redeploy."}
#
# The key is deleted and nothing in this repo can restore it. The HendonMob
# sync had the identical dependency and shed it in #1772 by running the
# deterministic scraper this estate already owns; this is the same move.
#
# scripts/venue_scraper_scrapling.py has been here the whole time: Scrapling
# with the Cloudflare bypass, explicit extraction, and a POST of what it found
# to /api/venue-scraper/receive — the same endpoint Manus was being paid to
# post to. Same destination, same secret, no third party, no prompt.
#
# --require-store is the difference between a run that worked and a run that
# merely finished: without it the script exits 0 even when every batch failed
# to store. See exit_code_for() in the script.

name: Venue Scraper Auto-Sync

on:
  schedule:
    # Every Monday and Thursday at 5:00 AM UTC (midnight EST)
    - cron: '0 5 * * 1,4'
  workflow_dispatch: # Manual trigger

jobs:
  scrape-venues:
    runs-on: ubuntu-latest
    # Hundreds of venues at ~5s apart plus fetch time. The scraper paces itself;
    # this is the backstop for a hung fetch, not the budget.
    timeout-minutes: 330
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VENUE_SCRAPER_SECRET: ${{ secrets.VENUE_SCRAPER_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[all]" camoufox
          scrapling install
          python -m camoufox fetch

      - name: Refuse to run without the storage secret
        run: |
          if [ -z "${VENUE_SCRAPER_SECRET:-}" ]; then
            echo "::error title=VENUE_SCRAPER_SECRET missing::Without it the scraper" \
                 "writes a JSON file nobody reads and the run stores nothing."
            exit 1
          fi
          echo "Storage secret present."

      - name: Scrape Venues
        id: scrape
        run: |
          python3 scripts/venue_scraper_scrapling.py --all --require-store

      - name: Alert Human (Venue Scraper Failed)
        if: failure() && steps.scrape.outcome == 'failure'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python3 scripts/utils/send_sms_alert.py "Venue Scraper Failed"

      - name: Log Summary
        if: always()
        run: |
          echo "Venue scraper workflow completed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with status: ${{ job.status }}"
