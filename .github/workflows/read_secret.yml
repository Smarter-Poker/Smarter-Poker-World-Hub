name: Read Secret (NEUTRALISED - delete this file)

# ─────────────────────────────────────────────────────────────────────────────
# NEUTRALISED 2026-08-16.
#
# This workflow used to be:
#
#     run: echo "$SECRET" | base64 | sed 's/./& /g'
#     env:
#       SECRET: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
#
# GitHub redacts secrets from build logs by string-matching the secret value.
# `sed 's/./& /g'` puts a space between every character, which defeats that
# match exactly, and the base64 makes the result trivially reconstructable.
# There is no debugging reason to space out a private key.
#
# Anyone with write access could dispatch this and read the deploy key out of
# the log. It has been stripped of every secret reference rather than deleted,
# because the agent GitHub bridge can create and update files but cannot remove
# them. DELETE THIS FILE.
#
# Neutralising it does not un-print anything an earlier run already emitted:
# HETZNER_SSH_PRIVATE_KEY must be rotated independently of this change.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "This workflow printed HETZNER_SSH_PRIVATE_KEY into the build log"
          echo "with GitHub's secret masking deliberately defeated. It has been"
          echo "neutralised and should be deleted."
          exit 1
