# ─────────────────────────────────────────────────────────────────────────────
# PUBLISH WATCHDOG — the only thing here that asks production what it serves.
#
# This repo deploys through Vercel's git integration. There is no workflow to
# watch, so a build that errors, sits queued, is superseded and never retried,
# or is BLOCKED because Vercel cannot attribute the commit author (CHECK 15)
# leaves main moving while smarter.poker serves something older. Nothing said
# so — every gate here answers "did it merge".
#
# It never deploys. CLAUDE.md 1.3 forbids `vercel deploy` and deploy hooks, so
# this diagnoses precisely and says so out loud instead.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish Watchdog

on:
  schedule:
    # Every 15 minutes. A Vercel build is 3-5 minutes and the budget is 20, so
    # this notices roughly half an hour after a deploy silently stops happening
    # — against the hours it currently takes for somebody to notice by hand.
    # Halved from */15 on 2026-08-23 for cost. The real trigger is the
    # publisher finishing; this schedule only catches a deploy that never
    # started, and 30 minutes is well inside the window where that matters.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # pull-requests: read (2026-09-03) is what lets orphan-work-watchdog.sh tell
  # a proposed branch from a stranded one. Without it `gh pr list` is refused,
  # and the sweep reported every branch with a pull request as having none.
  pull-requests: read

concurrency:
  group: publish-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Production is serving main
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Mint a GitHub App installation token
        id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Compare production against main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # The alarm writes with GITHUB_TOKEN, whose issues: write is declared
          # above and therefore guaranteed. An App's installation scopes can be
          # narrowed without anyone here noticing, and a watchdog that cannot
          # raise its alarm is not a watchdog.
          GH_TOKEN_ISSUES: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: bash .github/scripts/publish-watchdog.sh

      # Dan 2026-09-01: "no work ever gets lost, orphaned or not published...
      # EVER." The step above asks whether MERGED work reached production;
      # this one asks the question upstream of it: does work exist in this
      # repo that never became a merge at all - a branch pushed with no PR, a
      # PR with a conflict autopilot cannot land, a forgotten draft? Same
      # script as club-arena's (kept byte-identical the way AGENT-PLAYBOOK
      # is); it files ONE self-updating, self-closing issue naming each piece
      # and its remedy, and never merges or deletes anything itself.
      # if: always() - stranded work must be reported even when the publish
      # comparison above failed; the failure domains are independent.
      - name: Find work that nothing will ever publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/orphan-work-watchdog.sh

      # ─────────────────────────────────────────────────────────────────────
      # The root service worker must be able to INSTALL.
      #
      # Added 2026-08-29. `/_next/dynamic-css-manifest.json` sat in the
      # precache manifest and 404'd; workbox precaches atomically, so install()
      # rejected, the root worker went redundant ~170ms after every register(),
      # and web push was dead for every user of smarter.poker AND Club Arena.
      # Nothing reported it: register() RESOLVES, the page looks fine, and only
      # somebody tapping Enable Notifications ever finds out.
      #
      # It rides this workflow rather than a new schedule because it asks the
      # same question — "is what production serves actually usable" — and
      # section 11 of CLAUDE.md bans new GitHub `schedule:` triggers.
      #
      # `always()` so it still runs when the SHA comparison above alarms: a
      # stale deploy and a broken worker are independent failures.
      - name: Root service worker precache resolves
        if: always()
        run: node scripts/ci/check-sw-precache.mjs https://smarter.poker

      # ─────────────────────────────────────────────────────────────────────
      # The Open Claw cron fleet is actually running.
      #
      # Added 2026-08-31. The production CRON_SECRET was rotated without the
      # Hetzner VM being updated; all 85 jobs began returning 401 — push
      # notifications, every anti-cheat and collusion scan, chip-supply
      # snapshots. NOTHING noticed. It was found by hand in the VM's journal.
      #
      # check-cron-liveness.mjs cannot catch that: a 401 is rejected before
      # withCronHealth records anything, so the log does not fill with errors,
      # it STOPS — and that check asks for failures, over 7 days, in CI.
      # Silence is the only observable, so silence is what this measures.
      #
      # It rides this workflow for the same reason the service-worker check
      # above does (section 11 bans new `schedule:` triggers) — and, more
      # importantly, because it MUST NOT be an Open Claw cron itself: a
      # monitor sharing a failure domain with the thing it monitors is dead
      # exactly when it is needed.
      #
      # `always()` so a stale deploy above does not mask a dead fleet here.
      - name: Open Claw cron fleet is alive
        id: cron-fleet
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # A PIPELINE REPORTS THE LAST COMMAND'S EXIT CODE, NOT THE FIRST.
          # The first cut of this step was `node ... | tee`, so the step took
          # TEE's status - always 0 - and reported success while the fleet was
          # demonstrably down. Caught by running the workflow for real on
          # 2026-08-31: the detector printed "THE OPEN CLAW FLEET HAS GONE
          # SILENT", and then the RECOVERY step ran and the alarm step did not.
          # A watchdog that cannot raise its alarm is not a watchdog, and this
          # one would additionally have closed a genuine issue every 30 minutes.
          #
          # PIPESTATUS[0] is the real code, and it is published as an OUTPUT so
          # the steps below can tell the three cases apart. `outcome` cannot:
          # exit 1 (fleet down) and exit 2 (cannot reach Supabase) are both
          # merely "failure", and those two must do very different things.
          set +e
          node scripts/ci/check-cron-fleet-alive.mjs 2>&1 | tee /tmp/cron-fleet.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "cron-fleet-alive exited ${code}"

      # EXACTLY exit 1 raises an issue. Exit 2 ("cannot tell") does nothing at
      # all - it neither raises nor closes, because "I could not reach
      # Supabase" is not evidence about the fleet in either direction. An
      # alarm that fires on its own misconfiguration gets muted; one that
      # CLOSES on it is worse still.
      - name: Raise the alarm if the fleet is silent
        if: always() && steps.cron-fleet.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if grep -q "cannot tell whether the fleet is alive\|could not reach Supabase\|Supabase answered" /tmp/cron-fleet.log; then
            echo "::warning::cron-fleet-alive could not reach Supabase — not raising an outage issue."
            exit 0
          fi
          TITLE="Open Claw cron fleet has gone silent"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          BODY=$(printf '%s\n' "The GitHub-side watchdog sees no Open Claw job runs at all." "" '```' "$(cat /tmp/cron-fleet.log)" '```' "" "Detector: \`scripts/ci/check-cron-fleet-alive.mjs\` via \`fn_cron_fleet_silence\`." "Closes itself on the next green run.")
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "incident" || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi

      # Self-closing: a fleet that recovered should not leave a red issue open.
      - name: Close the alarm when the fleet recovers
        if: always() && steps.cron-fleet.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="Open Claw cron fleet has gone silent"
          for n in $(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number' || true); do
            gh issue comment "$n" --body "Fleet is recording runs again. Closing automatically."
            gh issue close "$n" || true
          done

      # ── NOTHING IS SILENTLY RED ON main (2026-09-06) ────────────────────────
      #
      # `Global Footer E2E` failed on every run on main from 2026-09-04 and was
      # found two days later by accident. It is not in the ruleset, so a red run
      # blocked no merge, opened no issue and coloured nothing anybody reads;
      # twenty-odd merges landed on top of it. Required checks cannot reach that
      # state - a red one stops the queue - so this is for all the others, and
      # the others are most of them.
      #
      # Lives here rather than in Open Claw for the reason section 11.4 already
      # gives about this workflow: it asks GitHub about GitHub, and a detector
      # that shares a failure domain with the thing it watches is not a
      # detector.
      #
      # It reports a failing workflow as `loud` when an open issue already names
      # it, so `Publish Watchdog` raising its own alarm is not treated as a
      # defect. SILENT is the only thing that pages.
      #
      # ESTATE-WIDE SINCE 2026-09-06. It read one repo - this one - and so
      # reported the estate healthy because the room it stood in was healthy.
      # The first sweep of all seven found three workflows red with nobody told,
      # one of which had frozen PepNationLab's production six commits behind its
      # main for three days.
      #
      # OWNER-scoped token, minted separately from the repo-scoped one above.
      # Reading another repository's workflow runs is not something a
      # repo-scoped GITHUB_TOKEN can ever do, and merging the two would change
      # the token under the production comparison as a side effect. If this
      # cannot be minted the script still runs: it reads this repo, reports the
      # other six as BLIND, and alarms - which is the honest answer, and the one
      # thing it must never do is call an unreadable repo green.
      - name: Mint an owner-scoped App token for the estate sweep
        id: estate-token
        if: always() && vars.AUTOPILOT_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          owner: Smarter-Poker

      - name: Nothing is silently red on main, in any estate repo
        id: main-green
        if: always()
        env:
          GITHUB_TOKEN: ${{ steps.estate-token.outputs.token || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # PIPESTATUS[0], not the pipeline's code - the same trap the cron
          # fleet step above documents. `tee` always succeeds.
          set +e
          node scripts/ci/check-main-is-green.mjs 2>&1 | tee /tmp/main-green.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "check-main-is-green exited ${code}"

      # ── THE VERCEL ENVIRONMENT CHANGED AND NOBODY SAW IT ──────────────
      # Realtime Programme phase 7. The 2026-09-03 outage began with ONE
      # environment variable: PROBE_LOGIN_EMAIL was pointed at Dan's own
      # account in a dashboard, leaving no commit, no log line and no
      # notification, and twenty-two hours of "Reconnecting To The Table"
      # followed. Every code path involved was correct.
      #
      # This rides publish-watchdog for the same reason check-cron-fleet-alive
      # does: it asks Vercel about Vercel, so it belongs GitHub-side and not in
      # Open Claw, and adding a schedule: trigger of its own would need CHECK 6c
      # (CLAUDE.md 11.4). It reads names, targets and timestamps - never
      # `?decrypt=true`, never a value.
      - name: The Vercel environment is the shape the repo agreed
        id: env-drift
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set +e
          node scripts/ci/check-vercel-env-drift.mjs 2>&1 | tee /tmp/env-drift.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "check-vercel-env-drift exited ${code}"

      - name: Raise the alarm for an unreviewed environment change
        if: always() && steps.env-drift.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="The Vercel environment changed and nobody has reviewed it"
          BODY=$(printf '%s\n' \
            "One or more environment variables on \`hub-vanguard\` differ from the shape this repo last agreed." \
            "" \
            "This is not automatically wrong. It is UNSEEN, which is what 2026-09-03 was: one variable edited in a dashboard, no commit, no log line, and twenty-two hours of every Club Arena table saying \"Reconnecting To The Table\"." \
            "" \
            "No values are read, stored or shown here - only names, targets and timestamps." \
            '```' \
            "$(cat /tmp/env-drift.log)" \
            '```' \
            "" \
            "If the change was intended, record it: \`VERCEL_TOKEN=... node scripts/ci/check-vercel-env-drift.mjs --update\` and commit \`scripts/ci/vercel-env-baseline.json\` saying who changed what and why. Closes itself on the next clean run.")
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" || true
          fi

      - name: Raise the alarm for a silently red main
        if: always() && steps.main-green.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="A workflow has been failing on main with nobody watching"
          BODY=$(printf '%s\n' \
            "One or more workflows have been red on \`main\` past the threshold and have no open issue naming them, somewhere in the seven-repo estate." \
            "" \
            "A check that is red and blocks nobody stops being a check: it cannot fail any louder than it already is, so the next person to break the same thing learns nothing." \
            "" \
            "Each line is \`<repo> :: <workflow>\`. Fix it in the repo that owns it, not here. A line marked BLIND is worse than a red one: the detector could read other repos and not that one, so its \`main\` is unwatched and reads as green." \
            '```' \
            "$(cat /tmp/main-green.log)" \
            '```' \
            "" \
            "Detector: \`scripts/ci/check-main-is-green.mjs\` in this repo, sweeping all seven. Closes itself once every workflow's latest run on main is green, or once an issue exists in the owning repo that names it.")
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" || true
          fi

      - name: Close it when main is green again
        if: always() && steps.main-green.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="A workflow has been failing on main with nobody watching"
          for n in $(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number' || true); do
            gh issue comment "$n" --body "Every workflow's latest run on main is green, or is now tracked by its own issue. Closing automatically."
            gh issue close "$n" || true
          done

      # ── THE SCRAPER FLEET IS ASKED FROM OUTSIDE THE MAC (2026-09-06) ───────
      #
      # tournament-schedule-daemon.py sat in a connect-failure loop for four
      # days and nineteen hours - 1,355 cycles, venues_done 0 - heartbeating the
      # whole time. Its plist says KeepAlive: true, which never helped, because
      # the loop never exits: a restart policy cannot restart something that
      # refuses to stop.
      #
      # pnm-freshness-watchdog.py DID detect it on 2026-09-05 and exits non-zero
      # when it does. Nothing reads that exit code - it writes a log file on the
      # same Mac as the daemon. Section 11.4's rule about this very workflow
      # applies: a watchdog that shares a failure domain with the thing it
      # watches is not a watchdog.
      #
      # So this asks SUPABASE how long since each scraper-written table was
      # last written. No Mac, no launchd, no log file. Exit 2 means "could not
      # tell" and raises nothing, because an alarm that fires on its own
      # misconfiguration gets muted.
      - name: The scraper fleet is still writing
        id: scrapers
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # PIPESTATUS[0], not the pipeline - the trap the cron-fleet step above
          # documents. tee always succeeds.
          set +e
          node scripts/ci/check-scraper-freshness.mjs 2>&1 | tee /tmp/scrapers.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "check-scraper-freshness exited ${code}"

      - name: Raise the alarm when the fleet stops writing
        if: always() && steps.scrapers.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="The scraper fleet has stopped writing"
          BODY=$(printf '%s\n' \
            "One or more scraper-written tables are past their freshness budget." \
            "" \
            "Check the Mac daemons FIRST, and read \`consecutive_failures\` rather than whether the process exists - a daemon in a connect-failure loop still heartbeats and still looks KeepAlive-healthy:" \
            "" \
            '```' \
            "launchctl list | grep smarter-poker" \
            "cat data/tournament-logs/heartbeat.json" \
            '```' \
            "" \
            '```' \
            "$(cat /tmp/scrapers.log)" \
            '```' \
            "" \
            "Detector: \`scripts/ci/check-scraper-freshness.mjs\`. Closes itself when every table is inside its budget.")
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" || true
          fi

      - name: Close it when the fleet is writing again
        if: always() && steps.scrapers.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="The scraper fleet has stopped writing"
          for n in $(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number' || true); do
            gh issue comment "$n" --body "Every scraper-written table is inside its freshness budget again. Closing automatically."
            gh issue close "$n" || true
          done
