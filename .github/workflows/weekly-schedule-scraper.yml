          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi

          RAN=0
          FAILED=0
          EMPTY_BATCHES=0
          WROTE_TOTAL=0
          ROWS=""

          for batch in $(seq "${BATCH_START}" "${BATCH_END}"); do
