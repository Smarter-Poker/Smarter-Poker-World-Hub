name: vercel-project-uniqueness-check

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run uniqueness check
        run: node scripts/check-vercel-project-uniqueness.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
