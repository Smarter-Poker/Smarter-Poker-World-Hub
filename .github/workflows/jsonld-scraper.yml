name: JSON-LD Scraper (Charity & Tours)

on:
  schedule:
    # Run every day at 04:00 UTC (11 PM EST)
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scrapling==0.4.2 curl_cffi bs4 camoufox playwright supabase
          playwright install chromium --with-deps
          python -m camoufox fetch
          
      - name: Run Scraper
        run: |
          echo "=========================================="
          echo "JSON-LD EVENT SCRAPER"
          echo "Using: Scrapling + Camoufox (Cloudflare bypass)"
          echo "Target: JSON-LD evidence cache"
          echo "=========================================="
          python scripts/comprehensive_jsonld_scraper.py
          
      - name: Seed Extracted JSON-LD to Database
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=========================================="
          echo "SEEDING TO DATABASE"
          echo "Target: venue_daily_tournaments"
          echo "=========================================="
          python scripts/seed_extracted_jsonld.py
          
      - name: Upload scraper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonld-scraper-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-artifacts-${{ github.run_number }}
          path: |
            data/scrape-evidence/*.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Report Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 JSON-LD SCRAPER WORKFLOW COMPLETED"
          echo "═══════════════════════════════════════════════════════════"
          echo "Completed at: $(date -u)"
          echo "═══════════════════════════════════════════════════════════"
