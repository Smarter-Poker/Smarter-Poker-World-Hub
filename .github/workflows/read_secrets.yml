name: Read All Secrets (NEUTRALISED - delete this file)

# ─────────────────────────────────────────────────────────────────────────────
# NEUTRALISED 2026-08-16.
#
# This workflow used to be `printenv | sort`, which dumps the entire runner
# environment. Any secret mapped into the job's env — and any token the runner
# itself carries, including GITHUB_TOKEN — lands in the log in one shot.
#
# Stripped rather than deleted, because the agent GitHub bridge cannot remove
# files. DELETE THIS FILE.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "This workflow dumped the entire runner environment via printenv."
          echo "It has been neutralised and should be deleted."
          exit 1
