name: Venue Tournament Scraper (Daily)

on:
  # DEMOTED to manual fallback (2026-08-14): the Mac tournament daemon
  # (scripts/tournament-schedule-daemon.py) is the single canonical writer of
  # venue_daily_tournaments. Running this fleet on cron alongside it produced
  # unattributable rows from divergent code. Keep for manual/emergency use.
  workflow_dispatch:
    # Allow manual trigger with options
    inputs:
      mode:
        description: 'Scraping mode'
        required: true
        default: 'pokeratlas-daily'
        type: choice
        options:
          - pokeratlas-daily
          - full
          - test
          - setup-only
          - sync-urls-only
          - verify-venues
          - scrape-directory
      state:
        description: 'Filter by state (optional, e.g., TX, NV, FL)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-venue-tournaments:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour max for full scrape of 777 venues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: |
          echo "Installing Chrome for headless scraping..."
          npx puppeteer browsers install chrome
          echo "Chrome installed successfully"

      - name: Seed Venues from JSON
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode != 'setup-only' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Seeding venues from tournament-venues.json..."
          node scripts/seed-venues-from-json.js

      - name: Sync Verified URLs to Database
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode != 'setup-only' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Syncing verified PokerAtlas URLs to database..."
          node scripts/sync-verified-urls.js || echo "URL sync skipped (venues may already have URLs)"

      - name: Skip Scraping (URL Sync Only)
        if: ${{ github.event.inputs.mode == 'sync-urls-only' }}
        run: echo "✅ URL sync complete. Skipping scraping as requested."

      - name: Run PokerAtlas Daily Scraper (Scheduled)
        if: ${{ github.event_name == 'schedule' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=========================================="
          echo "POKERATLAS DAILY TOURNAMENT SCRAPER"
          echo "Source: data/tournament-venues.json (178 verified venues)"
          echo "Target: venue_daily_tournaments table"
          echo "Using: Puppeteer + Stealth Plugin (Cloudflare bypass)"
          echo "=========================================="
          echo ""
          node scripts/run-full-pipeline.js --scrape-only

      # ─────────────────────────────────────────────────────────────────────
      # Bravo Poker Live + CardPlayer — TOURNAMENT sources, on the daily cron.
      #
      # Both of these previously existed ONLY inside the
      # `workflow_dispatch && mode == 'full'` step below, so the 06:00 UTC
      # schedule never ran either one. Whatever they contribute to
      # poker_venues / venue_daily_tournaments only landed when a human
      # manually dispatched the workflow with mode=full.
      #
      # NOTE: scripts/scrape-cardplayer.js (tournaments -> venue_daily_tournaments)
      # is a DIFFERENT source from scripts/scrape-cardplayer.py (news ->
      # poker_news, run by the scrape-cardplayer-news job). Both are wanted;
      # they are not substitutes for each other.
      #
      # `continue-on-error` keeps one flaky third-party source from killing the
      # whole nightly run, but the step still goes red so the outage is visible
      # instead of being swallowed by the old `|| echo "(non-fatal)"`.
      # ─────────────────────────────────────────────────────────────────────
      - name: Run Bravo + CardPlayer Tournament Scrapers (Scheduled)
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          rc=0

          echo "Source 2: Bravo Poker Live"
          if [ -f scripts/scrape-bravo-poker.js ]; then
            node scripts/scrape-bravo-poker.js || rc=$?
          else
            echo "::warning::scripts/scrape-bravo-poker.js missing - Bravo source skipped"
          fi

          echo ""
          echo "Source 3: CardPlayer (tournaments)"
          if [ -f scripts/scrape-cardplayer.js ]; then
            node scripts/scrape-cardplayer.js || rc=$?
          else
            echo "::warning::scripts/scrape-cardplayer.js missing - CardPlayer tournament source skipped"
          fi

          exit $rc

      - name: Run PokerAtlas Daily Scraper (Manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'pokeratlas-daily' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=========================================="
          echo "POKERATLAS DAILY TOURNAMENT SCRAPER"
          echo "Using: Puppeteer + Stealth Plugin"
          echo "=========================================="
          node scripts/run-full-pipeline.js --scrape-only ${{ github.event.inputs.state && format('--state {0}', github.event.inputs.state) || '' }}

      - name: Run Full Pipeline (Manual - Full)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Running full venue tournament scraping pipeline..."
          echo "Triggered: $(date -u)"
          echo ""
          echo "Source 1: PokerAtlas"
          node scripts/run-full-pipeline.js --scrape-only
          echo ""
          echo "Source 2: Bravo Poker Live"
          # This used to be `node scripts/scrape-bravo-poker.js || echo "... (non-fatal)"`.
          # The `|| echo` swallowed every exit code, including a MODULE_NOT_FOUND
          # crash, so the step reported success whether or not Bravo contributed a
          # single row. The call itself stays — it is the only Bravo coverage in
          # this pipeline — but the outcome is now visible: a present script that
          # fails fails the step, and a missing script is announced instead of
          # being hidden behind a green check.
          if [ -f scripts/scrape-bravo-poker.js ]; then
            node scripts/scrape-bravo-poker.js
          else
            echo "::warning::scripts/scrape-bravo-poker.js is not present — Bravo Poker Live source skipped"
          fi
          echo ""
          echo "Source 3: CardPlayer (tournaments)"
          # scrape-cardplayer.js writes venue_daily_tournaments; the .py variant
          # in the scrape-cardplayer-news job writes poker_news. Different
          # sources, both wanted - do not collapse them into one.
          if [ -f scripts/scrape-cardplayer.js ]; then
            node scripts/scrape-cardplayer.js
          else
            echo "::warning::scripts/scrape-cardplayer.js missing - CardPlayer tournament source skipped"
          fi

      - name: Run Pipeline (Manual - Test)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🧪 Running test scrape (10 venues)..."
          node scripts/run-full-pipeline.js --test --scrape-only ${{ github.event.inputs.state && format('--state {0}', github.event.inputs.state) || '' }}

      - name: Run Pipeline (Manual - Setup Only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'setup-only' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "📦 Running setup only..."
          node scripts/run-full-pipeline.js --setup-only

      - name: Verify Unverified Venues
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'verify-venues' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔍 Running venue verification (checking multiple sources)..."
          node scripts/verify-all-venues.js 100

      - name: Scrape PokerAtlas Directory
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'scrape-directory' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🗺️ Scraping PokerAtlas directory to get accurate venue URLs..."
          node scripts/scrape-pokeratlas-directory.js

      - name: Upload scraper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.run_number }}
          path: |
            /tmp/venue-*.png
            /tmp/venue-*.html
          retention-days: 3
          if-no-files-found: ignore

      - name: Report Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 SCRAPER WORKFLOW COMPLETED"
          echo "═══════════════════════════════════════════════════════════"
          echo "Mode: ${{ github.event.inputs.mode || 'scheduled-full' }}"
          echo "State Filter: ${{ github.event.inputs.state || 'all' }}"
          echo "Completed at: $(date -u)"
          echo "═══════════════════════════════════════════════════════════"

  # ── CardPlayer poker-news scraper ────────────────────────────────────────
  # Runs on every scheduled execution and on manual mode=full.
  #
  # This source was previously invoked as `node scripts/scrape-cardplayer.js`
  # (a file that does not exist) inside a step gated on
  # `workflow_dispatch && mode == 'full'`, with the failure swallowed by
  # `|| echo`. The result: the scraper never ran on any schedule, poker_news
  # received nothing from CardPlayer, and CI stayed green throughout.
  #
  # It lives in its own job so a CardPlayer outage cannot mask or block the
  # PokerAtlas venue-tournament pipeline above, and so its failures are visible
  # as a distinct red check rather than a line in a scroll of logs.
  scrape-cardplayer-news:
    name: "CardPlayer News Scraper"
    if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scrapling + Supabase client
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Exactly the packages scripts/scrape-cardplayer.py already imports
          # (scrapling.fetchers.StealthySession, supabase, dotenv). Same install
          # sequence as weekly-schedule-scraper.yml.
          pip install "scrapling[all]" camoufox python-dotenv supabase
          scrapling install
          python -m camoufox fetch
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Provide .env.local placeholder
        run: |
          set -euo pipefail
          # scripts/scrape-cardplayer.py hard-codes an absolute macOS path for
          # .env.local and exits 1 when that path is missing, before it ever looks
          # at the process environment. The file only has to exist, so it is left
          # empty: no credential is written to disk, load_dotenv() finds nothing to
          # load, and the real values come from the `env:` block on the run step
          # below (load_dotenv does not override variables that are already set).
          # Delete this step once scrape-cardplayer.py reads its config from the
          # environment directly.
          ENV_DIR="/Users/smarter.poker/Documents/Smarter-Poker-World-Hub"
          sudo mkdir -p "$ENV_DIR"
          sudo touch "$ENV_DIR/.env.local"
          sudo chmod a+r "$ENV_DIR/.env.local"

      - name: Run CardPlayer scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Supabase credentials are not configured — refusing to run the CardPlayer scraper."
            exit 1
          fi
          # No `|| echo` guard: a non-zero exit must fail this job.
          python scripts/scrape-cardplayer.py

      - name: CardPlayer Summary
        if: always()
        run: |
          {
            echo "### CardPlayer news scraper"
            echo ""
            echo "- Completed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
