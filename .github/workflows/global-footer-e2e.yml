name: Global Footer E2E

# Pull requests only (2026-09-04): the merge commit of a green pull request is
# the same tree, and running the 9-minute contract again on it queued a runner
# behind the next pull request's required checks.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: global-footer-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  footer:
    name: Chromium and WebKit footer contract
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium and WebKit
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then npx playwright install chromium webkit; else npx playwright install --with-deps chromium webkit; fi

      - name: Build production application
        run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

      - name: Start production server
        run: |
          nohup node_modules/.bin/next start -p 3000 > /tmp/footer-next-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

      - name: Wait for server
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/hub/install -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -100 /tmp/footer-next-server.log || true
          exit 1

      - name: Verify footer routes and geometry
        # This suite deliberately exercises 203 SSR routes, 84 live controls, and
        # 16 viewport sizes against one production server. Running its large
        # browser cases concurrently can exhaust the shared server and turn
        # healthy route hydration into transient 500/hidden-node failures.
        run: npx playwright test e2e/global-footer-visual.spec.ts --project=footer-chromium --project=footer-webkit --workers=1
        env:
          CI: true
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000

      # Mobile performance budget (mobile programme item 10): the ten rollout
      # pages at 375px against scripts/ci/mobile-budget.json. Same server,
      # same build, so it costs one more minute, not another job.
      - name: Mobile performance budget (ten rollout pages)
        run: npx playwright test e2e/mobile-budget.spec.ts --project=mobile-budget --workers=2
        env:
          CI: true
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000

      - name: Stop server and surface log
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi
          tail -100 /tmp/footer-next-server.log 2>/dev/null || true

      - name: Upload footer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-footer-e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
