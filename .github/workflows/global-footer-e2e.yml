name: Global Footer E2E

# Pull requests only (2026-09-04): the merge commit of a green pull request is
# the same tree, and running the 9-minute contract again on it queued a runner
# behind the next pull request's required checks.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: global-footer-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  footer:
    name: Chromium and WebKit footer contract
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # A clean production build currently takes about six minutes. The serialized
    # Chromium/WebKit route matrix plus premium and mobile gates can take another
    # twelve when WebKit legitimately uses one retry, so 15 minutes canceled a
    # healthy run before the final gates executed. Keep a bounded ceiling with
    # enough room for the workflow's configured retry policy.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm


      # THE COLD INSTALL, EVERY RUN (2026-09-08). `cache: npm` above keeps only
      # the tarballs; extracting 1,324 packages still happened on every run of
      # this job. The pattern below is the one already proven in this repo at
      # build-safety-gate.yml's type-check job on 2026-09-04: 424s -> ~15s.
      #
      # The key is SHARED with the other --ignore-scripts jobs in this repo on
      # purpose. Club Arena kept two deliberately separate node_modules caches
      # for two jobs installing the identical tree, so neither ever warmed the
      # other; there is no reason to repeat that here. --ignore-scripts means
      # no native binaries are built, so the tree is portable between the
      # self-hosted estate runners and hosted ubuntu.
      #
      # The install is SKIPPED on a hit, because `npm ci` deletes node_modules
      # before installing and would throw the restored tree away.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-noscripts-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts


      # Playwright browsers were downloaded from scratch on every run - no job
      # in this repo cached ~/.cache/ms-playwright (verified 2026-09-08: no
      # match for ms-playwright or PLAYWRIGHT_BROWSERS_PATH in any of the 38
      # workflow files). The install step still RUNS below rather than being
      # skipped on a hit: Playwright no-ops when the browser is already on
      # disk, and that keeps the OS-dependency half of --with-deps honest
      # instead of trusting a cache to have provided it.
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-wh-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-wh-${{ runner.os }}-

      - name: Install Chromium and WebKit
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then npx playwright install chromium webkit; else npx playwright install --with-deps chromium webkit; fi

      - name: Verify Phase 3 static World menu contracts
        run: node --test __tests__/world-menu-mobile-phase3.test.mjs

      - name: Build production application
        run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

      # PER-RUNNER PORT (2026-09-04). `next start -p 3000` collided the hour the
      # World Hub got six runners per box: two pull requests reaching this step
      # together, and the second died with EADDRINUSE. Same fix as Club Arena's
      # E2E jobs: a port derived from RUNNER_NAME, and that port freed first in
      # case a CANCELLED run on this runner left its server behind - safe only
      # because the port is this runner's alone.
      - name: Reserve this runner's port
        id: port
        run: |
          PORT=$(node scripts/ci/e2e-port.mjs 3000)
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "Server port for ${RUNNER_NAME:-local}: $PORT"
          PIDS=$(lsof -tiTCP:"$PORT" -sTCP:LISTEN 2>/dev/null || true)
          if [ -n "$PIDS" ]; then echo "freeing port $PORT held by orphaned pid(s): $PIDS"; kill -9 $PIDS 2>/dev/null || true; fi

      - name: Start production server
        run: |
          nohup node_modules/.bin/next start -p ${{ steps.port.outputs.port }} > /tmp/footer-next-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

      - name: Wait for server
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:${{ steps.port.outputs.port }}/hub/install -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -100 /tmp/footer-next-server.log || true
          exit 1

      - name: Verify footer routes and geometry
        # This suite deliberately exercises 203 SSR routes, 84 live controls, and
        # 16 viewport sizes against one production server. Running its large
        # browser cases concurrently can exhaust the shared server and turn
        # healthy route hydration into transient 500/hidden-node failures.
        run: npx playwright test e2e/global-footer-visual.spec.ts --project=footer-chromium --project=footer-webkit --workers=1
        env:
          CI: true
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:${{ steps.port.outputs.port }}

      - name: Verify premium World menu presentation
        # Training is the heaviest World route. Running its Chromium screenshot
        # while WebKit hydrates the same route can starve screenshot stability on
        # the shared production server, even though both browser contracts pass
        # independently. Keep this cross-browser visual gate deterministic.
        run: npx playwright test e2e/022-world-menu-visual.spec.ts e2e/023-world-menu-webkit.spec.ts --project=world-menu-visual --project=world-menu-webkit --workers=1
        env:
          CI: true
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:${{ steps.port.outputs.port }}

      - name: Verify Phase 3 mobile World menu behavior
        run: npx playwright test e2e/024-world-menu-mobile-phase3.spec.ts --project=world-menu-phase3-chromium --project=world-menu-phase3-webkit --workers=1
        env:
          CI: true
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:${{ steps.port.outputs.port }}

      # Mobile performance budget: all thirteen non-Social World roots at
      # 375px against scripts/ci/mobile-budget.json. Same server,
      # same build, so it costs one more minute, not another job.
      - name: Mobile performance budget (thirteen World roots)
        run: npx playwright test e2e/mobile-budget.spec.ts --project=mobile-budget --workers=2
        env:
          CI: true
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:${{ steps.port.outputs.port }}

      - name: Stop server and surface log
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi
          tail -100 /tmp/footer-next-server.log 2>/dev/null || true

      - name: Upload footer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-footer-e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
