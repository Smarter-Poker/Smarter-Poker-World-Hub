name: Build Safety Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax & Corruption Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CHECK 1: node -c syntax validation on all changed .js files
      - name: Syntax validation (node -c)
        run: |
          echo "🔍 Running syntax validation on .js files..."
          ERRORS=0
          for file in $(find pages/ src/ -name '*.js' ! -path '*/node_modules/*' ! -path '*/.next/*'); do
            # Skip files with import assertions (valid in webpack, not in Node)
            grep -q 'assert {' "$file" 2>/dev/null && continue
            if ! node -c "$file" 2>/dev/null; then
              echo "❌ SYNTAX ERROR: $file"
              node -c "$file" 2>&1 | head -5
              echo ""
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "💥 $ERRORS file(s) have syntax errors. Build will fail."
            exit 1
          fi
          echo "✅ All .js files pass syntax validation"

      # CHECK 2: Catch-block corruption patterns
      - name: Catch-block corruption scan
        run: |
          echo "🔍 Scanning for catch-block corruption patterns..."
          ERRORS=0

          # Pattern 1: catch(...) { ... } = await (orphaned assignment)
          P1=$(grep -rn 'catch.*console\.warn.*} = await' --include='*.js' --include='*.jsx' pages/ src/ 2>/dev/null || true)
          if [ -n "$P1" ]; then
            echo "❌ CATCH CORRUPTION: Orphaned '= await' after collapsed catch block"
            echo "$P1"
            ERRORS=$((ERRORS + 1))
          fi

          # Pattern 2: .single() calls (must use .maybeSingle())
          P2=$(grep -rn '\.single()' --include='*.js' --include='*.jsx' pages/ src/ 2>/dev/null | grep -v 'maybeSingle' | grep -v '// .*single' || true)
          if [ -n "$P2" ]; then
            echo "❌ .single() detected — must use .maybeSingle()"
            echo "$P2"
            ERRORS=$((ERRORS + 1))
          fi

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "💥 $ERRORS corruption pattern(s) found."
            exit 1
          fi
          echo "✅ No corruption patterns found"

      # CHECK 3: Dangerous Supabase auth patterns in non-utility files
      - name: Supabase auth safety check
        run: |
          echo "🔍 Checking for dangerous Supabase auth patterns..."
          HITS=$(grep -rn 'supabase\.auth\.getUser\|supabase\.auth\.getSession' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            pages/ src/ 2>/dev/null \
            | grep -v 'authUtils' | grep -v 'AvatarContext' | grep -v 'safeSupabase' \
            | grep -v 'supabaseServerClient' | grep -v 'eslint-plugin' \
            | grep -v 'auth-middleware' || true)
          if [ -n "$HITS" ]; then
            echo "⚠️ WARNING: Direct supabase.auth calls found (should use authUtils.ts)"
            echo "$HITS"
          fi
          echo "✅ Auth safety check complete"
