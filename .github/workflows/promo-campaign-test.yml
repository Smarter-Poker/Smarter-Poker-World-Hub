name: Promo Campaign Preview & Single Test Dispatch

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation (preview, test, or send)'
        required: true
        default: 'preview'
        type: choice
        options:
          - 'preview'
          - 'test'
          - 'send'
      scope:
        description: 'Target audience scope'
        required: true
        default: 'non_accounts'
        type: choice
        options:
          - 'non_accounts'
          - 'subscribers_only'
          - 'all'
      confirm_send:
        description: 'Type SEND_LIVE_PROMO to authorize action=send'
        required: false
        default: ''
        type: string
      test_email:
        description: 'Single test email recipient (for action=test)'
        required: false
        default: ''
        type: string
      test_phone:
        description: 'Single test SMS phone number (for action=test)'
        required: false
        default: ''
        type: string

concurrency:
  group: promo-campaign-test
  cancel-in-progress: false

jobs:
  promo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Invoke live /api/news/promo-campaign
        env:
          SIGNING_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROMO_ACTION: ${{ inputs.action }}
          PROMO_SCOPE: ${{ inputs.scope }}
          CONFIRM_SEND: ${{ inputs.confirm_send }}
          TEST_EMAIL: ${{ inputs.test_email }}
          TEST_PHONE: ${{ inputs.test_phone }}
        run: |
          node - <<'EOF'
          const crypto = require('node:crypto');
          (async () => {
            const secret = (process.env.SIGNING_SECRET || '').trim();
            if (!secret) throw new Error('SUPABASE_SERVICE_ROLE_KEY secret is missing');
            const action = (process.env.PROMO_ACTION || 'preview').trim();
            const scope = (process.env.PROMO_SCOPE || 'non_accounts').trim();
            const confirmSend = (process.env.CONFIRM_SEND || '').trim();
            if (!['preview', 'test', 'send'].includes(action)) {
              throw new Error('Only preview, test, or send actions are permitted');
            }
            if (action === 'send' && confirmSend !== 'SEND_LIVE_PROMO') {
              throw new Error('confirm_send must equal SEND_LIVE_PROMO for action=send');
            }
            const testEmail = (process.env.TEST_EMAIL || '').trim().toLowerCase();
            const testPhone = (process.env.TEST_PHONE || '').trim();
            const ts = String(Math.floor(Date.now() / 1000));
            const sigPayload = action === 'send'
              ? `${ts}:${action}:${testEmail}:${testPhone}:${confirmSend}`
              : `${ts}:${action}:${testEmail}:${testPhone}`;
            const sig = crypto
              .createHmac('sha256', secret)
              .update(sigPayload)
              .digest('hex');

            const res = await fetch('https://smarter.poker/api/news/promo-campaign', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-operator-timestamp': ts,
                'x-operator-signature': sig,
              },
              body: JSON.stringify({
                action,
                scope,
                confirmSend,
                testEmail,
                testPhone,
              }),
            });
            const body = await res.json().catch(() => ({}));
            console.log('HTTP', res.status);
            console.log(JSON.stringify(body, null, 2));
            if (!res.ok || body.success === false || body.error) {
              process.exit(1);
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
