##
# PUSH DELIVERY WATCHDOG
# ═══════════════════════════════════════════════════════════════════════════
#
# 2026-08-26. Push notifications were broken on every phone for months and
# nothing anywhere noticed. The platform reached 1,376 notifications skipped
# with failure_reason='no_subscription' and 0 active subscriptions, while
# pages/api/cron/push-health.js ran happily the entire time — it only checks
# INDIVIDUAL users (zombie endpoints, staff with no device), so with nobody
# subscribed it had nothing to complain about. Silence looked like health.
#
# The final failure was even quieter: PR #777 merged, CI went green, and
# /push/sw.js still returned 404 because the deploy had not finished. A green
# tick answers "did it merge", never "is it serving".
#
# This asks PRODUCTION the three questions that actually matter, and it runs
# after every push to main rather than on a schedule — deliberately, so it
# needs no entry in the CHECK 6c cron allowlist (CLAUDE.md section 11.4) and
# cannot drift out of it.
#
#   1. Is the dedicated push worker actually SERVED?      (the 404)
#   2. Does it still have no precache / no fetch handler? (the 30s hang)
#   3. Does the shipped client still register it?         (silent revert)
#
# Everything is checked by STRING LITERAL. Minification renames identifiers,
# so grepping a bundle for a function or component name gives a false negative
# that looks exactly like a failed deploy — a mistake that cost real time here.
##
name: Push Delivery Watchdog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: push-delivery-watchdog
  # FALSE ON main (2026-09-08). Measured by scripts/ci/report-pipeline-p50.mjs
  # on its first run: this workflow made 26 runs on main in seven days and 21
  # of them were CANCELLED. It triggers on push:[main] and workflow_dispatch
  # only, so a bare `true` meant four runs in five told nobody anything - and
  # this one is a WATCHDOG. A watchdog that is cancelled before it can look is
  # not a quieter watchdog, it is an absent one that reports green.
  #
  # Same rule and same measurement as e2e-tests.yml: median 7m 50s between
  # commits on main, 50 of 99 gaps under eight minutes, against a job that
  # installs dependencies and a WebKit browser before it probes anything.
  # .agent/audits/2026-08-21-publish-deadlock-and-palette-clobber.md:55-59.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  probe:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Wait for the deploy to land
        # A push to main is the START of a Vercel build, not the end. Probing
        # immediately would report the PREVIOUS deploy and pass while the new
        # one is still building — or fail on a 404 that is merely early.
        run: sleep 240

      - name: Checkout footer probe
        uses: actions/checkout@v4

      - name: Setup Node for footer probe
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm


      # THE COLD INSTALL, EVERY RUN (2026-09-08). `cache: npm` above keeps only
      # the tarballs; extracting 1,324 packages still happened on every run of
      # this job. The pattern below is the one already proven in this repo at
      # build-safety-gate.yml's type-check job on 2026-09-04: 424s -> ~15s.
      #
      # The key is SHARED with the other --ignore-scripts jobs in this repo on
      # purpose. Club Arena kept two deliberately separate node_modules caches
      # for two jobs installing the identical tree, so neither ever warmed the
      # other; there is no reason to repeat that here. --ignore-scripts means
      # no native binaries are built, so the tree is portable between the
      # self-hosted estate runners and hosted ubuntu.
      #
      # The install is SKIPPED on a hit, because `npm ci` deletes node_modules
      # before installing and would throw the restored tree away.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-noscripts-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install footer probe dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts


      # Playwright browsers were downloaded from scratch on every run - no job
      # in this repo cached ~/.cache/ms-playwright (verified 2026-09-08: no
      # match for ms-playwright or PLAYWRIGHT_BROWSERS_PATH in any of the 38
      # workflow files). The install step still RUNS below rather than being
      # skipped on a hit: Playwright no-ops when the browser is already on
      # disk, and that keeps the OS-dependency half of --with-deps honest
      # instead of trusting a cache to have provided it.
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-wh-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-wh-${{ runner.os }}-

      - name: Install WebKit for the footer probe
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then npx playwright install webkit; else npx playwright install --with-deps webkit; fi

      - name: Probe production footer geometry in WebKit
        id: footer-probe
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://smarter.poker
        # Match the blocking footer workflow's controlled concurrency. Four
        # parallel WebKit workers can overload live route hydration and report
        # a healthy fixed footer as hidden; one worker verifies the same full
        # contract deterministically without changing product behavior.
        run: npx playwright test e2e/global-footer-visual.spec.ts --project=footer-webkit --workers=1 --reporter=line --retries=1

      - name: Probe production push delivery
        id: probe
        run: |
          set -uo pipefail
          FAIL=0
          note() { echo "$1"; echo "$1" >> /tmp/findings.txt; }
          : > /tmp/findings.txt

          echo "── 1. is /push/sw.js served? ─────────────────────────────"
          CODE=$(curl -s -o /tmp/psw.js -w '%{http_code}' --max-time 25 https://smarter.poker/push/sw.js || echo 000)
          echo "   HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            note "❌ /push/sw.js returned HTTP $CODE. Push enrolment is dead on every device: the client registers this file, and without it users get a service-worker timeout."
            FAIL=1
          fi

          if [ "$CODE" = "200" ]; then
            echo "── 2. is it still a MINIMAL worker? ────────────────────"
            # Strip comments before judging: the file explains the precache bug
            # in prose, and matching prose instead of code is its own failure.
            sed -e 's://.*::' /tmp/psw.js | perl -0pe 's{/\*.*?\*/}{}gs' > /tmp/psw.code.js

            if ! grep -qE "addEventListener\(\s*['\"]push['\"]" /tmp/psw.code.js; then
              note "❌ /push/sw.js has no push handler. Notifications will be delivered to the device and silently dropped."
              FAIL=1
            fi
            if grep -qi "precache" /tmp/psw.code.js; then
              note "❌ /push/sw.js now precaches. A worker does not activate until install RESOLVES, so any precache reintroduces the 30-second enrolment hang."
              FAIL=1
            fi
            if grep -qE "addEventListener\(\s*['\"]fetch['\"]" /tmp/psw.code.js; then
              note "❌ /push/sw.js now has a fetch handler. That drags it into the request path and back into the failure mode it exists to avoid."
              FAIL=1
            fi
          fi

          echo "── 3. does the shipped client still register it? ────────"
          curl -s --max-time 25 https://smarter.poker/hub -o /tmp/hub.html || true
          APP=$(grep -o '/_next/static/chunks/pages/_app-[a-z0-9]*\.js' /tmp/hub.html | head -1)
          if [ -z "$APP" ]; then
            note "⚠️ Could not find the _app bundle on /hub, so the client-side check was skipped."
          else
            curl -s --max-time 25 "https://smarter.poker$APP" -o /tmp/app.js || true
            if ! grep -qF '/push/sw.js' /tmp/app.js; then
              note "❌ The deployed client no longer registers /push/sw.js. Push enrolment has been re-pointed at another worker — most likely /sw.js, which precaches 818 URLs and cannot activate in time."
              FAIL=1
            fi
          fi

          echo "failed=$FAIL" >> "$GITHUB_OUTPUT"
          { echo "findings<<EOF"; cat /tmp/findings.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Raise or clear the alarm
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.probe.outputs.failed }}
          FINDINGS: ${{ steps.probe.outputs.findings }}
        with:
          script: |
            const TITLE = 'Push delivery is broken in production';
            const failed = process.env.FAILED === '1';
            const findings = process.env.FINDINGS || '';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'push-watchdog', per_page: 20,
            });
            const existing = open.find(i => i.title === TITLE);

            if (!failed) {
              // Self-closing: an alarm nobody clears is an alarm nobody reads.
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Production push delivery is healthy again as of ${context.sha.slice(0,10)}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
              }
              core.info('Push delivery healthy.');
              return;
            }

            const body = [
              '**Production push delivery is failing.** Probed directly, not inferred from CI.',
              '',
              findings,
              '',
              `Commit: \`${context.sha}\``,
              '',
              '---',
              'Background: push was broken on every phone for months and nothing noticed,',
              'because `pages/api/cron/push-health.js` only inspects individual users and',
              'there were no subscriptions to inspect. The last failure was a 404 on',
              '`/push/sw.js` after a green merge. This watchdog asks production instead.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: ['push-watchdog'],
              });
            }
            core.setFailed('Production push delivery probe failed.');

      - name: Raise or clear the footer alarm
        if: always()
        uses: actions/github-script@v7
        env:
          FOOTER_OUTCOME: ${{ steps.footer-probe.outcome }}
        with:
          script: |
            const TITLE = 'Global footer is broken in production';
            const failed = process.env.FOOTER_OUTCOME !== 'success';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find(issue => issue.title === TITLE);

            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `WebKit verified both World Hub and Club Arena footers healthy again at ${context.sha.slice(0, 10)}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              core.info('Production footer geometry is healthy in WebKit.');
              return;
            }

            const body = [
              '**The live footer contract failed in WebKit after deployment.**',
              '',
              'The probe checks the World Hub footer, the footerless Club Arena lobby,',
              'the Club Arena footer health route, all six controls, viewport bounds,',
              'fixed positioning, and desktop height.',
              '',
              `Commit: \`${context.sha}\``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
              });
            }
            core.setFailed('Production footer geometry probe failed.');
