name: Qualify Training M1 Release
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Verify transport and sealed release builders without solver execution
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          node --test --test-name-pattern='solver launcher gates' __tests__/training-solver-contract.test.mjs
          cd scripts/preflop-deep
          python3 -B -m unittest test_release_bundle test_build_release_bundle test_build_m1_bounded_canary test_bounded_canary
      - name: Build exact corrected M1 release from protected source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B .github/scripts/qualify_training_m1_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: training-m1-qualified-release-${{ github.run_id }}
          path: ${{ runner.temp }}/training-m1-qualified-release
          if-no-files-found: error
          retention-days: 14
