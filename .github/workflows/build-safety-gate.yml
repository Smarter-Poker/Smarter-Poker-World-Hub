name: Build Safety Gate

# Runs on pushes to main and PRs targeting main — NOT all branches
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# CRITICAL FIX: Cancel older runs when a newer push arrives.
# This prevents a queue of 15 stale builds piling up when pushing rapidly.
# The LATEST push always wins — older ones are cancelled immediately.
# Vercel's own git integration handles the actual deploy (see vercel.json).
concurrency:
  group: safety-gate-${{ github.ref }}
  cancel-in-progress: true

# Permissions needed for safety checks + failure notification (issue creation)
permissions:
  contents: read
  issues: write

jobs:
  safety-checks:
    name: Pre-Deploy Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts 2>/dev/null || {
            echo "::warning::npm ci failed (lockfile sync issue) — falling back to npm install"
            npm install --ignore-scripts
          }

      - name: Record Start Time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════
      # CHECK 1: No .single() calls (must use .maybeSingle())
      # .single() throws PGRST116 when 0 rows returned = crash
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 1: No .single() in Supabase queries"
        run: |
          echo "Scanning for .single() calls..."
          HITS=$(grep -rn '\.single()' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude='*.bak' \
            pages/ src/ lib/ services/ 2>/dev/null \
            | grep -v 'maybeSingle' \
            | grep -v '// .*single' || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found .single() calls that should be .maybeSingle():"
            echo "$HITS"
            echo ""
            echo "Fix: Replace .single() with .maybeSingle() in all Supabase queries"
            exit 1
          fi
          echo "✓ No .single() calls found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 2: No unused hook imports (the ThreePillHeader bug)
      # Imported but uncalled hooks = ReferenceError during SSG
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 2: No unused React hook imports"
        run: |
          echo "Scanning for unused hook imports..."
          ERRORS=0
          for file in $(find pages/ src/ -name '*.js' -o -name '*.jsx' -o -name '*.tsx' | grep -v node_modules | grep -v .next); do
            HOOKS=$(grep -oE 'import\s+\{[^}]*\}' "$file" 2>/dev/null | grep -oE 'use[A-Z][a-zA-Z]+' | sort -u)
            for hook in $HOOKS; do
              CALL_COUNT=$(grep -cE "${hook}\s*[<(]" "$file" 2>/dev/null || echo 0)
              if [ "$CALL_COUNT" -eq 0 ]; then
                echo "::error file=${file}::Hook '${hook}' is imported but NEVER CALLED"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::FATAL: $ERRORS unused hook import(s) found. These WILL crash the build."
            exit 1
          fi
          echo "✓ All imported hooks are called"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 3: No dynamic Supabase imports bypassing patched client
      # Must use src/lib/supabaseServerClient, never raw import
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 3: No raw Supabase imports in API routes"
        run: |
          echo "Scanning for unpatched Supabase client usage..."
          HITS=$(grep -rn "await import.*@supabase/supabase-js" \
            --include='*.js' --include='*.ts' \
            pages/api/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found dynamic @supabase/supabase-js imports bypassing patched server client:"
            echo "$HITS"
            echo ""
            echo "Fix: Use 'import { createClient } from \"src/lib/supabaseServerClient\"' instead"
            exit 1
          fi
          echo "✓ All API routes use patched Supabase client"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 4: No merge conflict markers in source files
      # These cause immediate syntax errors and broken builds
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 4: No merge conflict markers"
        run: |
          echo "Scanning for git merge conflict markers..."
          HITS=$(grep -rn "^<<<<<<< " \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.next \
            src/ pages/ data/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found git merge conflict markers in source files:"
            echo "$HITS"
            exit 1
          fi
          echo "✓ No merge conflict markers found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 5: TypeScript compilation (advisory — does not block deploy)
      # Hub has pre-existing Supabase type gaps (tables typed as 'never').
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 5: TypeScript compilation (advisory)"
        continue-on-error: true
        run: |
          echo "Running TypeScript check (advisory — does not block deploy)..."
          npx tsc --noEmit 2>&1 | grep "error TS" > /tmp/ts-errors.txt || true
          TS_ERRORS=$(wc -l < /tmp/ts-errors.txt | tr -d ' ')
          if [ "$TS_ERRORS" -gt 0 ]; then
            echo "::warning::TypeScript found $TS_ERRORS type error(s) — review recommended"
            head -20 /tmp/ts-errors.txt
          else
            echo "✓ TypeScript compilation passed — zero errors"
          fi

      - name: Report Check Duration
        if: always()
        run: |
          END=$(date +%s)
          ELAPSED=$(( END - ${{ steps.timer.outputs.start }} ))
          echo "## ⏱️ Safety Gate Duration: ${ELAPSED}s" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════
  # FAILURE NOTIFICATION — Auto-create GitHub Issue on pipeline failure
  # ═══════════════════════════════════════════════════════════════════
  notify-failure:
    name: Failure Notification
    needs: [safety-checks]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);

            const issues = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'ci-failure',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issues.data[0].number,
                body: `🔴 **Another CI failure** on commit \`${sha}\`\n\n[View run](${runUrl})`
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `🔴 Build Safety Gate Failed — ${new Date().toISOString().split('T')[0]}`,
                body: `## Build Safety Gate Failure\n\n**Commit:** \`${sha}\`\n**Run:** [View details](${runUrl})\n\nThis issue was auto-created by the CI pipeline. Close when resolved.`,
                labels: ['ci-failure']
              });
            }
