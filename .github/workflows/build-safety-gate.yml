name: Build Safety Gate

# Runs on EVERY push and PR — no exceptions
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel previous runs on same branch (saves GitHub Actions minutes)
concurrency:
  group: safety-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-checks:
    name: Pre-Deploy Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Record Start Time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════
      # Dependency Audit (advisory — does not block deploy)
      # ═══════════════════════════════════════════════════════════════
      - name: Dependency Audit
        continue-on-error: true
        run: |
          CRITICAL=$(npm audit --audit-level=critical 2>&1 | grep -c "critical" || echo 0)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::warning::Found critical npm vulnerabilities — review recommended"
          else
            echo "✓ No critical vulnerabilities"
          fi

      # ═══════════════════════════════════════════════════════════════
      # CHECK 0: TypeScript compilation (WARNING ONLY — non-blocking)
      # Hub has pre-existing Supabase type gaps (tables typed as 'never').
      # Real build failures are caught by CHECK 5 (Next.js build).
      # This check surfaces TS issues without blocking deploy.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 0: TypeScript compilation (advisory)"
        continue-on-error: true
        run: |
          echo "Running TypeScript check (advisory — does not block deploy)..."
          npx tsc --noEmit 2>&1 | grep "error TS" > /tmp/ts-errors.txt || true
          TS_ERRORS=$(wc -l < /tmp/ts-errors.txt | tr -d ' ')
          if [ "$TS_ERRORS" -gt 0 ]; then
            echo "::warning::TypeScript found $TS_ERRORS type error(s) — review recommended"
            head -20 /tmp/ts-errors.txt
            echo ""
            echo "⚠️ $TS_ERRORS type errors found (advisory only — deploy NOT blocked)"
            echo "   Real build failures are caught by CHECK 5 (Next.js build)"
          else
            echo "✓ TypeScript compilation passed — zero errors"
          fi

      # ═══════════════════════════════════════════════════════════════
      # CHECK 1: No .single() calls (must use .maybeSingle())
      # .single() throws PGRST116 when 0 rows returned = crash
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 1: No .single() in Supabase queries"
        run: |
          echo "Scanning for .single() calls..."
          HITS=$(grep -rn '\.single()' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude='*.bak' \
            pages/ src/ lib/ services/ 2>/dev/null \
            | grep -v 'maybeSingle' \
            | grep -v '// .*single' || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found .single() calls that should be .maybeSingle():"
            echo "$HITS"
            echo ""
            echo "Fix: Replace .single() with .maybeSingle() in all Supabase queries"
            exit 1
          fi
          echo "✓ No .single() calls found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 2: No unused hook imports (the ThreePillHeader bug)
      # Imported but uncalled hooks = ReferenceError during SSG
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 2: No unused React hook imports"
        run: |
          echo "Scanning for unused hook imports..."
          ERRORS=0
          for file in $(find pages/ src/ -name '*.js' -o -name '*.jsx' -o -name '*.tsx' | grep -v node_modules | grep -v .next); do
            HOOKS=$(grep -oE 'import\s+\{[^}]*\}' "$file" 2>/dev/null | grep -oE 'use[A-Z][a-zA-Z]+' | sort -u)
            for hook in $HOOKS; do
              CALL_COUNT=$(grep -cE "${hook}\s*[<(]" "$file" 2>/dev/null || echo 0)
              if [ "$CALL_COUNT" -eq 0 ]; then
                echo "::error file=${file}::Hook '${hook}' is imported but NEVER CALLED"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::FATAL: $ERRORS unused hook import(s) found. These WILL crash the build."
            exit 1
          fi
          echo "✓ All imported hooks are called"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 3: No dynamic Supabase imports bypassing patched client
      # Must use src/lib/supabaseServerClient, never raw import
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 3: No raw Supabase imports in API routes"
        run: |
          echo "Scanning for unpatched Supabase client usage..."
          HITS=$(grep -rn "await import.*@supabase/supabase-js" \
            --include='*.js' --include='*.ts' \
            pages/api/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found dynamic @supabase/supabase-js imports bypassing patched server client:"
            echo "$HITS"
            echo ""
            echo "Fix: Use 'import { createClient } from \"src/lib/supabaseServerClient\"' instead"
            exit 1
          fi
          echo "✓ All API routes use patched Supabase client"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 4: No .limit() on JavaScript arrays
      # .limit() is a Supabase query builder method, NOT an array method
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 4: No .limit() on array operations"
        run: |
          echo "Scanning for .limit() after .filter()/.reduce()/.map()..."
          HITS=$(grep -rn '\.filter(.*\.limit(\|\.reduce(.*\.limit(\|\.map(.*\.limit(' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            --exclude-dir=node_modules --exclude-dir=.next \
            pages/ src/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found .limit() called on JavaScript array operations (not Supabase queries):"
            echo "$HITS"
            exit 1
          fi
          echo "✓ No .limit() on array operations"

      - name: "CHECK 5: Validate Environment Variables"
        continue-on-error: true
        run: |
          echo "## 🔐 Environment Variable Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          for VAR in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -n "${!VAR:-}" ]; then
              echo "✅ $VAR is set" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $VAR is MISSING" >> $GITHUB_STEP_SUMMARY
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::warning::$MISSING environment variable(s) not available"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ═══════════════════════════════════════════════════════════════
      # CHECK 6: Next.js compilation check
      # Verifies no broken imports, syntax errors, or module resolution failures
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 6: Next.js compilation"
        run: |
          set -o pipefail
          echo "Running Next.js build compilation check..."
          # Clean stale .next cache to prevent ENOENT unlink errors on deleted/moved pages
          rm -rf .next
          BUILD_EXIT=0
          NODE_OPTIONS="--max_old_space_size=4096" npx next build 2>&1 | tee build.log || BUILD_EXIT=$?
          if [ "$BUILD_EXIT" -ne 0 ] || grep -q "Failed to compile" build.log; then
            echo "::error::FATAL: Next.js build compilation failed (exit code: $BUILD_EXIT)"
            tail -50 build.log
            exit 1
          fi
          echo "✓ Build compilation passed"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Report Build Time
        if: always()
        run: |
          END=$(date +%s)
          ELAPSED=$(( END - ${{ steps.timer.outputs.start }} ))
          echo "## ⏱️ Total Pipeline Duration: ${ELAPSED}s" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY TO VERCEL (only after ALL safety checks pass)
  # Git auto-deploy disabled via vercel.json git.deploymentEnabled: false
  # This is the ONLY way code reaches production.
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Vercel
    needs: safety-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        run: |
          npm install -g vercel
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Report Deploy Failure
        if: failure()
        run: |
          echo "::error::Vercel deployment FAILED after all safety checks passed"
          echo "Check Vercel dashboard for build details"

  # ═══════════════════════════════════════════════════════════════════
  # POST-DEPLOY VERIFICATION (runs after deploy completes)
  # ═══════════════════════════════════════════════════════════════════
  post-deploy-check:
    name: Post-Deploy Verification
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Vercel propagation
        run: sleep 60  # Deploy job already waited for Vercel build

      - name: Verify deployment is live
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://smarter.poker' }}"
          echo "Checking $SITE_URL with retry..."

          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" --max-time 30)
            echo "  Attempt $attempt: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✓ Site is live (HTTP $HTTP_CODE)"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "  Retrying in 30s..."
              sleep 30
            fi
          done

          echo "::error::DEPLOYMENT FAILED: $SITE_URL returned HTTP $HTTP_CODE after 3 attempts"
          exit 1

      - name: Verify API health
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://smarter.poker' }}"

          # Check the health endpoint — allow 404 (endpoint may not exist), only fail on 5xx
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/api/health" --max-time 10)
          echo "API health check: HTTP $API_CODE"

          if [ "$API_CODE" -ge 500 ]; then
            echo "::warning::API health returned HTTP $API_CODE — checking if transient..."
            sleep 10
            API_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/api/health" --max-time 10)
            echo "API health retry: HTTP $API_CODE"
            if [ "$API_CODE" -ge 500 ]; then
              echo "::error::API is returning persistent server errors (HTTP $API_CODE)"
              exit 1
            fi
          fi

          echo "✓ API is responsive (HTTP $API_CODE)"

      - name: Verify Security Headers
        continue-on-error: true
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://smarter.poker' }}"
          HEADERS=$(curl -sI "$SITE_URL")
          echo "## 🔒 Security Headers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for HEADER in "x-content-type-options" "x-frame-options" "referrer-policy" "permissions-policy" "x-xss-protection"; do
            if echo "$HEADERS" | grep -qi "$HEADER"; then
              echo "✅ $HEADER present" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ $HEADER MISSING" >> $GITHUB_STEP_SUMMARY
              echo "::warning::Security header $HEADER is missing from $SITE_URL"
            fi
          done

  # ═══════════════════════════════════════════════════════════════════
  # FAILURE NOTIFICATION — Auto-create GitHub Issue on pipeline failure
  # ═══════════════════════════════════════════════════════════════════
  notify-failure:
    name: Failure Notification
    needs: [safety-checks, deploy, post-deploy-check]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);

            const issues = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'ci-failure',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issues.data[0].number,
                body: `🔴 **Another CI failure** on commit \`${sha}\`\n\n[View run](${runUrl})`
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `🔴 Build Safety Gate Failed — ${new Date().toISOString().split('T')[0]}`,
                body: `## Build Safety Gate Failure\n\n**Commit:** \`${sha}\`\n**Run:** [View details](${runUrl})\n\nThis issue was auto-created by the CI pipeline. Close when resolved.`,
                labels: ['ci-failure']
              });
            }
