            __tests__/search-engines-can-verify-ownership.law.test.mjs \
            __tests__/every-public-asset-path-resolves.test.mjs \
            __tests__/an-oversized-raster-is-served-as-webp.law.test.mjs \
            tests/club-arena-public-routes-are-prerendered.test.mjs

      # ═══════════════════════════════════════════════════════════════
      # CHECK 6: Cron governance — enforce CLAUDE.md section 11
      # All new scheduled jobs must go to Open Claw on Hetzner, not Vercel.
      # Allowed baselines (caps at the numbers captured 2026-04-24):
      #   - vercel.json crons array  ≤ 16
      #   - pages/api/cron/ file count ≤ 45
      #   - GitHub Actions schedule: triggers only on the allowlist below
      # Shrinking these is fine (job retirement). Growing them is blocked.
      # ═══════════════════════════════════════════════════════════════
      # CHECK 16: Swallowed-error ratchet (money paths)
      # A logged-and-ignored Supabase error in a chip path is how settle-period
      # returned success:true while losing a full week of agent commissions and
      # the union rake hold (audit 2026-08-19). Hundreds predate this rule, so
      # this is a RATCHET, not a ban: it fails only when the count GOES UP.
      # Paying debt down means lowering BASELINE in the same commit.
      - name: "CHECK 16: No new swallowed errors in money paths"
        run: |
          set -o pipefail
          echo "## Swallowed-Error Ratchet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if node scripts/check-swallowed-money-errors.mjs 2>&1 | tee /tmp/swallow.log; then
            tail -2 /tmp/swallow.log >> $GITHUB_STEP_SUMMARY
          else
            echo "New swallowed error(s) added in a chip path — handle the error" >> $GITHUB_STEP_SUMMARY
            echo "(return 4xx/5xx or roll back) instead of logging past it." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # CHECK 21: public/ budget (2026-09-05)
      # Everything under public/ is cloned, traced, deployed and cached by
      # Vercel on EVERY build whether or not it changed. It had reached 632 MB
      # across 2,357 files, and an audit could not find a serving reference to
      # 244 MB of it - a one-off importer's dump, GTO panels the runtime reads
      # from Supabase Storage instead, Commander images commander.smarter.poker
      # already serves, 33 *-review.html dev artifacts reachable on the
      # production domain, and thirteen orphaned intro videos. None of it
      # arrived deliberately; it arrived one commit at a time because nothing
      # ever said no.
      # A RATCHET, like CHECK 16: the number only goes DOWN. Adding a needed
      # asset is fine - adding one without noticing is not.
      - name: "CHECK 21: public/ stays inside its budget"
        run: |
          echo "## public/ budget" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if node scripts/ci/check-public-budget.mjs 2>&1 | tee /tmp/pubbudget.log; then
            head -3 /tmp/pubbudget.log >> $GITHUB_STEP_SUMMARY
          else
            head -3 /tmp/pubbudget.log >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Try a .webp/.avif, or serve the file from Supabase Storage /" >> $GITHUB_STEP_SUMMARY
            echo "commander.smarter.poker / ca-static instead of from this build." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # CHECK 22: pinned Python requirements resolve (2026-09-06)
      # scripts/requirements.txt pinned `supabase-py==2.15.0`. No such package:
      # supabase-py is the GitHub REPO name, the PyPI project is `supabase`, and
      # 2.15.0 is a real release of it - so the version was right and the name
      # never existed. pip answers that with "from versions: none", which reads
      # like a yanked release, buried under 700 lines of browser-download
      # progress bars.
      # It broke Charity Scraper V5 and Daily Poker Series Auto-Pilot at their
      # Install Dependencies step for 17 hours. Neither is a required check, so
      # nothing was blocked and nobody looked.
      # Fails OPEN when PyPI is unreachable: a gate that reddens on somebody
      # else's outage gets ignored.
      - name: "CHECK 22: every pinned Python requirement exists on PyPI"
        run: |
          echo "## Python requirement pins" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if node scripts/ci/check-python-requirements-resolve.mjs scripts/requirements.txt 2>&1 | tee /tmp/pyreq.log; then
            tail -2 /tmp/pyreq.log >> $GITHUB_STEP_SUMMARY
          else
            tail -6 /tmp/pyreq.log >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # CHECK 23: data_audit_log writes name real columns (2026-09-06)
      # 27 scripts write that table. It has table_name, record_id, action,
      # old_data, new_data, scrape_proof, batch_id, agent_id, created_at - and
      # the scripts were sending `notes`, `records_affected`, `records_count`
      # and `tour_code`, while omitting record_id, which is NOT NULL.
      # PostgREST answers PGRST204 and TEN of the scripts catch it with a bare
      # `except: pass`, so the audit trail reported itself working while never
      # writing a row: of 1,092,446 rows, every one came from the trigger_auto
      # DB trigger or three one-off March agents. Not one from a scraper.
      # It only surfaced because one caller checks the row count and exits 1 -
      # Daily Poker Series Auto-Pilot, red after a fully successful scrape.
      # A RATCHET over the nine not yet migrated; the fix is always the same,
      # move what is not a column into new_data (jsonb).
      - name: "CHECK 23: data_audit_log writes use real columns"
        run: |
          echo "## data_audit_log column check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if node scripts/ci/check-audit-log-columns.mjs 2>&1 | tee /tmp/auditcols.log; then
            tail -2 /tmp/auditcols.log >> $GITHUB_STEP_SUMMARY
          else
            tail -8 /tmp/auditcols.log >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "CHECK 6: Cron governance (Open Claw migration)"
        run: |
          echo "Enforcing cron governance rules from CLAUDE.md section 11..."
          FAIL=0

          # 6a — vercel.json crons array size
          VERCEL_CRONS=$(node -e "const d=require('./vercel.json');console.log((d.crons||[]).length)")
          # 16 as of 2026-09-03 (vip-stipend left for Open Claw, which already scheduled it).
          MAX_VERCEL_CRONS=16
          echo "vercel.json crons count: $VERCEL_CRONS (max: $MAX_VERCEL_CRONS)"
          if [ "$VERCEL_CRONS" -gt "$MAX_VERCEL_CRONS" ]; then
            echo "::error::FATAL: vercel.json crons grew from $MAX_VERCEL_CRONS to $VERCEL_CRONS."
            echo "All new scheduled jobs must go to Open Claw (Hetzner), not Vercel."
            echo "Add the schedule to scripts/openclaw-cron-dispatcher.py and run bash scripts/deploy-openclaw.sh."
            echo "See CLAUDE.md section 11.2 for the full procedure."
            FAIL=1
          else
            echo "✓ vercel.json crons within cap"
          fi

          # 6b — pages/api/cron/ file count
          CRON_FILES=$(find pages/api/cron -maxdepth 1 -type f \( -name '*.js' -o -name '*.ts' \) 2>/dev/null | wc -l | tr -d ' ')
          MAX_CRON_FILES=45
          echo "pages/api/cron/ file count: $CRON_FILES (max: $MAX_CRON_FILES)"
          if [ "$CRON_FILES" -gt "$MAX_CRON_FILES" ]; then
            echo "::error::FATAL: pages/api/cron/ grew from $MAX_CRON_FILES to $CRON_FILES new files."
            echo "Until Phase 2B stands up the workers repo, no net-new cron handlers in the monolith."
            echo "If you must add one, shrink the baseline in the same PR (retire an existing cron)."
            FAIL=1
          else
            echo "✓ pages/api/cron/ within cap"
          fi

          # 6c — GitHub Actions schedule: triggers allowlist
          #
          # news-digest was a TIME-BOXED exception (CLAUDE.md §11.4) on the
          # grounds that its Open Claw replacement "cannot deploy (SSH failures
          # since 2026-05-17)".
          #
          # 2026-08-16 — that root cause is found and fixed. deploy-openclaw.sh
          # was hardcoded to $HOME/.ssh/openclaw_ed25519, a key that was never
          # created, so the script aborted at its own prereq check on every
          # invocation and no deploy had ever succeeded. The dispatcher then
          # crashed on start with ConflictingIdError, because
          # one path was registered three times and job ids were
          # derived from the path alone. Both fixed; dispatcher deployed with
          # 85 jobs and 0 errors, and it now registers
          #   /api/news/digest?days=7  [tue 14:00 UTC]
          #
          # The schedule: block is therefore removed from news-digest.yml and
          # this allowlist entry retires with it, exactly as §11.4 required.
          # Do not re-add either: Open Claw owns the digest now, and a second
          # scheduler at the same instant mails the subscriber list twice.
          ALLOWLIST="charity-scraper-v5 daily-scraper hendonmob-auto-sync jsonld-scraper poker-series-auto-pilot venue-scraper weekly-schedule-scraper stale vercel-uniqueness-check branch-protection-watchdog push-velocity-watchdog vercel-deploy-retry agent-autopilot publish-watchdog"
          SCHEDULED_WORKFLOWS=$(grep -rlE '^on:|schedule:' .github/workflows/*.yml 2>/dev/null | while read wf; do
            if grep -qE '^\s*-?\s*cron:' "$wf"; then
              basename "$wf" .yml
            fi
          done)

          for wf in $SCHEDULED_WORKFLOWS; do
            if ! echo " $ALLOWLIST " | grep -q " $wf "; then
              echo "::error::FATAL: Workflow '.github/workflows/${wf}.yml' has a schedule: trigger"
              echo "but is not on the CLAUDE.md section 11.4 allowlist."
              echo "Move the logic to pages/api/cron/ + Open Claw, OR add the workflow to the allowlist"
              echo "in BOTH CLAUDE.md §11.4 AND build-safety-gate.yml CHECK 6c in the same PR."
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "✓ All scheduled workflows are on the allowlist"
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          echo "✓ Cron governance check passed"


      - name: Report Check Duration
        if: always()
        run: |
          END=$(date +%s)
          ELAPSED=$(( END - ${{ steps.timer.outputs.start }} ))
          echo "## ⏱️ Safety Gate Duration: ${ELAPSED}s" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════
  # FAILURE NOTIFICATION — Auto-create GitHub Issue on pipeline failure
  # ═══════════════════════════════════════════════════════════════════
  notify-failure:
    name: Failure Notification
    needs: [safety-checks]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);

            const issues = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'ci-failure',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issues.data[0].number,
                body: `🔴 **Another CI failure** on commit \`${sha}\`\n\n[View run](${runUrl})`
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `🔴 Build Safety Gate Failed — ${new Date().toISOString().split('T')[0]}`,
                body: `## Build Safety Gate Failure\n\n**Commit:** \`${sha}\`\n**Run:** [View details](${runUrl})\n\nThis issue was auto-created by the CI pipeline. Close when resolved.`,
                labels: ['ci-failure']
              });
            }

  # ═══════════════════════════════════════════════════════════════════
  # TYPESCRIPT VALIDATION (Parallel Job)
  # ═══════════════════════════════════════════════════════════════════
  type-check:
    name: TypeScript Check
    # PULL REQUEST ONLY (2026-09-04). This ran again on every push to main -
    # on the squash commit of a pull request it had just passed - so every
    # merge queued a second full copy of this repo's thirteen workflows behind
    # the NEXT pull request's checks, on six runners. Measured on #1336: jobs
    # that ran in 0.2-2.1 minutes waited 8-14 minutes for a runner. The
    # ruleset enforces this check on the pull request; the merge commit is
    # the same tree. Club Arena made the same call on 2026-08-23.
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@smarter-poker'
          always-auth: true

      # THE 424-SECOND INSTALL (2026-09-04). This job is a REQUIRED check and
      # it was the slowest thing on every World Hub pull request: 7.9 minutes,
      # of which 424s was `npm ci` and 30s was the typecheck it exists to run -
      # and the typecheck is advisory (continue-on-error), so a required check
      # that cannot fail was costing seven minutes of critical path per merge.
      #
      # No workflow in this repo cached node_modules. `cache: npm` above keeps
      # only the tarballs; extracting 1,324 packages still happens every run,
      # on a runner shared with up to eleven others doing the same. The tree is
      # cached now, keyed on the lockfile and the Node line, and the install
      # is SKIPPED on a hit - `npm ci` deletes node_modules before installing,
      # so an unguarded install would throw the restored tree away (the Club
      # Arena CSS Beat job did exactly that until the same day).
      #
      # A lockfile change misses once, installs, and saves. Everything else
      # restores in about fifteen seconds.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-typecheck-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          # LOUD, NOT SILENT (2026-09-09). This was `npm ci ... 2>/dev/null ||`.
          # The redirect threw away the only evidence of WHY npm ci failed, so
          # the job fell through to a slower, non-deterministic `npm install`
          # and reported success either way. That is how the lockfile break
          # this fallback was written for went unnoticed long enough to be
          # described in a comment as current when it had already been fixed.
          # The fallback stays - it costs nothing when npm ci works, which it
          # now does - but it says so.
          npm ci --ignore-scripts || {
            echo "::warning::npm ci failed here - falling back to npm install, which is slower and not lockfile-deterministic. The error is above."
            npm install --ignore-scripts
          }

      - name: "CHECK: TypeScript compilation (advisory)"
        continue-on-error: true
        run: |
          echo "Running TypeScript check (advisory — does not block deploy)..."
          npx tsc --noEmit 2>&1 | grep "error TS" > /tmp/ts-errors.txt || true
          TS_ERRORS=$(wc -l < /tmp/ts-errors.txt | tr -d ' ')
          if [ "$TS_ERRORS" -gt 0 ]; then
            echo "::warning::TypeScript found $TS_ERRORS type error(s) — review recommended"
            head -20 /tmp/ts-errors.txt
          else
            echo "✓ TypeScript compilation passed — zero errors"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # VERCEL DEPLOY RETRY — Automatically re-triggers any Vercel deploy
  # that failed due to a transient GitHub HTTP 500 clone error.
  #
  # Pattern observed: GitHub occasionally returns HTTP 500 when Vercel
  # tries to clone the repo, causing deployments to fail within 8–90s
  # with "The git provider returned an HTTP 500 error." — even though the
  # code itself is perfectly valid.
  #
  # This job runs AFTER safety-checks on every push to main. It polls
  # the Vercel API for up to 5 minutes looking for any ERROR deployment
  # whose error message matches the GitHub-500 pattern. When found, it
  # immediately fires a new deployment for the same commit.
  # ═══════════════════════════════════════════════════════════════════
  vercel-deploy-retry:
    name: Vercel Deploy Retry (GitHub-500 guard)
    needs: [safety-checks]
    # `always()`, not `success()`: safety-checks runs on pull requests only
    # now (see its note), so on a push to main it is SKIPPED, and a job that
    # `needs` a skipped job is skipped too unless it says always(). This job
    # only polls the Vercel API for a GitHub-500 clone failure; it never
    # needed the checks' verdict, only their ordering.
    # Owner restoration policy: Vercel Git publishes directly; no automatic repair loop.
    if: ${{ false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Watch for GitHub-500 clone failures and auto-retry
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_SVD8r7AOPH065G3usBxVvrBc
          VERCEL_PROJECT_ID: prj_op66GkZyZcygXQKm76iyycfVFAQx
          VERCEL_REPO_ID: "1132365826"
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret not set — Vercel auto-retry is disabled."
            echo "Add VERCEL_TOKEN in repo Settings → Secrets and variables → Actions to activate."
            exit 0
          fi

          echo "Monitoring Vercel for GitHub-500 failures on commit ${COMMIT_SHA:0:7}..."
          echo "Will poll for up to 5 minutes (10 attempts × 30s)."

          RETRIED=false
          for ATTEMPT in $(seq 1 10); do
            sleep 30
            echo ""
            echo "--- Poll attempt $ATTEMPT/10 ---"

            # Fetch the 20 most recent deployments for hub-vanguard
            DEPLOYS=$(curl -s \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=20" \
              -H "Authorization: Bearer $VERCEL_TOKEN")

            # Find any deployment matching our commit SHA that is in ERROR state
            FAILED_ID=$(echo "$DEPLOYS" | node -e "
              let s=''; process.stdin.on('data',c=>s+=c);
              process.stdin.on('end',()=>{
                try {
                  const sha = process.env.COMMIT_SHA;
                  const ds = JSON.parse(s).deployments || [];
                  const failed = ds.find(d =>
                    d.state === 'ERROR' &&
                    d.meta && (d.meta.githubCommitSha === sha || (d.meta.githubCommitSha||'').startsWith(sha.substring(0,7)))
                  );
                  console.log(failed ? failed.uid : '');
                } catch(e) { console.log(''); }
              });
            " 2>/dev/null || true)

            if [ -z "$FAILED_ID" ]; then
              # Also check if there's already a READY or BUILDING deploy — success, bail early
              GOOD=$(echo "$DEPLOYS" | node -e "
                let s=''; process.stdin.on('data',c=>s+=c);
                process.stdin.on('end',()=>{
                  try {
                    const sha = process.env.COMMIT_SHA;
                    const ds = JSON.parse(s).deployments || [];
                    const ok = ds.find(d =>
                      (d.state === 'READY' || d.state === 'BUILDING' || d.state === 'QUEUED') &&
                      d.meta && (d.meta.githubCommitSha === sha || (d.meta.githubCommitSha||'').startsWith(sha.substring(0,7)))
                    );
                    console.log(ok ? ok.uid : '');
                  } catch(e) { console.log(''); }
                });
              " 2>/dev/null || true)
              if [ -n "$GOOD" ]; then
                echo "✓ Deployment already READY/BUILDING/QUEUED ($GOOD) — no retry needed."
                exit 0
              fi
              echo "  No matching ERROR deployment found yet, continuing to poll..."
              continue
            fi

            echo "::warning::Found failed deployment $FAILED_ID for commit ${COMMIT_SHA:0:7}"

            # Confirm the failure is GitHub-500 (not a real code error)
            BUILD_LOGS=$(curl -s \
              "https://api.vercel.com/v3/deployments/${FAILED_ID}/events?teamId=${VERCEL_TEAM_ID}&limit=50" \
              -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null || true)

            IS_GH500=$(echo "$BUILD_LOGS" | grep -c "HTTP 500" 2>/dev/null || echo "0")
            IS_PERM_CLONE=$(echo "$BUILD_LOGS" | grep -c "permanent problem cloning" 2>/dev/null || echo "0")

            if [ "$IS_GH500" -eq 0 ] && [ "$IS_PERM_CLONE" -eq 0 ]; then
              echo "::error::Deployment $FAILED_ID is in ERROR but NOT due to a GitHub-500 clone failure."
              echo "This is a real code error — NOT auto-retrying. Check the Vercel dashboard."
              exit 1
            fi

            echo "Confirmed GitHub-500 transient clone error. Firing retry deployment..."

            RETRY_RESP=$(curl -s -X POST \
              "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}&forceNew=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"hub-vanguard\",
                \"project\": \"hub-vanguard\",
                \"target\": \"production\",
                \"gitSource\": {
                  \"type\": \"github\",
                  \"repoId\": ${VERCEL_REPO_ID},
                  \"ref\": \"main\",
                  \"sha\": \"${COMMIT_SHA}\"
                }
              }")

            RETRY_ID=$(echo "$RETRY_RESP" | node -e "
              let s=''; process.stdin.on('data',c=>s+=c);
              process.stdin.on('end',()=>{
                try { const d=JSON.parse(s); console.log(d.id||''); }
                catch(e){ console.log(''); }
              });
            " 2>/dev/null || true)

            if [ -n "$RETRY_ID" ]; then
              echo "✅ Retry deployment triggered: $RETRY_ID"
              echo "   URL: https://vercel.com/smarter-poker/hub-vanguard/$RETRY_ID"
              RETRIED=true
              break
            else
              echo "::error::Failed to trigger retry deployment."
              echo "$RETRY_RESP"
              exit 1
            fi
          done

          if [ "$RETRIED" = false ]; then
            echo "No GitHub-500 failure detected within 5 minutes — deployment was healthy."
          fi
