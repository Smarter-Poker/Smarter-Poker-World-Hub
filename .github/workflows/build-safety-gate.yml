name: Build Safety Gate

# Runs on pushes to main and PRs targeting main — NOT all branches
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# CRITICAL FIX: Cancel older runs when a newer push arrives.
# This prevents a queue of 15 stale builds piling up when pushing rapidly.
# The LATEST push always wins — older ones are cancelled immediately.
# Vercel's own git integration handles the actual deploy (see vercel.json).
concurrency:
  group: safety-gate-${{ github.ref }}
  cancel-in-progress: true

# Permissions needed for safety checks + failure notification (issue creation)
# + packages: read for @smarter-poker/commander-shared from GitHub Packages
permissions:
  contents: read
  issues: write
  packages: read

jobs:
  safety-checks:
    name: Pre-Deploy Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Record Start Time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════
      # CHECK 7: Storage bucket file_size_limit guard (RUNS FIRST)
      # Positioned before npm install so it runs even if install fails.
      # The social-media bucket file_size_limit was silently set to NULL on
      # 2026-04-22 with a wrong comment claiming it meant "unlimited". NULL
      # falls back to the project-level cap (50MB by default), and every
      # video upload >50MB was rejected with HTTP 413. Project-level cap
      # was raised to 50GB on 2026-04-29 and all video buckets set to 50GB.
      # This check guards against silent revert by anyone clicking the
      # dashboard, by `supabase db reset` replaying migrations out of order,
      # or by a future PR that re-NULLs the value.
      #
      # Guards all 7 video-capable buckets (50GB tier) + catch-all NULL
      # guard across every bucket in the project.
      #
      # Requires GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY. If the
      # secret is not set the check warns but does not block — add the
      # secret in repo Settings → Secrets and variables → Actions to
      # activate enforcement.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 10: Diamond economy invariants"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # Standing assertions for the money paths. Each one corresponds to a
          # defect that has already happened once and was found only by a hand
          # audit: deduct_diamonds writing one balance column while credits
          # wrote two; award_diamonds_v2's VIP guard failing OPEN on NULL and
          # handing the VIP earning ceiling to 470 accounts; easter eggs
          # counting toward the daily cap so legendary payouts were clamped and
          # destroyed; a public view carrying write grants to anon so an
          # unauthenticated request could rewrite tournament prize pools; and
          # the balance RPCs being revoked from `authenticated` while the
          # browser kept calling them. The assertions live in SQL
          # (migration 20260808220000) so they read the live catalog.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — economy invariants are NOT enforced."
            exit 0
          fi
          node scripts/check-economy-invariants.mjs

      # ═══════════════════════════════════════════════════════════════
      # PHASE U4 — Supabase invariants as CI gates.
      #
      # BLOCKING as of 2026-08-12. They were introduced warn-only per plan step
      # U4.3 because both reported a real backlog; that backlog is now cleared
      # (phantom 3 -> 0, stranded 7 -> 0), so warn-only was removed the same
      # day rather than left to rot. A gate nobody has to obey is not a gate.
      #
      # Exceptions: scripts/ci/supabase-invariants.allowlist.json. Every entry
      # needs a reason, and both scripts FAIL if an entry starts resolving, so
      # the allowlist can only shrink.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 11: No phantom Supabase tables (U4.2)"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # Catches `.from('table_that_does_not_exist')`. Those do not throw at
          # build time and rarely at runtime either — PostgREST returns 42P01 in
          # the error channel and this repo's call sites almost always swallow
          # it into console.warn, so the write is discarded silently forever.
          #
          # Its first run found training_moves (every individual training move
          # the app recorded was being thrown away), plus xp_logs and
          # user_dna_profiles.
          #
          # Resolves the table list from the PostgREST schema document rather
          # than a direct Postgres connection, because SUPABASE_DB_PASSWORD in
          # this repo is stale and fails auth while the service key works.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — phantom-table check is NOT enforced."
            exit 0
          fi
          node scripts/ci/check-phantom-tables.mjs

      - name: "CHECK 13: No phantom Supabase COLUMNS"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # Column-level twin of CHECK 11. Motivating incident: cron telemetry
          # caught yt-pipeline-recovery failing EVERY 15-minute tick since it
          # shipped — it selected video_transcode_jobs.attempts and wrote
          # locked_at, neither of which existed. 42703 on a column behaves
          # exactly like 42P01 on a table: swallowed error, feature that
          # silently never works. CHECK 11 cannot see it (the table exists).
          #
          # First run found 187 phantom columns. Sample-verified 6/6 against
          # information_schema — zero false positives. The worst was
          # chip_escrow_holds in the poker engine's ChipBridge: written with
          # player_id/table_id/status 'locked' against a live table whose
          # columns are user_id/related_id and whose status CHECK forbids
          # 'locked' — so chip escrow tracking had NEVER written a row and
          # leave-club's "don't leave with locked chips" money guard was a
          # no-op. Fixed same day; backlog was 184.
          #
          # BLOCKING as of 2026-08-15. Introduced warn-only per the same
          # rollout doctrine as CHECKs 11/12 (a gate blocking on 184
          # pre-existing findings gets disabled, not fixed); the backlog was
          # burned to ZERO across four sweeps (187 -> 142 -> 110 -> 73 -> 0,
          # see .agent/audits/2026-08-15-check13-phantom-column-burndown.md),
          # so --warn-only was removed the same day the scanner first
          # reported clean.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — phantom-column check is NOT enforced."
            exit 0
          fi
          node scripts/ci/check-phantom-columns.mjs

      - name: "CHECK 12: No stranded Supabase tables (U4.1)"
        run: |
          # Catches a table that src/services READS but nothing ever WRITES.
          # That is not a crash — it renders an empty state forever, which is
          # indistinguishable from "no data yet" and is exactly why this class
          # of bug survives review. Pure static analysis; no DB access needed.
          node scripts/ci/check-stranded-writers.mjs

      - name: "CHECK 14: Vendor drift guard (CJS-under-ESM + override bypass)"
        run: |
          # Closes the vendoring-drift bug CLASS behind three separate prod
          # incidents in one week (Aug 2026), none of which threw or failed the
          # build — they shipped green and broke in production:
          #   A. CJS-under-ESM: vendor/commander-shared is "type":"module", so a
          #      file in it using module.exports/require() exports NOTHING at
          #      runtime and every named import of it resolves to undefined.
          #      (parseBlindStructure.js, home-games/rpcBridge.js)
          #   B. Override bypass: several src/ files are REAL local overrides
          #      fixing a bug in the vendored twin (apiRateLimit's spoofable IP
          #      parsing, the supabase client, authUtils). Importing the vendor
          #      path directly instead of the local override silently runs the
          #      UNFIXED code. (mock-supabase-client, forgeable-vendor-auth)
          # Pure static analysis; no DB access, no npm install.
          node scripts/check-vendor-drift.mjs

      - name: "CHECK 9: Reward catalog matches diamondRewards.js"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # award_diamonds_v2 reads public.diamond_reward_catalog, NOT
          # src/config/diamondRewards.js. On 2026-08-05 the two had drifted on
          # five fields and nothing in the repo compared them, so the drift was
          # invisible: easter eggs were being clamped to the daily cap with the
          # excess discarded (while the store page promised the opposite),
          # a once-ever 15 diamond bonus was repayable daily, and a 500 diamond
          # referral action had no periodic limit at all. This check is that
          # comparison. Dependency-free on purpose — this job does not npm install.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — reward catalog drift is NOT enforced."
            exit 0
          fi
          node scripts/check-reward-catalog-drift.mjs

      - name: "CHECK 7: Storage bucket file_size_limit guard (50GB minimum)"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — storage bucket cap is NOT enforced."
            echo "::warning::Add the secret in repo Settings -> Secrets and variables -> Actions to activate."
            exit 0
          fi

          MIN_LIMIT=53687091200    # 50GB in bytes
          PROJECT_REF="kuklfnapbkmacvwxktbh"
          # All 7 video-capable buckets from the 50GB tier
          BUCKETS="social-media live-recordings messenger_media user-media stories social-videos public-transfer"
          FAIL=0

          for BUCKET in $BUCKETS; do
            echo ""
            echo "Querying ${BUCKET} bucket configuration..."

            # Retry up to 3 times with backoff for Supabase API flakiness
            STATUS="000"
            for ATTEMPT in 1 2 3; do
              # bug-hunt-zero/B-SAFETY-1: curl exit code 28 (timeout) on a single
              # bucket query was bombing the entire step before the retry loop
              # could attempt to recover. The `|| true` makes curl's non-zero
              # exit tolerable, and the timeout is widened from 10s to 25s for
              # Supabase API slow-path tolerance. The retry loop still applies
              # for transient failures.
              RESP=$(curl -sS -w "\n%{http_code}" --max-time 25 \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                "https://${PROJECT_REF}.supabase.co/storage/v1/bucket/${BUCKET}" || true)
              BODY=$(echo "$RESP" | head -n -1)
              STATUS=$(echo "$RESP" | tail -n 1)
              [ "$STATUS" = "200" ] && break
              echo "  Attempt $ATTEMPT failed (HTTP $STATUS), retrying in 5s..."
              sleep 5
            done

            if [ "$STATUS" != "200" ]; then
              # HTTP 544 = Supabase DatabaseTimeout — transient infra issue, not a code bug.
              # Treat as a warning so transient DB outages don't block valid deploys.
              if [ "$STATUS" = "544" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
                echo "::warning::Supabase storage API timed out for ${BUCKET} (HTTP $STATUS) — skipping bucket check (transient)."
                echo "$BODY"
              else
                echo "::error::FATAL: Could not fetch ${BUCKET} bucket config after 3 attempts. HTTP $STATUS"
                echo "$BODY"
                FAIL=1
              fi
              continue
            fi

            LIMIT=$(echo "$BODY" | node -e "
              let s='';process.stdin.on('data',c=>s+=c);
              process.stdin.on('end',()=>{
                try { const j=JSON.parse(s); console.log(j.file_size_limit ?? 'null'); }
                catch(e){ console.log('parse_err'); }
              });")

            echo "Bucket '${BUCKET}' file_size_limit = ${LIMIT}"

            if [ "$LIMIT" = "null" ] || [ "$LIMIT" = "parse_err" ]; then
              echo "::error::FATAL: ${BUCKET} bucket file_size_limit is NULL — silently falls back to project-level cap."
              echo "::error::Fix: UPDATE storage.buckets SET file_size_limit = 53687091200 WHERE id = '${BUCKET}';"
              FAIL=1
              continue
            fi

            if [ "$LIMIT" -lt "$MIN_LIMIT" ]; then
              HUMAN_GB=$(( LIMIT / 1024 / 1024 / 1024 ))
              echo "::error::FATAL: ${BUCKET} bucket file_size_limit is ${HUMAN_GB}GB — below the 50GB minimum."
              echo "::error::Fix: UPDATE storage.buckets SET file_size_limit = 53687091200 WHERE id = '${BUCKET}';"
              FAIL=1
              continue
            fi

            echo "✓ ${BUCKET} bucket file_size_limit is at or above 50GB"
          done

          # Catch-all: no bucket in the project should EVER have NULL file_size_limit
          echo ""
          echo "Running catch-all NULL guard across all buckets..."
          # bug-hunt-zero/B-SAFETY-2: same fix as B-SAFETY-1 but for the
          # catch-all curl. When the Supabase storage API is slow, this curl
          # also exits 28 and set -e bombs the step. The `|| true` keeps the
          # step alive; the parse step below handles non-JSON gracefully via
          # the parse_err branch.
          ALL_RESP=$(curl -sS --max-time 25 \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            "https://${PROJECT_REF}.supabase.co/storage/v1/bucket" || true)

          NULL_BUCKETS=$(echo "$ALL_RESP" | node -e "
            let s='';process.stdin.on('data',c=>s+=c);
            process.stdin.on('end',()=>{
              try {
                const buckets=JSON.parse(s);
                const nulls=buckets.filter(b=>b.file_size_limit==null).map(b=>b.id);
                if(nulls.length) console.log(nulls.join(', '));
              } catch(e){ console.log('parse_err'); }
            });")

          if [ -n "$NULL_BUCKETS" ]; then
            echo "::error::FATAL: Buckets with NULL file_size_limit: ${NULL_BUCKETS}"
            echo "::error::NULL silently falls back to project-level cap. Set an explicit limit on each bucket."
            FAIL=1
          else
            echo "✓ No buckets have NULL file_size_limit"
          fi

          [ "$FAIL" -eq 0 ] || exit 1

      # ═══════════════════════════════════════════════════════════════
      # CHECK 1: No .single() calls (must use .maybeSingle())
      # .single() throws PGRST116 when 0 rows returned = crash
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 1: No .single() in Supabase queries"
        run: |
          echo "Scanning for .single() calls..."
          HITS=$(grep -rn '\.single()' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude='*.bak' \
            pages/ src/ lib/ services/ 2>/dev/null \
            | grep -v 'maybeSingle' \
            | grep -v '// .*single' || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found .single() calls that should be .maybeSingle():"
            echo "$HITS"
            echo ""
            echo "Fix: Replace .single() with .maybeSingle() in all Supabase queries"
            exit 1
          fi
          echo "✓ No .single() calls found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 1b: No .js file may import from an explicit .ts path
      # ═══════════════════════════════════════════════════════════════
      # Root cause of the May 2026 auth cascade:
      #   src/lib/authUtils.js contained `import { ... } from './authUtils.ts'`
      # Webpack/Next.js cannot resolve explicit .ts extension imports in .js
      # files, causing every symbol to resolve as undefined — silently breaking
      # 20+ pages with "Attempted import error: X is not exported from authUtils".
      # This check catches that pattern before it reaches Vercel.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 1b: No .js file imports from explicit .ts path"
        run: |
          echo "Scanning for .js files that import from .ts paths..."
          HITS=$(grep -rn "from ['\"].*\.ts['\"]" \
            --include='*.js' --include='*.jsx' \
            --exclude-dir=node_modules --exclude-dir=.next \
            pages/ src/ lib/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: .js file(s) importing from explicit .ts paths — webpack cannot resolve these."
            echo ""
            echo "$HITS"
            echo ""
            echo "Fix: Remove the .ts extension from the import path (use './authUtils' not './authUtils.ts')."
            echo "Why: Webpack resolves .js before .ts for extension-free imports, so the .js shim is always"
            echo "loaded. If that shim imports ./authUtils.ts with explicit extension, it silently resolves"
            echo "to nothing, making all exported symbols undefined — breaking every consumer page."
            exit 1
          fi
          echo "✓ No .js→.ts explicit extension imports found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 1c: All authUtils imports must resolve to actual exports
      # ═══════════════════════════════════════════════════════════════
      # Catches "Attempted import error: X is not exported from authUtils"
      # before the commit reaches Vercel. Scans all consumer files and
      # verifies each imported symbol exists in authUtils.js.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 1c: authUtils imports match actual exports"
        run: |
          AUTHUTILS="src/lib/authUtils.js"
          if [ ! -f "$AUTHUTILS" ]; then
            AUTHUTILS="src/lib/authUtils.ts"
          fi
          if [ ! -f "$AUTHUTILS" ]; then
            echo "::warning::authUtils not found at src/lib/authUtils.js or .ts — skipping"
            exit 0
          fi

          echo "Checking authUtils exports against consumer imports (source: $AUTHUTILS)..."

          # Extract all exported function/const names from the file
          # bug-hunt-zero/B-SAFETY-4: the previous regex only matched
          # `export function` and `export async function`. It missed
          # `export const`, `export let`, `export var`, and `export class`,
          # which made SUPABASE_URL / SUPABASE_ANON_KEY invisible to the
          # check even though they are real exports. Widened to cover all
          # named-export declaration forms.
          EXPORTS=$(grep -oE "^export (const|let|var|class|async function|function) [A-Za-z_][A-Za-z0-9_]+" "$AUTHUTILS" \
            | grep -oE "[A-Za-z_][A-Za-z0-9_]+$" | sort -u)
          EXPORT_BLOCK=$(grep -oE "^export \{[^}]+\}" "$AUTHUTILS" | grep -oE "[A-Za-z_][A-Za-z0-9_]+" || true)
          ALL_EXPORTS=$(echo -e "$EXPORTS\n$EXPORT_BLOCK" | sort -u)

          echo "Exports found in $AUTHUTILS:"
          echo "$ALL_EXPORTS" | tr '\n' ' '
          echo ""
          echo ""

          ERRORS=0
          while IFS= read -r file; do
            # Find imports from authUtils in this file
            # bug-hunt-zero/B-SAFETY-3: the previous regex extracted identifiers
            # from the WHOLE import line including the file path, treating path
            # segments like 'src', 'lib', 'authUtils' as imported symbols. Now
            # we extract ONLY what's inside the {} braces.
            IMPORTS=$(grep -oE "import \{[^}]+\} from ['\"][^'\"]*authUtils['\"]" "$file" 2>/dev/null \
              | grep -oE "\{[^}]+\}" \
              | tr -d '{}' | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | grep -E "^[A-Za-z_][A-Za-z0-9_]+$" \
              | sort -u || true)

            for sym in $IMPORTS; do
              if ! echo "$ALL_EXPORTS" | grep -qx "$sym"; then
                echo "::error file=${file}::Symbol '${sym}' is imported from authUtils but NOT exported by $AUTHUTILS"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done < <(find pages/ src/ -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \
            | grep -v node_modules | grep -v .next | grep -v authUtils)

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "::error::$ERRORS symbol(s) imported from authUtils that don't exist as exports."
            echo "Fix: Either add the missing export to authUtils.js, or remove the import."
            exit 1
          fi
          echo "✓ All authUtils imports resolve to actual exports"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 2: No unused hook imports (the ThreePillHeader bug)

      # Imported but uncalled hooks = ReferenceError during SSG
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 2: No unused React hook imports"
        run: |
          echo "Scanning for unused hook imports..."
          ERRORS=0
          for file in $(find pages/ src/ -name '*.js' -o -name '*.jsx' -o -name '*.tsx' | grep -v node_modules | grep -v .next); do
            HOOKS=$(grep -oE 'import\s+\{[^}]*\}' "$file" 2>/dev/null | grep -oE 'use[A-Z][a-zA-Z]+' | sort -u)
            for hook in $HOOKS; do
              CALL_COUNT=$(grep -cE "${hook}\s*[<(]" "$file" 2>/dev/null || echo 0)
              if [ "$CALL_COUNT" -eq 0 ]; then
                echo "::error file=${file}::Hook '${hook}' is imported but NEVER CALLED"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::FATAL: $ERRORS unused hook import(s) found. These WILL crash the build."
            exit 1
          fi
          echo "✓ All imported hooks are called"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 3: No dynamic Supabase imports bypassing patched client
      # Must use src/lib/supabaseServerClient, never raw import
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 3: No raw Supabase imports in API routes"
        run: |
          echo "Scanning for unpatched Supabase client usage..."
          HITS=$(grep -rn "await import.*@supabase/supabase-js" \
            --include='*.js' --include='*.ts' \
            pages/api/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found dynamic @supabase/supabase-js imports bypassing patched server client:"
            echo "$HITS"
            echo ""
            echo "Fix: Use 'import { createClient } from \"src/lib/supabaseServerClient\"' instead"
            exit 1
          fi
          echo "✓ All API routes use patched Supabase client"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 4: No merge conflict markers in source files
      # These cause immediate syntax errors and broken builds
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 4: No merge conflict markers"
        run: |
          echo "Scanning for git merge conflict markers..."
          # NOTE: match ANYWHERE on a line — stash pop can produce markers
          # indented inside JSDoc comments, not just at column 0.
          # deploy-autofix.js is excluded because it legitimately references
          # these strings for its own conflict detection logic.
          HITS=$(grep -rn '<<<<<<< \|>>>>>>>' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.next \
            --exclude='deploy-autofix.js' \
            src/ pages/ data/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found git merge conflict markers in source files:"
            echo "$HITS"
            exit 1
          fi
          echo "✓ No merge conflict markers found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 8: Auth-critical files exist on disk
      # Single source of truth: __tests__/auth-routes-exist.test.mjs
      # See docs/runbooks/07-auth-outage.md for the 2026-05-02 incident
      # that motivated this guard (every signup 404'd because
      # pages/auth/callback.js had been silently deleted).
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 8: Auth-critical files exist"
        run: |
          if [ ! -f __tests__/auth-routes-exist.test.mjs ]; then
            echo "::error::__tests__/auth-routes-exist.test.mjs is missing — the guard itself was deleted."
            exit 1
          fi
          node --test \
            __tests__/_test-guards-exist.test.mjs \
            __tests__/auth-routes-exist.test.mjs \
            __tests__/signup-hardening.test.mjs \
            __tests__/build-2-deliverables.test.mjs \
            __tests__/sentry-coverage.test.mjs \
            __tests__/phase-3-deliverables.test.mjs \
            __tests__/phase-4-deliverables.test.mjs \
            __tests__/scroll-lock.test.mjs

      # ═══════════════════════════════════════════════════════════════
      # CHECK 6: Cron governance — enforce CLAUDE.md section 11
      # All new scheduled jobs must go to Open Claw on Hetzner, not Vercel.
      # Allowed baselines (caps at the numbers captured 2026-04-24):
      #   - vercel.json crons array  ≤ 40
      #   - pages/api/cron/ file count ≤ 45
      #   - GitHub Actions schedule: triggers only on the allowlist below
      # Shrinking these is fine (job retirement). Growing them is blocked.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 6: Cron governance (Open Claw migration)"
        run: |
          echo "Enforcing cron governance rules from CLAUDE.md section 11..."
          FAIL=0

          # 6a — vercel.json crons array size
          VERCEL_CRONS=$(node -e "const d=require('./vercel.json');console.log((d.crons||[]).length)")
          MAX_VERCEL_CRONS=40
          echo "vercel.json crons count: $VERCEL_CRONS (max: $MAX_VERCEL_CRONS)"
          if [ "$VERCEL_CRONS" -gt "$MAX_VERCEL_CRONS" ]; then
            echo "::error::FATAL: vercel.json crons grew from $MAX_VERCEL_CRONS to $VERCEL_CRONS."
            echo "All new scheduled jobs must go to Open Claw (Hetzner), not Vercel."
            echo "Add the schedule to scripts/openclaw-cron-dispatcher.py and run bash scripts/deploy-openclaw.sh."
            echo "See CLAUDE.md section 11.2 for the full procedure."
            FAIL=1
          else
            echo "✓ vercel.json crons within cap"
          fi

          # 6b — pages/api/cron/ file count
          CRON_FILES=$(find pages/api/cron -maxdepth 1 -type f \( -name '*.js' -o -name '*.ts' \) 2>/dev/null | wc -l | tr -d ' ')
          MAX_CRON_FILES=45
          echo "pages/api/cron/ file count: $CRON_FILES (max: $MAX_CRON_FILES)"
          if [ "$CRON_FILES" -gt "$MAX_CRON_FILES" ]; then
            echo "::error::FATAL: pages/api/cron/ grew from $MAX_CRON_FILES to $CRON_FILES new files."
            echo "Until Phase 2B stands up the workers repo, no net-new cron handlers in the monolith."
            echo "If you must add one, shrink the baseline in the same PR (retire an existing cron)."
            FAIL=1
          else
            echo "✓ pages/api/cron/ within cap"
          fi

          # 6c — GitHub Actions schedule: triggers allowlist
          #
          # news-digest was a TIME-BOXED exception (CLAUDE.md §11.4) on the
          # grounds that its Open Claw replacement "cannot deploy (SSH failures
          # since 2026-05-17)".
          #
          # 2026-08-16 — that root cause is found and fixed. deploy-openclaw.sh
          # was hardcoded to $HOME/.ssh/openclaw_ed25519, a key that was never
          # created, so the script aborted at its own prereq check on every
          # invocation and no deploy had ever succeeded. The dispatcher then
          # crashed on start with ConflictingIdError, because
          # mlb-analytics-noon is registered three times and job ids were
          # derived from the path alone. Both fixed; dispatcher deployed with
          # 85 jobs and 0 errors, and it now registers
          #   /api/news/digest?days=7  [tue 14:00 UTC]
          #
          # The schedule: block is therefore removed from news-digest.yml and
          # this allowlist entry retires with it, exactly as §11.4 required.
          # Do not re-add either: Open Claw owns the digest now, and a second
          # scheduler at the same instant mails the subscriber list twice.
          ALLOWLIST="charity-scraper-v5 daily-scraper hendonmob-auto-sync jsonld-scraper poker-series-auto-pilot venue-scraper weekly-schedule-scraper stale club-arena-scheduled-deploy vercel-uniqueness-check branch-protection-watchdog push-velocity-watchdog vercel-deploy-retry"
          SCHEDULED_WORKFLOWS=$(grep -rlE '^on:|schedule:' .github/workflows/*.yml 2>/dev/null | while read wf; do
            if grep -qE '^\s*-?\s*cron:' "$wf"; then
              basename "$wf" .yml
            fi
          done)

          for wf in $SCHEDULED_WORKFLOWS; do
            if ! echo " $ALLOWLIST " | grep -q " $wf "; then
              echo "::error::FATAL: Workflow '.github/workflows/${wf}.yml' has a schedule: trigger"
              echo "but is not on the CLAUDE.md section 11.4 allowlist."
              echo "Move the logic to pages/api/cron/ + Open Claw, OR add the workflow to the allowlist"
              echo "in BOTH CLAUDE.md §11.4 AND build-safety-gate.yml CHECK 6c in the same PR."
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "✓ All scheduled workflows are on the allowlist"
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          echo "✓ Cron governance check passed"


      - name: Report Check Duration
        if: always()
        run: |
          END=$(date +%s)
          ELAPSED=$(( END - ${{ steps.timer.outputs.start }} ))
          echo "## ⏱️ Safety Gate Duration: ${ELAPSED}s" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════
  # FAILURE NOTIFICATION — Auto-create GitHub Issue on pipeline failure
  # ═══════════════════════════════════════════════════════════════════
  notify-failure:
    name: Failure Notification
    needs: [safety-checks]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);

            const issues = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'ci-failure',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issues.data[0].number,
                body: `🔴 **Another CI failure** on commit \`${sha}\`\n\n[View run](${runUrl})`
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `🔴 Build Safety Gate Failed — ${new Date().toISOString().split('T')[0]}`,
                body: `## Build Safety Gate Failure\n\n**Commit:** \`${sha}\`\n**Run:** [View details](${runUrl})\n\nThis issue was auto-created by the CI pipeline. Close when resolved.`,
                labels: ['ci-failure']
              });
            }

  # ═══════════════════════════════════════════════════════════════════
  # TYPESCRIPT VALIDATION (Parallel Job)
  # ═══════════════════════════════════════════════════════════════════
  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@smarter-poker'
          always-auth: true

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          npm ci --ignore-scripts 2>/dev/null || {
            npm install --ignore-scripts
          }

      - name: "CHECK: TypeScript compilation (advisory)"
        continue-on-error: true
        run: |
          echo "Running TypeScript check (advisory — does not block deploy)..."
          npx tsc --noEmit 2>&1 | grep "error TS" > /tmp/ts-errors.txt || true
          TS_ERRORS=$(wc -l < /tmp/ts-errors.txt | tr -d ' ')
          if [ "$TS_ERRORS" -gt 0 ]; then
            echo "::warning::TypeScript found $TS_ERRORS type error(s) — review recommended"
            head -20 /tmp/ts-errors.txt
          else
            echo "✓ TypeScript compilation passed — zero errors"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # VERCEL DEPLOY RETRY — Automatically re-triggers any Vercel deploy
  # that failed due to a transient GitHub HTTP 500 clone error.
  #
  # Pattern observed: GitHub occasionally returns HTTP 500 when Vercel
  # tries to clone the repo, causing deployments to fail within 8–90s
  # with "The git provider returned an HTTP 500 error." — even though the
  # code itself is perfectly valid.
  #
  # This job runs AFTER safety-checks on every push to main. It polls
  # the Vercel API for up to 5 minutes looking for any ERROR deployment
  # whose error message matches the GitHub-500 pattern. When found, it
  # immediately fires a new deployment for the same commit.
  # ═══════════════════════════════════════════════════════════════════
  vercel-deploy-retry:
    name: Vercel Deploy Retry (GitHub-500 guard)
    needs: [safety-checks]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Watch for GitHub-500 clone failures and auto-retry
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_SVD8r7AOPH065G3usBxVvrBc
          VERCEL_PROJECT_ID: prj_op66GkZyZcygXQKm76iyycfVFAQx
          VERCEL_REPO_ID: "1132365826"
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret not set — Vercel auto-retry is disabled."
            echo "Add VERCEL_TOKEN in repo Settings → Secrets and variables → Actions to activate."
            exit 0
          fi

          echo "Monitoring Vercel for GitHub-500 failures on commit ${COMMIT_SHA:0:7}..."
          echo "Will poll for up to 5 minutes (10 attempts × 30s)."

          RETRIED=false
          for ATTEMPT in $(seq 1 10); do
            sleep 30
            echo ""
            echo "--- Poll attempt $ATTEMPT/10 ---"

            # Fetch the 20 most recent deployments for hub-vanguard
            DEPLOYS=$(curl -s \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=20" \
              -H "Authorization: Bearer $VERCEL_TOKEN")

            # Find any deployment matching our commit SHA that is in ERROR state
            FAILED_ID=$(echo "$DEPLOYS" | node -e "
              let s=''; process.stdin.on('data',c=>s+=c);
              process.stdin.on('end',()=>{
                try {
                  const sha = process.env.COMMIT_SHA;
                  const ds = JSON.parse(s).deployments || [];
                  const failed = ds.find(d =>
                    d.state === 'ERROR' &&
                    d.meta && (d.meta.githubCommitSha === sha || (d.meta.githubCommitSha||'').startsWith(sha.substring(0,7)))
                  );
                  console.log(failed ? failed.uid : '');
                } catch(e) { console.log(''); }
              });
            " 2>/dev/null || true)

            if [ -z "$FAILED_ID" ]; then
              # Also check if there's already a READY or BUILDING deploy — success, bail early
              GOOD=$(echo "$DEPLOYS" | node -e "
                let s=''; process.stdin.on('data',c=>s+=c);
                process.stdin.on('end',()=>{
                  try {
                    const sha = process.env.COMMIT_SHA;
                    const ds = JSON.parse(s).deployments || [];
                    const ok = ds.find(d =>
                      (d.state === 'READY' || d.state === 'BUILDING' || d.state === 'QUEUED') &&
                      d.meta && (d.meta.githubCommitSha === sha || (d.meta.githubCommitSha||'').startsWith(sha.substring(0,7)))
                    );
                    console.log(ok ? ok.uid : '');
                  } catch(e) { console.log(''); }
                });
              " 2>/dev/null || true)
              if [ -n "$GOOD" ]; then
                echo "✓ Deployment already READY/BUILDING/QUEUED ($GOOD) — no retry needed."
                exit 0
              fi
              echo "  No matching ERROR deployment found yet, continuing to poll..."
              continue
            fi

            echo "::warning::Found failed deployment $FAILED_ID for commit ${COMMIT_SHA:0:7}"

            # Confirm the failure is GitHub-500 (not a real code error)
            BUILD_LOGS=$(curl -s \
              "https://api.vercel.com/v3/deployments/${FAILED_ID}/events?teamId=${VERCEL_TEAM_ID}&limit=50" \
              -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null || true)

            IS_GH500=$(echo "$BUILD_LOGS" | grep -c "HTTP 500" 2>/dev/null || echo "0")
            IS_PERM_CLONE=$(echo "$BUILD_LOGS" | grep -c "permanent problem cloning" 2>/dev/null || echo "0")

            if [ "$IS_GH500" -eq 0 ] && [ "$IS_PERM_CLONE" -eq 0 ]; then
              echo "::error::Deployment $FAILED_ID is in ERROR but NOT due to a GitHub-500 clone failure."
              echo "This is a real code error — NOT auto-retrying. Check the Vercel dashboard."
              exit 1
            fi

            echo "Confirmed GitHub-500 transient clone error. Firing retry deployment..."

            RETRY_RESP=$(curl -s -X POST \
              "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}&forceNew=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"hub-vanguard\",
                \"project\": \"hub-vanguard\",
                \"target\": \"production\",
                \"gitSource\": {
                  \"type\": \"github\",
                  \"repoId\": ${VERCEL_REPO_ID},
                  \"ref\": \"main\",
                  \"sha\": \"${COMMIT_SHA}\"
                }
              }")

            RETRY_ID=$(echo "$RETRY_RESP" | node -e "
              let s=''; process.stdin.on('data',c=>s+=c);
              process.stdin.on('end',()=>{
                try { const d=JSON.parse(s); console.log(d.id||''); }
                catch(e){ console.log(''); }
              });
            " 2>/dev/null || true)

            if [ -n "$RETRY_ID" ]; then
              echo "✅ Retry deployment triggered: $RETRY_ID"
              echo "   URL: https://vercel.com/smarter-poker/hub-vanguard/$RETRY_ID"
              RETRIED=true
              break
            else
              echo "::error::Failed to trigger retry deployment."
              echo "$RETRY_RESP"
              exit 1
            fi
          done

          if [ "$RETRIED" = false ]; then
            echo "No GitHub-500 failure detected within 5 minutes — deployment was healthy."
          fi
