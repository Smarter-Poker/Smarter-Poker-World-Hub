# RUNNER (2026-09-03): `vars.CI_RUNNER` routes this and eight other World Hub
# workflows to the estate's Hetzner runners the moment the repository variable is
# set (Club Arena uses `estate-linux`). Unset, every job is exactly
# `ubuntu-latest` as before. Measured 2026-09-02: E2E Tests, Global Footer E2E,
# this gate and Supabase Invariants were ~75% of World Hub's hosted minutes
# ($53 on Sept 1, $10 on Sept 2). Playwright installs skip `--with-deps` on a
# self-hosted runner, where the browser deps are installed once on the box.
name: Build Safety Gate

# Runs on pushes to main and PRs targeting main — NOT all branches
on:
  push:
    branches: ['main']
    # COST: every Club Arena merge rsyncs a compiled bundle into this repo and
    # pushes it to main. On 2026-08-22 that happened 76 times, and each one woke
    # nine workflows here that have nothing to say about minified output — 947
    # runs in Club Arena produced 950 in World Hub. GitHub bills per JOB rounded
    # up to a whole minute, so a 20-second guard costs a full minute.
    #
    # ONLY the `push` trigger is filtered. Never add paths-ignore to
    # `pull_request`: a PR touching only these paths would then never report
    # this context, and a required check that never reports is a pull request
    # that never merges.
    # Skipped here because its checks are all about source. This is the expensive one — four jobs including tsc and a dozen node scripts.
    paths-ignore:
  pull_request:
    branches: ['main']

# CRITICAL FIX: Cancel older runs when a newer push arrives.
# This prevents a queue of 15 stale builds piling up when pushing rapidly.
# The LATEST push always wins — older ones are cancelled immediately.
# Vercel's own git integration handles the actual deploy (see vercel.json).
concurrency:
  group: safety-gate-${{ github.ref }}
  cancel-in-progress: true

# Permissions needed for safety checks + failure notification (issue creation)
# + packages: read for @smarter-poker/commander-shared from GitHub Packages
permissions:
  contents: read
  issues: write
  packages: read

jobs:
  safety-checks:
    name: Pre-Deploy Safety Checks
    # PULL REQUEST ONLY (2026-09-04). This ran again on every push to main -
    # on the squash commit of a pull request it had just passed - so every
    # merge queued a second full copy of this repo's thirteen workflows behind
    # the NEXT pull request's checks, on six runners. Measured on #1336: jobs
    # that ran in 0.2-2.1 minutes waited 8-14 minutes for a runner. The
    # ruleset enforces this check on the pull request; the merge commit is
    # the same tree. Club Arena made the same call on 2026-08-23.
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # CHECK 17 diffs this branch against its base to find the migrations
          # it ADDS. A shallow clone cannot do that, and that script exits 2
          # rather than skipping - a gate that reports success for a check it
          # never ran is the thing this whole file exists to prevent.
          fetch-depth: 0

      - name: Record Start Time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      # CHECK 24: Training server authority is a release invariant. These
      # contracts must run inside this required ruleset context; package/Vercel
      # build coverage alone cannot block a PR because the broad PR E2E job is
      # intentionally disabled. Several authority tests parse and transform
      # source through Babel, so a clean checkout must restore the lockfile-
      # exact dependency tree before this check runs.
      - name: Setup Node.js For Training Authority
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@smarter-poker'
          always-auth: true

      - name: Agent policy integrity and delivery scenarios
        run: |
          node docs/agent-policy/agent-policy.mjs check
          node --test docs/agent-policy/agent-policy.test.mjs

      - name: Restore node_modules For Training Authority
        id: training-authority-nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-training-authority-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies For Training Authority
        if: steps.training-authority-nm-cache.outputs.cache-hit != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Operational Alert Delivery Contracts
        run: node --test __tests__/deploy-autofix-inbox.test.mjs __tests__/engine-alert-receipts.test.mjs __tests__/deploy-monitor-inbox.test.mjs __tests__/alertmanager-page.test.mjs __tests__/operational-alert-inbox.test.mjs __tests__/openclaw-critical-jobs.test.mjs __tests__/operational-notification-destination.test.mjs __tests__/operational-push-routing.test.mjs __tests__/operational-push-metadata.test.mjs __tests__/notifications-send-operational-persistence.test.mjs

      - name: Local Scraper Runtime Integrity And Delivery
        run: python3 -m unittest scripts/test_local_scraper_runtime.py -v

      - name: Messenger Club And Invoice Separation
        run: >-
          node --test
          __tests__/messenger-workspace.test.mjs
          __tests__/messenger-accounting-ui.test.mjs
          __tests__/messenger-conversation-link.test.mjs
          __tests__/messenger-search-lifecycle.test.mjs
          __tests__/cashier-accounting-display.test.mjs
          __tests__/cashout-v2-bridge.test.mjs
          __tests__/correction-accounting-display.test.mjs
          __tests__/credit-change-accounting-display.test.mjs

      - name: Accounting Push Receipt And Ownership Contracts
        run: >-
          node --test
          __tests__/accounting-push-delivery.test.mjs
          __tests__/accounting-push-privacy.test.mjs
          __tests__/push-invoice-routing.test.mjs
          __tests__/push-subscription-ownership.test.mjs
          __tests__/push-rotation-ownership.test.mjs
          __tests__/push-health-snapshot.test.mjs
          __tests__/zombie-endpoint-retirement.test.mjs

      - name: "CHECK 24: Training server-authority contracts"
        run: npm run test:training:phase6-authority

      # The behavioral migration verifiers exercise disposable PostgreSQL 17
      # clusters. Ubuntu 24.04 ships PostgreSQL 16, which cannot model the PG17
      # MAINTAIN privilege enforced in production. Both GitHub-hosted and the
      # estate-linux self-hosted runners therefore install the exact official
      # PGDG package. apt is idempotent, and the next step independently rejects
      # a missing/wrong major or production-incompatible locale.
      - name: Install PostgreSQL 17 For Training Authority On Linux Runners
        if: runner.os == 'Linux'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17 locales
          sudo locale-gen en_US.UTF-8

      - name: Resolve Exact PostgreSQL 17 Training Test Binaries
        shell: bash
        run: |
          postgres_bin=''
          candidates=(
            "${PHASE6_POSTGRES_BIN:-}"
            /usr/lib/postgresql/17/bin
            /opt/homebrew/opt/postgresql@17/bin
            /usr/local/opt/postgresql@17/bin
            /usr/local/pgsql/bin
          )
          if command -v pg_config >/dev/null 2>&1; then
            candidates+=("$(pg_config --bindir)")
          fi
          for candidate in "${candidates[@]}"; do
            [ -n "$candidate" ] || continue
            [ -x "$candidate/postgres" ] || continue
            [ -x "$candidate/initdb" ] || continue
            [ -x "$candidate/pg_ctl" ] || continue
            [ -x "$candidate/psql" ] || continue
            version="$($candidate/postgres --version)"
            [[ "$version" == *" 17."* ]] || continue
            postgres_bin="$candidate"
            break
          done
          if [ -z "$postgres_bin" ]; then
            echo "::error::CHECK 24C requires exact PostgreSQL 17 server binaries. Provision the self-hosted runner or repair the hosted PGDG install."
            exit 1
          fi
          if ! locale -a | grep -Eiq '^en_US\.(UTF-8|utf8)$'; then
            echo "::error::CHECK 24C requires en_US.UTF-8 so disposable PG17 clusters match production collation. Provision this locale on the runner."
            exit 1
          fi
          echo "PHASE6_POSTGRES_BIN=$postgres_bin" >> "$GITHUB_ENV"
          echo "AWARD_V2_POSTGRES_BIN=$postgres_bin" >> "$GITHUB_ENV"
          "$postgres_bin/postgres" --version

      - name: "CHECK 24C: Training PostgreSQL 17 Behavioral Authority"
        run: npm run audit:training:phase6-db

      - name: Engine Alert Receipt PostgreSQL Contracts
        run: node --test __tests__/engine-alert-receipts-postgres.test.mjs
      - name: One Reaction Invokes One Notification Handler
        run: PG_BIN="$PHASE6_POSTGRES_BIN" python3 scripts/ci/test-reaction-notification-postgres.py

      - name: Owner Operational Notification PostgreSQL Contracts
        id: owner_notification_postgres
        run: |
          python3 -m unittest discover -s scripts/ci -p test_owner_operational_notification_postgres.py
          PG_BIN="$PHASE6_POSTGRES_BIN" python3 scripts/ci/test-owner-operational-notification-postgres.py

      - name: Retain Owner Notification PostgreSQL Evidence
        if: always() && steps.owner_notification_postgres.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: owner-notification-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/owner-operational-notification/
          retention-days: 7
          if-no-files-found: warn


      - name: "CHECK 24B: Lint inventory deletion contract"
        run: node --test __tests__/lint-inventory-deletion-contract.test.mjs

      # ═══════════════════════════════════════════════════════════════
      # CHECK 15: Commit author identity (Vercel BLOCKED-deploy guard)
      #
      # Vercel refuses to build a commit whose GitHub author it cannot
      # resolve to a user account. Such a deployment enters state BLOCKED:
      # the build never starts, so there are NO build logs and nothing in
      # this workflow's other checks can see it. The only visible symptom
      # is a red "Blocked" row in the Vercel dashboard, which is easy to
      # miss for hours.
      #
      # 2026-08-19 incident: five production deployments were BLOCKED in
      # one afternoon. Every one of them was authored
      #   Claude (Cowork) <...@gmail.com>
      # and carried NO githubCommitAuthorLogin in its metadata. Every
      # deployment that went READY that day was authored either by the
      # noreply alias or by github-actions[bot]. One of the blocked
      # commits (e0405913, shop admin unification) sat unbuilt on main
      # until an unrelated later commit happened to sweep it up.
      #
      # `author.username` is populated by GitHub only when it can map the
      # commit author to a real account — it is exactly the signal Vercel
      # keys on, so testing it here predicts the block before anyone has
      # to notice it in the dashboard.
      #
      # This is RULE 3 in .agent/CLAUDE_AGENT_RULES.md. scripts/git-safe-push.sh
      # already auto-corrects user.email, so a commit reaching this check
      # with a bad identity came in through a path that bypassed it
      # (typically the GitHub API/MCP, which authors as the token owner).
      #
      # Fix for a flagged commit — re-author and force-push, e.g.:
      #   git commit --amend --author="Smarter-Poker \
      #     <254329056+Smarter-Poker@users.noreply.github.com>"
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 15: Commit author resolves to a GitHub user"
        if: github.event_name == 'push'
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          echo "Verifying commit author identity on pushed commits..."

          # No commits in payload (e.g. a tag or branch-create push) — nothing to check
          COUNT=$(echo "$COMMITS_JSON" | jq 'length')
          if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
            echo "✓ No commits in push payload — nothing to verify"
            exit 0
          fi

          # A commit GitHub cannot attribute has an empty/absent author.username.
          # That is the precise condition that makes Vercel mark the deployment
          # BLOCKED, so it is what we test rather than guessing at emails.
          UNRESOLVED=$(echo "$COMMITS_JSON" | jq -r '
            .[]
            | select((.author.username // "") == "")
            | "  \(.id[0:9])  \(.author.name // "?") <\(.author.email // "?")>\n      \((.message // "") | split("\n")[0])"
          ')

          # RULE 3: never commit from a personal mailbox. Kept as a separate,
          # narrower signal so the failure message can name the actual rule.
          PERSONAL=$(echo "$COMMITS_JSON" | jq -r '
            .[]
            | select((.author.email // "") | test("@(gmail|yahoo|hotmail|outlook|icloud|proton(mail)?)\\."; "i"))
            | "  \(.id[0:9])  \(.author.email)"
          ')

          FAILED=0

          if [ -n "$UNRESOLVED" ]; then
            echo "::error::FATAL: commit author does not resolve to a GitHub user."
            echo "Vercel will mark the resulting production deployment BLOCKED and never build it:"
            echo "$UNRESOLVED"
            FAILED=1
          fi

          if [ -n "$PERSONAL" ]; then
            echo "::error::RULE 3 violation: commit authored from a personal email address:"
            echo "$PERSONAL"
            FAILED=1
          fi

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "Required identity for this repo:"
            echo "  Smarter-Poker <254329056+Smarter-Poker@users.noreply.github.com>"
            echo "  (github-actions[bot] is also accepted, for CI-authored commits)"
            echo ""
            echo "Re-author the commit above and force-push, then the deployment will build."
            echo "See .agent/CLAUDE_AGENT_RULES.md RULE 3 and ~/Documents/AUTHOR_IDENTITY.md"
            exit 1
          fi

          echo "✓ All $COUNT pushed commit(s) resolve to a GitHub user"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 16: Recent-work clobber warning (advisory)
      #
      # Catches the failure mode where an agent edits a STALE copy of a file
      # and pushes the whole thing, silently reverting someone else's
      # concurrent work. Nothing else sees this: the result compiles, the
      # tests pass (the reverted feature usually has no test of its own), and
      # the diff just looks like an intentional rewrite.
      #
      # 2026-08-19 incident: commit 714738896 (Club Arena) removed 102 lines
      # from DynamicWallet.tsx, reverting union ledger rows and the
      # union-first BBJ resolver that had landed hours earlier. Had it
      # shipped, every union club would have shown a 0.00 Bad Beat Jackpot
      # while the real balance sat in the union pool. A human reading the
      # file caught it; CI did not.
      #
      # Heuristic, tuned against 60 real commits of history:
      #   removed >= 25 lines
      #   AND added < 75% of removed        (a rewrite adds comparable lines)
      #   AND the file was last touched < 24h earlier
      # That combination flags the known clobber. It also flags legitimate
      # large deletions at roughly a 7% rate, which is why this is ADVISORY:
      # a blocking gate at that rate would just train everyone to bypass it.
      #
      # NOTE: comparing commit AUTHORS does not work here — every agent on
      # the build machine commits as the same identity, so the clobberer and
      # the clobbered are indistinguishable by author.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 16: Recent-work clobber warning"
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base for this push - skipping"; exit 0
          fi
          git fetch --no-tags --quiet origin "$BEFORE_SHA" 2>/dev/null || true
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit not fetchable - skipping"; exit 0
          fi

          CT=$(git log -1 --format=%ct "$AFTER_SHA")
          FLAGGED=""
          while IFS="$(printf '\t')" read -r ADDED REMOVED FILE; do
            [ -z "$FILE" ] && continue
            case "$FILE" in *.js|*.jsx|*.ts|*.tsx) ;; *) continue ;; esac
            case "${ADDED}${REMOVED}" in *-*) continue ;; esac
            [ "$REMOVED" -lt 25 ] && continue
            [ "$ADDED" -ge $(( REMOVED * 75 / 100 )) ] && continue
            PCT=$(git log -1 --format=%ct "$BEFORE_SHA" -- "$FILE" 2>/dev/null)
            [ -z "$PCT" ] && continue
            AGE=$(( (CT - PCT) / 3600 ))
            [ "$AGE" -ge 24 ] && continue
            FLAGGED="${FLAGGED}  ${FILE}: -${REMOVED}/+${ADDED} lines, previously modified ${AGE}h earlier\n"
          done <<< "$(git diff --numstat --diff-filter=M "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null)"

          if [ -n "$FLAGGED" ]; then
            echo "::warning::Possible clobber of recent work - a file lost a large block that was added within the last day"
            printf "%b" "$FLAGGED"
            {
              echo "### Possible clobber of recent work"
              echo ""
              printf "%b" "$FLAGGED"
              echo ""
              echo "If this was NOT intentional, you likely edited a stale copy. Verify with:"
              echo '```'
              echo "git diff origin/main -- <file>"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No recent-work clobber detected"
          fi

      # ═══════════════════════════════════════════════════════════════
      # CHECK 18: A new money route must know about the platform freeze
      # (Dan 2026-09-01, club-arena to-do #2563 item 11). Every route in this
      # repo uses the service key, which is EXEMPT from the :55 platform-
      # freeze triggers - so a money-moving club-arena route written after the
      # freeze shipped would inherit the exemption silently and move chips
      # during the announced break. New routes must consult
      # fn_platform_frozen or carry a visible freeze-exempt marker; existing
      # routes are grandfathered in a baseline that only shrinks. The check
      # itself uses only Node built-ins and remains dependency-independent.
      - name: "CHECK 18: New money routes are freeze-aware"
        run: node scripts/check-frozen-aware-money-routes.mjs

      # CHECK 7: Storage bucket file_size_limit guard
      # This check remains dependency-free; CHECK 24 now restores the locked
      # dependency tree before the legacy safety checks run.
      # The social-media bucket file_size_limit was silently set to NULL on
      # 2026-04-22 with a wrong comment claiming it meant "unlimited". NULL
      # falls back to the project-level cap (50MB by default), and every
      # video upload >50MB was rejected with HTTP 413. Project-level cap
      # was raised to 50GB on 2026-04-29 and all video buckets set to 50GB.
      # This check guards against silent revert by anyone clicking the
      # dashboard, by `supabase db reset` replaying migrations out of order,
      # or by a future PR that re-NULLs the value.
      #
      # Guards all 7 video-capable buckets (50GB tier) + catch-all NULL
      # guard across every bucket in the project.
      #
      # Requires GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY. If the
      # secret is not set the check warns but does not block — add the
      # secret in repo Settings → Secrets and variables → Actions to
      # activate enforcement.
      # ═══════════════════════════════════════════════════════════════

      # CHECK 19: an inline width on .sp-icon-btn is silently discarded
      #
      # `.sp-icon-btn` declares `width: var(--sp-btn-size, 32px) !important`,
      # and a stylesheet !important beats an inline style. A component writing
      # `style={{ width: 48 }}` on that class renders a 32px button and a
      # comment that lies. InteractiveTutorial's close button did exactly that
      # - 48 in the source, 32 on screen, 31.84 mid-spring - and failed the
      # Poker Near Me touch-target spec on every run. A red Playwright suite
      # makes every open pull request "unstable", which GitHub refuses to
      # enable auto-merge on, so one discarded CSS declaration stopped the
      # estate from merging and a PR had to be squashed by hand.
      #
      # Baseline, not zero: most of the remaining ones are decorative buttons
      # where 32px is a deliberate desktop choice, and resizing them all at
      # once is a visual decision rather than a lint. This fails when the count
      # GROWS, so the trap cannot be re-laid quietly.
      - name: "CHECK 19: An inline width on .sp-icon-btn is not silently discarded"
        run: node scripts/ci/check-icon-button-sizing.mjs
      - name: "CHECK 10: Diamond economy invariants"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # Standing assertions for the money paths. Each one corresponds to a
          # defect that has already happened once and was found only by a hand
          # audit: deduct_diamonds writing one balance column while credits
          # wrote two; award_diamonds_v2's VIP guard failing OPEN on NULL and
          # handing the VIP earning ceiling to 470 accounts; easter eggs
          # counting toward the daily cap so legendary payouts were clamped and
          # destroyed; a public view carrying write grants to anon so an
          # unauthenticated request could rewrite tournament prize pools; and
          # the balance RPCs being revoked from `authenticated` while the
          # browser kept calling them. The assertions live in SQL
          # (migration 20260808220000) so they read the live catalog.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — economy invariants are NOT enforced."
            exit 0
          fi
          node scripts/check-economy-invariants.mjs

      # ═══════════════════════════════════════════════════════════════
      # PHASE U4 — Supabase invariants as CI gates.
      #
      # BLOCKING as of 2026-08-12. They were introduced warn-only per plan step
      # U4.3 because both reported a real backlog; that backlog is now cleared
      # (phantom 3 -> 0, stranded 7 -> 0), so warn-only was removed the same
      # day rather than left to rot. A gate nobody has to obey is not a gate.
      #
      # Exceptions: scripts/ci/supabase-invariants.allowlist.json. Every entry
      # needs a reason, and both scripts FAIL if an entry starts resolving, so
      # the allowlist can only shrink.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 11: No phantom Supabase tables (U4.2)"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # Catches `.from('table_that_does_not_exist')`. Those do not throw at
          # build time and rarely at runtime either — PostgREST returns 42P01 in
          # the error channel and this repo's call sites almost always swallow
          # it into console.warn, so the write is discarded silently forever.
          #
          # Its first run found training_moves (every individual training move
          # the app recorded was being thrown away), plus xp_logs and
          # user_dna_profiles.
          #
          # Resolves the table list from the PostgREST schema document rather
          # than a direct Postgres connection, because SUPABASE_DB_PASSWORD in
          # this repo is stale and fails auth while the service key works.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — phantom-table check is NOT enforced."
            exit 0
          fi
          node scripts/ci/check-phantom-tables.mjs

      - name: "CHECK 17: A migration this branch adds must already be applied"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # Every other check here compares CODE to the live schema. This
          # compares the MIGRATIONS to it, which nothing did.
          #
          # Motivating incident (2026-08-22): 20260821210000_user_avatars_
          # cosmetics.sql and 20260821210001_profiles_cosmetics.sql sat in
          # supabase/migrations/ for a day and were never applied. The avatar
          # frames-and-auras feature is fully built around the columns they
          # declare - the gallery renders them, the service maps them, the
          # context writes them - and every write failed with 42703 into a
          # catch block. Nothing went red. The repo claimed a feature the
          # database had never heard of.
          #
          # It reads ALTER TABLE ... ADD COLUMN as well as CREATE, because both
          # stranded migrations added COLUMNS and a CREATE-only version would
          # have watched them go past: the table already exists, so every other
          # gate stays green.
          node scripts/ci/check-migrations-applied.mjs

      - name: "CHECK 25: The code is checked against the live database and the live model list"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # Three defects shipped green on 2026-09-08 because every gate here
          # compares source to source: a category the ledger CHECK refuses
          # ('session'), a column w2g_forms does not have (amount), and model
          # ids api.x.ai answers "Model not found" (grok-2-vision-latest).
          # This asks the database (values via fn_ci_check_constraints,
          # columns via OpenAPI) and the model API (no credential needed: a
          # missing model is refused before authentication).
          node scripts/ci/check-live-contracts.mjs

      - name: "CHECK 13: No phantom Supabase COLUMNS"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # Column-level twin of CHECK 11. Motivating incident: cron telemetry
          # caught yt-pipeline-recovery failing EVERY 15-minute tick since it
          # shipped — it selected video_transcode_jobs.attempts and wrote
          # locked_at, neither of which existed. 42703 on a column behaves
          # exactly like 42P01 on a table: swallowed error, feature that
          # silently never works. CHECK 11 cannot see it (the table exists).
          #
          # First run found 187 phantom columns. Sample-verified 6/6 against
          # information_schema — zero false positives. The worst was
          # chip_escrow_holds in the poker engine's ChipBridge: written with
          # player_id/table_id/status 'locked' against a live table whose
          # columns are user_id/related_id and whose status CHECK forbids
          # 'locked' — so chip escrow tracking had NEVER written a row and
          # leave-club's "don't leave with locked chips" money guard was a
          # no-op. Fixed same day; backlog was 184.
          #
          # BLOCKING as of 2026-08-15. Introduced warn-only per the same
          # rollout doctrine as CHECKs 11/12 (a gate blocking on 184
          # pre-existing findings gets disabled, not fixed); the backlog was
          # burned to ZERO across four sweeps (187 -> 142 -> 110 -> 73 -> 0,
          # see .agent/audits/2026-08-15-check13-phantom-column-burndown.md),
          # so --warn-only was removed the same day the scanner first
          # reported clean.
          node --test tests/check-phantom-column-select-parser.test.mjs
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — phantom-column check is NOT enforced."
            exit 0
          fi
          node scripts/ci/check-phantom-columns.mjs

      - name: "CHECK 12: No stranded Supabase tables (U4.1)"
        run: |
          # Catches a table that src/services READS but nothing ever WRITES.
          # That is not a crash — it renders an empty state forever, which is
          # indistinguishable from "no data yet" and is exactly why this class
          # of bug survives review. Pure static analysis; no DB access needed.
          node --test __tests__/stranded-writers.test.mjs
          node scripts/ci/check-stranded-writers.mjs

      - name: "CHECK 14: Vendor drift guard (CJS-under-ESM + override bypass)"
        run: |
          # Closes the vendoring-drift bug CLASS behind three separate prod
          # incidents in one week (Aug 2026), none of which threw or failed the
          # build — they shipped green and broke in production:
          #   A. CJS-under-ESM: vendor/commander-shared is "type":"module", so a
          #      file in it using module.exports/require() exports NOTHING at
          #      runtime and every named import of it resolves to undefined.
          #      (parseBlindStructure.js, home-games/rpcBridge.js)
          #   B. Override bypass: several src/ files are REAL local overrides
          #      fixing a bug in the vendored twin (apiRateLimit's spoofable IP
          #      parsing, the supabase client, authUtils). Importing the vendor
          #      path directly instead of the local override silently runs the
          #      UNFIXED code. (mock-supabase-client, forgeable-vendor-auth)
          # Pure static analysis; no DB access.
          node scripts/check-vendor-drift.mjs

      - name: "CHECK 9: Reward catalog matches diamondRewards.js"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
        run: |
          # award_diamonds_v2 reads public.diamond_reward_catalog, NOT
          # src/config/diamondRewards.js. On 2026-08-05 the two had drifted on
          # five fields and nothing in the repo compared them, so the drift was
          # invisible: easter eggs were being clamped to the daily cap with the
          # excess discarded (while the store page promised the opposite),
          # a once-ever 15 diamond bonus was repayable daily, and a 500 diamond
          # referral action had no periodic limit at all. This check is that
          # comparison. The comparison itself remains dependency-free.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — reward catalog drift is NOT enforced."
            exit 0
          fi
          node scripts/check-reward-catalog-drift.mjs

      - name: "CHECK 7: Storage bucket file_size_limit guard (50GB minimum)"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — storage bucket cap is NOT enforced."
            echo "::warning::Add the secret in repo Settings -> Secrets and variables -> Actions to activate."
            exit 0
          fi

          MIN_LIMIT=53687091200    # 50GB in bytes
          PROJECT_REF="kuklfnapbkmacvwxktbh"
          # All 7 video-capable buckets from the 50GB tier
          BUCKETS="social-media live-recordings messenger_media user-media stories social-videos public-transfer"
          FAIL=0

          for BUCKET in $BUCKETS; do
            echo ""
            echo "Querying ${BUCKET} bucket configuration..."

            # Retry up to 3 times with backoff for Supabase API flakiness
            STATUS="000"
            for ATTEMPT in 1 2 3; do
              # bug-hunt-zero/B-SAFETY-1: curl exit code 28 (timeout) on a single
              # bucket query was bombing the entire step before the retry loop
              # could attempt to recover. The `|| true` makes curl's non-zero
              # exit tolerable, and the timeout is widened from 10s to 25s for
              # Supabase API slow-path tolerance. The retry loop still applies
              # for transient failures.
              RESP=$(curl -sS -w "\n%{http_code}" --max-time 25 \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                "https://${PROJECT_REF}.supabase.co/storage/v1/bucket/${BUCKET}" || true)
              BODY=$(echo "$RESP" | head -n -1)
              STATUS=$(echo "$RESP" | tail -n 1)
              [ "$STATUS" = "200" ] && break
              echo "  Attempt $ATTEMPT failed (HTTP $STATUS), retrying in 5s..."
              sleep 5
            done

            if [ "$STATUS" != "200" ]; then
              # HTTP 544 = Supabase DatabaseTimeout — transient infra issue, not a code bug.
              # Treat as a warning so transient DB outages don't block valid deploys.
              if [ "$STATUS" = "544" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
                echo "::warning::Supabase storage API timed out for ${BUCKET} (HTTP $STATUS) — skipping bucket check (transient)."
                echo "$BODY"
              else
                echo "::error::FATAL: Could not fetch ${BUCKET} bucket config after 3 attempts. HTTP $STATUS"
                echo "$BODY"
                FAIL=1
              fi
              continue
            fi

            LIMIT=$(echo "$BODY" | node -e "
              let s='';process.stdin.on('data',c=>s+=c);
              process.stdin.on('end',()=>{
                try { const j=JSON.parse(s); console.log(j.file_size_limit ?? 'null'); }
                catch(e){ console.log('parse_err'); }
              });")

            echo "Bucket '${BUCKET}' file_size_limit = ${LIMIT}"

            if [ "$LIMIT" = "null" ] || [ "$LIMIT" = "parse_err" ]; then
              echo "::error::FATAL: ${BUCKET} bucket file_size_limit is NULL — silently falls back to project-level cap."
              echo "::error::Fix: UPDATE storage.buckets SET file_size_limit = 53687091200 WHERE id = '${BUCKET}';"
              FAIL=1
              continue
            fi

            if [ "$LIMIT" -lt "$MIN_LIMIT" ]; then
              HUMAN_GB=$(( LIMIT / 1024 / 1024 / 1024 ))
              echo "::error::FATAL: ${BUCKET} bucket file_size_limit is ${HUMAN_GB}GB — below the 50GB minimum."
              echo "::error::Fix: UPDATE storage.buckets SET file_size_limit = 53687091200 WHERE id = '${BUCKET}';"
              FAIL=1
              continue
            fi

            echo "✓ ${BUCKET} bucket file_size_limit is at or above 50GB"
          done

          # Catch-all: no bucket in the project should EVER have NULL file_size_limit
          echo ""
          echo "Running catch-all NULL guard across all buckets..."
          # bug-hunt-zero/B-SAFETY-2: same fix as B-SAFETY-1 but for the
          # catch-all curl. When the Supabase storage API is slow, this curl
          # also exits 28 and set -e bombs the step. The `|| true` keeps the
          # step alive; the parse step below handles non-JSON gracefully via
          # the parse_err branch.
          ALL_RESP=$(curl -sS --max-time 25 \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            "https://${PROJECT_REF}.supabase.co/storage/v1/bucket" || true)

          NULL_BUCKETS=$(echo "$ALL_RESP" | node -e "
            let s='';process.stdin.on('data',c=>s+=c);
            process.stdin.on('end',()=>{
              try {
                const buckets=JSON.parse(s);
                const nulls=buckets.filter(b=>b.file_size_limit==null).map(b=>b.id);
                if(nulls.length) console.log(nulls.join(', '));
              } catch(e){ console.log('parse_err'); }
            });")

          if [ -n "$NULL_BUCKETS" ]; then
            echo "::error::FATAL: Buckets with NULL file_size_limit: ${NULL_BUCKETS}"
            echo "::error::NULL silently falls back to project-level cap. Set an explicit limit on each bucket."
            FAIL=1
          else
            echo "✓ No buckets have NULL file_size_limit"
          fi

          [ "$FAIL" -eq 0 ] || exit 1

      # ═══════════════════════════════════════════════════════════════
      # CHECK 1: No .single() calls (must use .maybeSingle())
      # .single() throws PGRST116 when 0 rows returned = crash
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 1: No .single() in Supabase queries"
        run: |
          echo "Scanning for .single() calls..."
          HITS=$(grep -rn '\.single()' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude='*.bak' \
            pages/ src/ lib/ services/ 2>/dev/null \
            | grep -v 'maybeSingle' \
            | grep -v '// .*single' || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found .single() calls that should be .maybeSingle():"
            echo "$HITS"
            echo ""
            echo "Fix: Replace .single() with .maybeSingle() in all Supabase queries"
            exit 1
          fi
          echo "✓ No .single() calls found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 1b: No .js file may import from an explicit .ts path
      # ═══════════════════════════════════════════════════════════════
      # Root cause of the May 2026 auth cascade:
      #   src/lib/authUtils.js contained `import { ... } from './authUtils.ts'`
      # Webpack/Next.js cannot resolve explicit .ts extension imports in .js
      # files, causing every symbol to resolve as undefined — silently breaking
      # 20+ pages with "Attempted import error: X is not exported from authUtils".
      # This check catches that pattern before it reaches Vercel.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 1b: No .js file imports from explicit .ts path"
        run: |
          echo "Scanning for .js files that import from .ts paths..."
          HITS=$(grep -rn "from ['\"].*\.ts['\"]" \
            --include='*.js' --include='*.jsx' \
            --exclude-dir=node_modules --exclude-dir=.next \
            pages/ src/ lib/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: .js file(s) importing from explicit .ts paths — webpack cannot resolve these."
            echo ""
            echo "$HITS"
            echo ""
            echo "Fix: Remove the .ts extension from the import path (use './authUtils' not './authUtils.ts')."
            echo "Why: Webpack resolves .js before .ts for extension-free imports, so the .js shim is always"
            echo "loaded. If that shim imports ./authUtils.ts with explicit extension, it silently resolves"
            echo "to nothing, making all exported symbols undefined — breaking every consumer page."
            exit 1
          fi
          echo "✓ No .js→.ts explicit extension imports found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 1c: All authUtils imports must resolve to actual exports
      # ═══════════════════════════════════════════════════════════════
      # Catches "Attempted import error: X is not exported from authUtils"
      # before the commit reaches Vercel. Scans all consumer files and
      # verifies each imported symbol exists in authUtils.js.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 1c: authUtils imports match actual exports"
        run: |
          AUTHUTILS="src/lib/authUtils.js"
          if [ ! -f "$AUTHUTILS" ]; then
            AUTHUTILS="src/lib/authUtils.ts"
          fi
          if [ ! -f "$AUTHUTILS" ]; then
            echo "::warning::authUtils not found at src/lib/authUtils.js or .ts — skipping"
            exit 0
          fi

          echo "Checking authUtils exports against consumer imports (source: $AUTHUTILS)..."

          # Extract all exported function/const names from the file
          # bug-hunt-zero/B-SAFETY-4: the previous regex only matched
          # `export function` and `export async function`. It missed
          # `export const`, `export let`, `export var`, and `export class`,
          # which made SUPABASE_URL / SUPABASE_ANON_KEY invisible to the
          # check even though they are real exports. Widened to cover all
          # named-export declaration forms.
          EXPORTS=$(grep -oE "^export (const|let|var|class|async function|function) [A-Za-z_][A-Za-z0-9_]+" "$AUTHUTILS" \
            | grep -oE "[A-Za-z_][A-Za-z0-9_]+$" | sort -u)
          EXPORT_BLOCK=$(grep -oE "^export \{[^}]+\}" "$AUTHUTILS" | grep -oE "[A-Za-z_][A-Za-z0-9_]+" || true)
          ALL_EXPORTS=$(echo -e "$EXPORTS\n$EXPORT_BLOCK" | sort -u)

          echo "Exports found in $AUTHUTILS:"
          echo "$ALL_EXPORTS" | tr '\n' ' '
          echo ""
          echo ""

          ERRORS=0
          while IFS= read -r file; do
            # Find imports from authUtils in this file
            # bug-hunt-zero/B-SAFETY-3: the previous regex extracted identifiers
            # from the WHOLE import line including the file path, treating path
            # segments like 'src', 'lib', 'authUtils' as imported symbols. Now
            # we extract ONLY what's inside the {} braces.
            IMPORTS=$(grep -oE "import \{[^}]+\} from ['\"][^'\"]*authUtils['\"]" "$file" 2>/dev/null \
              | grep -oE "\{[^}]+\}" \
              | tr -d '{}' | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | grep -E "^[A-Za-z_][A-Za-z0-9_]+$" \
              | sort -u || true)

            for sym in $IMPORTS; do
              if ! echo "$ALL_EXPORTS" | grep -qx "$sym"; then
                echo "::error file=${file}::Symbol '${sym}' is imported from authUtils but NOT exported by $AUTHUTILS"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done < <(find pages/ src/ -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \
            | grep -v node_modules | grep -v .next | grep -v authUtils)

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "::error::$ERRORS symbol(s) imported from authUtils that don't exist as exports."
            echo "Fix: Either add the missing export to authUtils.js, or remove the import."
            exit 1
          fi
          echo "✓ All authUtils imports resolve to actual exports"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 2: No unused hook imports (the ThreePillHeader bug)

      # Imported but uncalled hooks = ReferenceError during SSG
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 2: No unused React hook imports"
        run: |
          echo "Scanning for unused hook imports..."
          ERRORS=0
          for file in $(find pages/ src/ -name '*.js' -o -name '*.jsx' -o -name '*.tsx' | grep -v node_modules | grep -v .next); do
            HOOKS=$(grep -oE 'import\s+\{[^}]*\}' "$file" 2>/dev/null | grep -oE 'use[A-Z][a-zA-Z]+' | sort -u)
            for hook in $HOOKS; do
              CALL_COUNT=$(grep -cE "${hook}\s*[<(]" "$file" 2>/dev/null || echo 0)
              if [ "$CALL_COUNT" -eq 0 ]; then
                echo "::error file=${file}::Hook '${hook}' is imported but NEVER CALLED"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::FATAL: $ERRORS unused hook import(s) found. These WILL crash the build."
            exit 1
          fi
          echo "✓ All imported hooks are called"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 3: No dynamic Supabase imports bypassing patched client
      # Must use src/lib/supabaseServerClient, never raw import
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 3: No raw Supabase imports in API routes"
        run: |
          echo "Scanning for unpatched Supabase client usage..."
          HITS=$(grep -rn "await import.*@supabase/supabase-js" \
            --include='*.js' --include='*.ts' \
            pages/api/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found dynamic @supabase/supabase-js imports bypassing patched server client:"
            echo "$HITS"
            echo ""
            echo "Fix: Use 'import { createClient } from \"src/lib/supabaseServerClient\"' instead"
            exit 1
          fi
          echo "✓ All API routes use patched Supabase client"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 4: No merge conflict markers in source files
      # These cause immediate syntax errors and broken builds
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 4: No merge conflict markers"
        run: |
          echo "Scanning for git merge conflict markers..."
          # NOTE: match ANYWHERE on a line — stash pop can produce markers
          # indented inside JSDoc comments, not just at column 0.
          # deploy-autofix.js is excluded because it legitimately references
          # these strings for its own conflict detection logic.
          HITS=$(grep -rn '<<<<<<< \|>>>>>>>' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.next \
            --exclude='deploy-autofix.js' \
            src/ pages/ data/ 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::FATAL: Found git merge conflict markers in source files:"
            echo "$HITS"
            exit 1
          fi
          echo "✓ No merge conflict markers found"

      # ═══════════════════════════════════════════════════════════════
      # CHECK 18: Nothing but the sanctioned safety net may invoke a
      # Vercel deploy (issue #653). Ported from Club Arena, with the one
      # exception is retired with the Club Arena sync (2026-09-03): nothing
      # calls the deploy hook now, so check-no-vercel-deploy has no allowlist
      # written into the script. A rule in a document loses to a script
      # with a plausible filename; this makes the rule executable.
      # ═══════════════════════════════════════════════════════════════
      - name: "CHECK 18: No direct Vercel deploy invocations"
        run: node scripts/ci/check-no-vercel-deploy.mjs

      # ===============================================================
      # CHECK 19/20: player-facing copy laws, ported from Club Arena.
      #
      # Both laws are Dan's and both were enforced ONLY inside Club
      # Arena, which is one app inside the site. The World Hub is most
      # of the pages a player ever sees and had neither gate, so it had
      # drifted to ~3,900 lines of copy carrying an em dash and ~2,000
      # text nodes that were not Title Cased. Fixing that without also
      # landing the gate would just start the drift again.
      #
      # Both scripts autofix: add --fix to the command locally.
      # ===============================================================
      - name: "CHECK 19: No em dashes in player-facing copy"
        run: node scripts/ci/check-ui-text.mjs

      # check-title-case parses JSX with the TypeScript compiler, because the
      # careful part of it is the AST walk and its `{n}s` / `x{count}` suffix
      # guards. CHECK 20 normally consumes TypeScript from the lockfile-exact
      # dependency tree restored above for CHECK 24. Its dedicated parser cache
      # and guarded `--no-save` fallback remain as availability defenses; a
      # failed fallback is blocking, so the check cannot be skipped silently.
      # The ad hoc parser install took 55s a run when first measured on
      # 2026-09-04, which is why the focused TypeScript cache remains.
      - name: Restore the TypeScript parser CHECK 20 needs
        uses: actions/cache@v4
        with:
          path: node_modules/typescript
          key: ts5-parser-${{ runner.os }}-v1

      - name: "CHECK 20: Title Case on every player-facing page"
        run: |
          if ! node -e "require.resolve('typescript')" 2>/dev/null; then
            npm install --no-save --no-audit --no-fund --ignore-scripts typescript@5 \
              || { echo "::error::could not install the TypeScript parser CHECK 20 needs"; exit 1; }
          fi
          node scripts/ci/check-title-case.mjs

      # ═══════════════════════════════════════════════════════════════
      # CHECK 8: Auth-critical files exist on disk
      # Single source of truth: __tests__/auth-routes-exist.test.mjs
      # See docs/runbooks/07-auth-outage.md for the 2026-05-02 incident
      # that motivated this guard (every signup 404'd because
      # pages/auth/callback.js had been silently deleted).
      # ═══════════════════════════════════════════════════════════════
      # arena-theme-assets-exist.test.mjs left this list on 2026-09-03: it
      # asserted card artwork inside public/hub/club-arena/, which Club Arena
      # now serves from its own origin. club-arena-is-a-rewrite.test.mjs takes
      # its place here - the same idea (the thing we serve is actually there)
      # against the arrangement that exists.
      # avatar-art-has-no-punched-holes reads pixels, so it needs sharp, and this
      # job deliberately does not `npm ci` (see CHECK 20's note). Without this it
      # would SKIP on every run - green, silent, and exactly the decorative guard
      # it was written to replace: `scripts/check-avatar-integrity.mjs` claimed to
      # stop holes coming back, never opened an image, and 86 of the 100 busts
      # were holed again fifteen days later. Cached on its own key, restored
      # before the check, and the check itself fails loudly in CI if it is still
      # missing rather than reporting a skip as a pass.
      - name: Restore the image codec CHECK 8 needs
        uses: actions/cache@v4
        with:
          path: node_modules/sharp
          key: sharp-avatar-guard-${{ runner.os }}-v1

      - name: "CHECK 8: Auth-critical files exist"
        run: |
          if [ ! -f __tests__/auth-routes-exist.test.mjs ]; then
            echo "::error::__tests__/auth-routes-exist.test.mjs is missing — the guard itself was deleted."
            exit 1
          fi
          # sharp 0.34 ships prebuilt @img/sharp-* binaries, so --ignore-scripts
          # is safe here; it is the same shape as CHECK 20's parser install.
          if ! node -e "require.resolve('sharp')" 2>/dev/null; then
            npm install --no-save --no-audit --no-fund --ignore-scripts sharp@0.34 \
              || echo "::warning::could not install sharp; the avatar guard will say so and fail"
          fi
          node --experimental-vm-modules --test \
            __tests__/_test-guards-exist.test.mjs \
            __tests__/auth-routes-exist.test.mjs \
            __tests__/gdpr-financial-refusal.test.mjs \
            tests/spin-activation-route.test.mjs \
            __tests__/signup-hardening.test.mjs \
            __tests__/build-2-deliverables.test.mjs \
            __tests__/retired-error-provider.test.mjs \
            __tests__/notification-feed-recovery.test.mjs \
            __tests__/phase-3-deliverables.test.mjs \
            __tests__/phase-4-deliverables.test.mjs \
            __tests__/scroll-lock.test.mjs \
            __tests__/union-settlement-math.test.mjs \
            __tests__/public-shell-precache.test.mjs \
            __tests__/manifest-icons.test.mjs \
            __tests__/fixed-elements-stay-fixed.test.mjs \
            __tests__/cashier-push-types.test.mjs \
            __tests__/push-title-case.test.mjs \
            __tests__/rotation-keeps-device-identity.test.mjs \
            __tests__/vercel-build-queue.test.mjs \
            __tests__/openclaw-workers-secret.test.mjs \
            __tests__/openclaw-critical-jobs.test.mjs \
            __tests__/horse-solver-v31-ingress.test.mjs \
            __tests__/horse-solver-v31-pipeline.test.mjs \
            __tests__/git-safe-push-credential-safety.test.mjs \
            __tests__/an-rpc-call-names-a-real-signature.law.test.mjs \
            __tests__/phase6-content-dispatch.test.mjs \
            __tests__/native-push-fcm.test.mjs \
            __tests__/login-bridge-probe-relay.test.mjs \
            __tests__/revenuecat-webhook.test.mjs \
            __tests__/pull-to-refresh-no-transform-at-rest.test.mjs \
            __tests__/native-app-cors.test.mjs \
