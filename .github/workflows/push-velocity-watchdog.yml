name: push-velocity-watchdog

# Hourly watchdog that raises a GitHub Issue if origin/main hasn't received
# a commit in >4h during work hours. Catches the class of silent-failure
# where auto-push agents back off on chronic red CI without anyone noticing.
#
# Triggered 2026-05-10 by a 3-hour stall: the branch-protection-watchdog
# workflow was added without an allowlist entry in CHECK 6c, every push
# failed Build Safety Gate, and agents stopped pushing for 3+ hours
# before Dan noticed.
#
# See scripts/check-push-velocity.mjs and
# .agent/audits/2026-05-10-push-pipeline-3h-stall.md

on:
  schedule:
    # A SCHEDULE IS RIGHT HERE, unlike the publish watchdog: this detects the
    # ABSENCE of pushes, so a push trigger would fire only when there is
    # nothing to report.
    #
    # But the cadence is a wish. Measured on 2026-09-09 over the last 30
    # scheduled runs of this workflow:
    #
    #   claimed:  every hour
    #   actual:   219 minutes median, 380 minutes worst
    #
    # GitHub drops and defers scheduled runs on a busy account. The threshold
    # this checks is a 4-hour stall, and a 6.3-hour gap between runs means a
    # real stall is reported LATE rather than missed: the check compares the
    # last commit against now, so a later run still sees it. Late is the cost,
    # and it is worth knowing rather than assuming an hour.
    - cron: '0 */1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Check push velocity on main
        env:
          # THE BUILT-IN TOKEN, deliberately - not a PAT.
          #
          # This was `secrets.GH_ADMIN_PAT || secrets.VERCEL_UNIQUENESS_PAT ||
          # secrets.GITHUB_TOKEN`, and it had been failing every hour since at
          # least 2026-09-02 with
          #     Error: GET commit: 401
          # `||` in an Actions expression picks the first NON-EMPTY value, and
          # an EXPIRED PAT is not empty - so the dead secret kept winning and
          # the perfectly good built-in token was never reached. A fallback
          # chain does not protect you from expiry; it hides it, and it hid it
          # inside the watchdog whose whole job is to notice silence.
          #
          # Nothing here needs a PAT. check-push-velocity.mjs only reads
          # commits, lists and files issues, and reads workflow runs - all in
          # THIS repository, all covered by the `permissions:` block above.
          # GITHUB_TOKEN is minted per run and cannot expire.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-push-velocity.mjs
