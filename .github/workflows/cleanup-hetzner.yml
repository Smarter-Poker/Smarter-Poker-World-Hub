name: Cleanup Hetzner Server

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.HETZNER_HOST_KEY }}" > ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts || true
          printf '#!/bin/bash\nexec ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 root@${{ secrets.HETZNER_HOST }} "$@"\n' > ~/hssh
          chmod +x ~/hssh

      - name: Run Cleanup Script
        run: |
          echo "==== KILLING XMRIG ===="
          ~/hssh "pkill -f xmrig" || true
          ~/hssh "pkill -f restore.sh" || true
          
          echo "==== REMOVING CRON ===="
          ~/hssh "crontab -r" || true
          ~/hssh "rm -rf /etc/xmrig-restore" || true
          
          echo "==== CLEANING AUTHORIZED KEYS ===="
          ~/hssh "cat ~/.ssh/authorized_keys | grep 'smarter.poker@deploy' > /tmp/ak && mv /tmp/ak ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys" || true
          ~/hssh "cat ~/.ssh/authorized_keys" || true
          
          echo "==== CHECKING FOR OTHER MINERS ===="
          ~/hssh "find / -name '*xmrig*' 2>/dev/null" || true
