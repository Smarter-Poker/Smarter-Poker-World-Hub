name: E2E Tests (Playwright)

# Runs on PRs, main pushes, and manual trigger. Branch protection decides
# whether the PR run blocks merge; the main run provides post-promote evidence.
# OFF THE PULL-REQUEST PATH (2026-09-04). This suite is not a required check,
# it has been red on main since 2026-09-03 18:32 (18 of the last 22 main runs
# failed - 140 failures a run, the Commander routes returning 500 and Poker
# Near Me phase 8), and it holds one of the World Hub's runners for 15-20
# minutes on EVERY push to EVERY branch, twice (pull_request and push). On
# 2026-09-04 the required checks behind it were waiting 8-14 minutes for a
# runner. A red, unactioned, non-blocking suite on the critical path is pure
# cost: it runs on main and on demand until it is green again, at which point
# the pull_request trigger belongs back here in the same commit that fixes it.
# AND OFF THE MAIN-PUSH PATH TOO (2026-09-09). The note above took the suite
# off pull requests while it is red. It stayed on `push: [main]`, which was
# survivable only because `cancel-in-progress: true` killed most runs early.
# Removing that cancellation on 2026-09-08 - correct in general, wrong for a
# suite whose verdict is already known - turned "cancelled and cheap" into
# "completes and expensive":
#
#   MEASURED over the following 24 hours: 20 runs on main, EVERY ONE red,
#   556 runner-minutes. That is nine hours of an estate runner a day, on the
#   pool the audit found to be the binding constraint on the whole estate.
#
# And it learns nothing new each time. 78 of the failures in a run are one
# environmental cause: /api/health answers 503 because the job starts the app
# against `https://placeholder.supabase.co` (the `|| 'placeholder'` fallbacks
# below fire when the Supabase secrets are absent), so the health route
# correctly reports itself unhealthy and three separate specs assert 200.
#
# WHAT TO FIX BEFORE PUTTING EITHER TRIGGER BACK: give this job real Supabase
# credentials, or teach those specs that a placeholder-backed server is
# expected to be degraded. Then restore `push: [main]` and `pull_request` in
# the same commit, per the note above. `cancel-in-progress` below is already
# written to do the right thing on either ref.
#
# It remains runnable on demand, which is what it is for while it is red.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-${{ github.ref }}
  # FALSE ON main, true anywhere else (2026-09-08).
  #
  # This workflow triggers on `push: [main]` and `workflow_dispatch` only - the
  # pull_request trigger was removed on 2026-09-04 (see the note above). So in
  # practice every scheduled-by-a-push run of this job IS on refs/heads/main,
  # and `cancel-in-progress: true` was cancelling all of them.
  #
  # `.agent/audits/2026-08-21-publish-deadlock-and-palette-clobber.md:55-59`
  # states the rule: "cancel-in-progress: true is correct when pushes are slower
  # than the build. It inverts into a deadlock the moment they are faster."
  #
  # Measured 2026-09-08 over the last 120 commits on main: median gap between
  # commits 7.3 minutes, 53% of gaps under 8 - against a job whose own comment
  # below budgets ~7 minutes to install and build before the first test runs.
  # It was being killed more often than it could finish, so the "18 of the last
  # 22 main runs failed" note above was reading a suite that mostly never got
  # to a verdict at all.
  #
  # Expression rather than a bare `false` so that if the pull_request trigger
  # comes back - the note above says it should, in the commit that turns this
  # suite green - PR runs get the correct behaviour without a second edit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # A clean install + production build consumes ~7 minutes. The authenticated
    # desktop/mobile matrix uses two bounded workers. Four workers repeatedly
    # saturated the single local Next.js server and produced changing health,
    # navigation, and hydration failures across otherwise unrelated surfaces.
    # Two preserves parallel coverage while keeping the server responsive.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'


      # THE COLD INSTALL, EVERY RUN (2026-09-08). `cache: npm` above keeps only
      # the tarballs; extracting 1,324 packages still happened on every run of
      # this job. The pattern below is the one already proven in this repo at
      # build-safety-gate.yml's type-check job on 2026-09-04: 424s -> ~15s.
      #
      # The key is SHARED with the other --ignore-scripts jobs in this repo on
      # purpose. Club Arena kept two deliberately separate node_modules caches
      # for two jobs installing the identical tree, so neither ever warmed the
      # other; there is no reason to repeat that here. --ignore-scripts means
      # no native binaries are built, so the tree is portable between the
      # self-hosted estate runners and hosted ubuntu.
      #
      # The install is SKIPPED on a hit, because `npm ci` deletes node_modules
      # before installing and would throw the restored tree away.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-noscripts-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: |
          # LOUD, NOT SILENT (2026-09-09). This was `npm ci ... 2>/dev/null ||`.
          # The redirect threw away the only evidence of WHY npm ci failed, so
          # the job fell through to a slower, non-deterministic `npm install`
          # and reported success either way. That is how the lockfile break
          # this fallback was written for went unnoticed long enough to be
          # described in a comment as current when it had already been fixed.
          # The fallback stays - it costs nothing when npm ci works, which it
          # now does - but it says so.
          npm ci --ignore-scripts || {
            echo "::warning::npm ci failed here - falling back to npm install, which is slower and not lockfile-deterministic. The error is above."
            npm install --ignore-scripts
          }

      - name: Verify lock file integrity
        # Ensures package.json and package-lock.json are in sync.
        # If someone edited package.json without running npm install, this catches it.
        run: |
          # Check that lock file matches package.json specs
          if npm install --dry-run --package-lock-only 2>&1 | grep -E "^added|^removed|^changed" | grep -v "^0"; then
            echo "::warning::package-lock.json may be out of sync with package.json. Run 'npm install' locally and commit the updated lock file."
          else
            echo "✅ package-lock.json is in sync with package.json"
          fi


      # Playwright browsers were downloaded from scratch on every run - no job
      # in this repo cached ~/.cache/ms-playwright (verified 2026-09-08: no
      # match for ms-playwright or PLAYWRIGHT_BROWSERS_PATH in any of the 38
      # workflow files). The install step still RUNS below rather than being
      # skipped on a hit: Playwright no-ops when the browser is already on
      # disk, and that keeps the OS-dependency half of --with-deps honest
      # instead of trusting a cache to have provided it.
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-wh-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-wh-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then npx playwright install chromium webkit; else npx playwright install --with-deps chromium webkit; fi


      # .next/cache across runs. This job runs a full `npm run build`, and
      # webpack's cache is what makes the second one cheap - the same cache
      # git-safe-push.sh was deleting locally before every push until
      # 2026-09-08 (2.4 GB of .next, 2.0 GB of it this cache). Keyed on the
      # lockfile plus the sha so every run writes a fresh entry, with a prefix
      # restore-key so it starts from the most recent one.
      - name: Restore .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-wh-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-wh-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-wh-${{ runner.os }}-

      - name: Build Next.js
        # `npm run build`, NOT a bare `npx next build`.
        #
        # This step was the only place in the repository that built the app its
        # own way, and it was missing both halves of what package.json's build
        # script does:
        #
        #   node scripts/patch-next.js    repairs a WebpackError constructor bug
        #                                 inside node_modules/next
        #   NODE_OPTIONS=--max-old-space-size=7168
        #
        # Without the heap headroom the build died with "Reached heap limit -
        # JavaScript heap out of memory", and it died on EVERY branch: 14 of the
        # last 14 runs failed, including branches whose entire diff was
        # documentation. A check that is red for everyone is not a check, it is
        # a thing people learn to scroll past - and this one would have gone on
        # saying exactly the same thing on the day a real regression landed.
        #
        # Going through `npm run build` means there is now ONE build command in
        # this repository, which is also the one Vercel runs, so the two cannot
        # drift apart again. tests/one-build-command.test.mjs pins that.
        #
        # The trailing --webpack is preserved deliberately: Next.js 16+ defaults
        # to Turbopack, which breaks on our custom webpack config and the 246
        # named-export mismatches from the May 2026 incident. npm passes
        # everything after `--` through to the underlying next build.
        run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

      - name: Verify Storefront Performance Budgets
        run: node scripts/ci/check-storefront-budget.mjs

      # Start the production server in the background so Playwright has a
      # real localhost:3000 to hit. Without this, every test that calls
      # page.goto() or fetches /api/* had been failing since this workflow
      # was written (see .memory/context/phase-1-gate-closure.md for history).
      # Per-runner port - see global-footer-e2e.yml. Two E2E jobs on one box
      # bound :3000 together and the second died with EADDRINUSE (2026-09-04).
      - name: Reserve this runner's port
        id: port
        run: |
          PORT=$(node scripts/ci/e2e-port.mjs 3000)
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          PIDS=$(lsof -tiTCP:"$PORT" -sTCP:LISTEN 2>/dev/null || true)
          if [ -n "$PIDS" ]; then echo "freeing port $PORT held by orphaned pid(s): $PIDS"; kill -9 $PIDS 2>/dev/null || true; fi

      - name: Start Next.js server
        run: |
          nohup node_modules/.bin/next start -p ${{ steps.port.outputs.port }} > /tmp/next-server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          echo "Next.js server PID: $!"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || 'placeholder-admin-secret-for-ci' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'ci-placeholder-stripe-webhook' }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN || 'ci-placeholder-twilio-token' }}
          KYC_WEBHOOK_SECRET: ${{ secrets.KYC_WEBHOOK_SECRET || 'ci-placeholder-kyc-webhook' }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'ci-placeholder-deploy-webhook' }}

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:${{ steps.port.outputs.port }}/ -o /dev/null 2>&1; then
              echo "Server up after ${i} attempts (${i}×2s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server failed to boot in 60s"
          echo "--- server log tail ---"
          tail -80 /tmp/next-server.log || true
          exit 1

      - name: Run Playwright tests
        # Global footer coverage has its own required, cross-browser workflow.
        # Running it here as well competes with auth setup for the same local
        # server and duplicates every footer assertion without adding coverage.
        run: npx playwright test --project=chromium --project=mobile-chrome
        env:
          CI: true
          # e2e/00-auth.setup.ts signs in as the standing test account and every
          # other spec depends on the storage state it saves. This value was
          # never passed, so page.fill() got `undefined` and threw
          # "value: expected string, got undefined" - which fails the setup
          # project and therefore all 244 tests, from a message that says
          # nothing about a missing secret. Nobody saw it, because the build had
          # been OOMing before Playwright ever started.
          # 2026-09-04: the ACCOUNT is a repository variable, not a literal in
          # e2e/00-auth.setup.ts. It used to be Dan's personal address, so every
          # CI run signed in as him. TEST_USER_EMAIL is the platform service
          # account (Dan: "KEEP MY ACCOUNT CLEAN"); the password stays a secret.
          TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL || secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          NEXT_PUBLIC_BASE_URL: 'http://localhost:${{ steps.port.outputs.port }}'
          PLAYWRIGHT_WORKERS: 2

      - name: Stop Next.js server + surface log
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi
          echo "::group::Next.js server log (last 200 lines)"
          tail -200 /tmp/next-server.log 2>/dev/null || echo "(no log file)"
          echo "::endgroup::"
          mkdir -p test-results
          cp /tmp/next-server.log test-results/next-server.log 2>/dev/null || true

      # A failing broad run previously uploaded every retained video and trace
      # twice (HTML attachments + raw results), producing ~2.5 GB per run.
      # Console logs, the report index, failure context, and screenshots retain
      # actionable evidence without exhausting repository artifact storage.
      - name: Upload compact failure report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/index.html
            test-results/**/error-context.md
            test-results/**/*.png
            test-results/next-server.log
          if-no-files-found: warn
          retention-days: 3

      - name: Report results to PR
        if: always() && github.event_name == 'pull_request'
        # Reporting is telemetry. A temporary GitHub comment outage must not
        # replace the browser suite's authoritative pass/fail conclusion.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: pr,
              body: `${status} **E2E Tests:** ${{ job.status }}\n\n[View full report](${runUrl})`
            });
