name: Sentinel File Tripwire

# ═══════════════════════════════════════════════════════════════════════════
# Posts a high-visibility comment on any PR that touches auth-critical files.
# Forces a human to actually look at the change. Doesn't BLOCK the PR — that's
# what build-safety-gate.yml is for. This is observability + accountability.
#
# Why: every signup outage in the past has come from a "small change" to one
# of these files that nobody reviewed carefully. The comment makes it impossible
# to claim "I didn't realize that was sensitive."
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [main]
    paths:
      - 'pages/auth/**'
      - 'pages/api/auth/**'
      - 'middleware.ts'
      - 'middleware.js'
      - 'config/geo-blocks.json'
      - 'next.config.js'
      - 'next.config.mjs'
      - 'src/lib/supabase.ts'
      - 'src/lib/supabase.js'
      - 'src/lib/supabaseAdmin.ts'
      - 'src/lib/supabaseAdmin.js'
      - 'src/lib/supabaseServer.ts'
      - 'src/lib/supabaseServerClient.js'
      - '__tests__/auth-routes-exist.test.mjs'
      - '__tests__/signup-hardening.test.mjs'

permissions:
  pull-requests: write
  contents: read

jobs:
  tripwire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed sentinel files
        id: changed
        run: |
          BASE=$(git merge-base origin/main HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD -- \
            pages/auth pages/api/auth middleware.ts middleware.js \
            config/geo-blocks.json next.config.js next.config.mjs \
            src/lib/supabase.ts src/lib/supabase.js \
            src/lib/supabaseAdmin.ts src/lib/supabaseAdmin.js \
            src/lib/supabaseServer.ts src/lib/supabaseServerClient.js \
            __tests__/auth-routes-exist.test.mjs __tests__/signup-hardening.test.mjs \
            2>/dev/null || true)
          {
            echo 'files<<EOF'
            echo "$CHANGED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.changed.outputs.files }}`.trim().split('\n').filter(Boolean);
            if (!files.length) return;

            const body = [
              '## ⚠️ Sentinel: this PR touches auth-critical files',
              '',
              'Changes to these files have caused signup outages before. Please:',
              '',
              '- [ ] I have run `node --test __tests__/auth-routes-exist.test.mjs __tests__/signup-hardening.test.mjs` locally',
              '- [ ] I have read `docs/SIGNUP_RUNBOOK.md` and understand the failure modes these files protect against',
              '- [ ] If I removed a guard, I added a replacement that protects the same class of failure',
              '- [ ] If geo-blocks or middleware changed, I tested with at least one restricted-state region',
              '- [ ] Auth Owner has reviewed (re-request review if not)',
              '',
              '**Files changed:**',
              ...files.map((f) => `  - \`${f}\``),
              '',
              '_This comment is auto-posted by `.github/workflows/sentinel-tripwire.yml`._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
