name: Personal Assistant Browser Smoke and Unit Gates

# Path-filtered PR verification check for Personal Assistant, Sandbox, and Share surfaces.
# Read-only verification check; no workflow/cron/watcher may initiate, advance, retry, or certify a release.

on:
  pull_request:
    branches: [main]
    paths:
      - 'pages/hub/personal-assistant/**'
      - 'pages/share/hand.js'
      - 'pages/_app.js'
      - 'pages/api/assistant/**'
      - 'pages/api/poker/saved-hands.js'
      - 'pages/api/sandbox/**'
      - 'pages/api/training/audit-hand-history.js'
      - 'pages/api/og/hand-card.js'
      - 'src/components/personal-assistant/**'
      - 'src/components/sandbox/**'
      - 'src/lib/personal-assistant/**'
      - 'src/lib/sandbox/**'
      - 'src/lib/training/handAuditEngine.js'
      - 'src/lib/push/push-prefs.js'
      - 'src/config/diamondRewards.js'
      - 'src/hooks/useAssistant.js'
      - 'src/styles/worlds/PersonalAssistant*.module.css'
      - 'public/images/personal-assistant/**'
      - 'scripts/ci/pa-browser-smoke.mjs'
      - 'scripts/qualification/personalAssistantBrowser.mjs'
      - 'scripts/verify-pa-production-hardening.mjs'
      - 'scripts/openclaw-cron-dispatcher.py'
      - 'supabase/migrations/**'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/pa-*.test.mjs'
      - 'tests/personal-assistant-simplification.test.mjs'
      - 'tests/personal-assistant-math-and-worker.test.mjs'
      - '__tests__/pa-*.test.mjs'
      - '__tests__/helpers/saved-hand-query-fixture.mjs'
      - 'e2e/021-personal-assistant.spec.ts'
      - 'e2e/personal-assistant-completion.spec.ts'
      - 'e2e/fixtures/personalAssistantBrowser.ts'
      - '.github/workflows/pa-browser-smoke.yml'
      - '.github/workflows/global-footer-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pa-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-and-unit:
    name: Personal Assistant Contract and Unit Gates
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-noscripts-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --prefer-offline --no-audit
        env:
          HUSKY: '0'

      - name: Run Personal Assistant Contract Smoke
        run: node scripts/ci/pa-browser-smoke.mjs --check-only

      - name: Run Personal Assistant Unit And Regression Gates
        run: node --test tests/pa-*.test.mjs tests/personal-assistant-simplification.test.mjs tests/personal-assistant-math-and-worker.test.mjs __tests__/pa-*.test.mjs
