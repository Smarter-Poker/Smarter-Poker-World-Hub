# ═══════════════════════════════════════════════════════════════════════════
# Supabase invariants (Phase U4)
# ═══════════════════════════════════════════════════════════════════════════
# Catches the class of bug where application code talks to a relation that
# does not exist. Those calls fail with 42P01 at runtime and are swallowed by
# the caller's warn-and-continue error handling, so they surface as "the data
# just never saved" weeks later.
#
# Deliberately a SEPARATE workflow rather than another step inside
# build-safety-gate.yml: that gate has been failing on every commit at CHECK 8
# for a long time, so anything added to it inherits a red status and provides
# no signal.
#
# NON-BLOCKING for now (continue-on-error) per U4.3 — warnings first, blocking
# once the current findings are cleared. Flip `continue-on-error` to false to
# make it enforcing.
#
# No `schedule:` trigger here on purpose — CLAUDE.md section 11.3 forbids new
# scheduled GitHub Actions; scheduled work belongs on Open Claw.
# ═══════════════════════════════════════════════════════════════════════════
name: Supabase Invariants

on:
  push:
    branches: [main]
    # COST: every Club Arena merge rsyncs a compiled bundle into this repo and
    # pushes it to main. On 2026-08-22 that happened 76 times, and each one woke
    # nine workflows here that have nothing to say about minified output — 947
    # runs in Club Arena produced 950 in World Hub. GitHub bills per JOB rounded
    # up to a whole minute, so a 20-second guard costs a full minute.
    #
    # ONLY the `push` trigger is filtered. Never add paths-ignore to
    # `pull_request`: a PR touching only these paths would then never report
    # this context, and a required check that never reports is a pull request
    # that never merges.
    # Skipped here because these assert database shape and never read the bundle.
    paths-ignore:
      - 'public/hub/club-arena/**'
  pull_request:
    branches: [main]

concurrency:
  group: supabase-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phantom-tables:
    name: "U4.2: No phantom tables"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Skips cleanly when the secrets are absent (e.g. a fork PR), so this
      # can never fail for a reason the author cannot fix.
      - name: Check for references to nonexistent relations
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/check-phantom-tables.mjs

  cron-liveness:
    name: "U4.3: Scheduled jobs actually succeed"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The runtime member of the U4 family. The other three checks are static
      # analysis asking "does this relation / column / writer exist?". This one
      # asks the question they cannot: does the scheduled work actually finish?
      #
      # Motivating incident, 2026-08-17: eight jobs failing at 100%, seven of
      # which had NEVER succeeded once since being scheduled in early May —
      # ~2,000 invocations, zero completions. trivia-embed-backfill ran 835
      # times and left all 11,197 trivia_questions rows with a NULL pgvector
      # embedding, so semantic dedup had never worked. Every one of those
      # failures sat in cron_execution_log the whole time; nothing read it.
      # See .agent/audits/2026-08-17-cron-triage-seven-jobs-never-worked.md
      #
      # Non-blocking for the same reason as U4.2 above: it currently reports 8
      # real failures plus 14 jobs that have never fired at all. Flip
      # continue-on-error to false once those are cleared — leaving it red
      # permanently is exactly how the original problem survived a quarter.
      - name: Check every scheduled cron has succeeded at least once
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/check-cron-liveness.mjs
