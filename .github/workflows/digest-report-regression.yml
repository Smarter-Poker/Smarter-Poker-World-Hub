name: Digest Report Regression
on:
  workflow_dispatch:
    inputs:
      day:
        description: Central report day (YYYY-MM-DD)
        required: true
        type: string
      expected_sha:
        description: Full protected revision currently served by production
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/dailyDigest/**'
      - 'pages/api/digest/**'
      - 'pages/api/cron/daily-digest.js'
      - 'supabase/migrations/*digest*'
      - '__tests__/*digest*'
      - 'scripts/verify-digest-player-report-postgres.mjs'
      - '.github/workflows/digest-report-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/dailyDigest/**'
      - 'pages/api/digest/**'
      - 'pages/api/cron/daily-digest.js'
      - 'supabase/migrations/*digest*'
      - '__tests__/*digest*'
      - 'scripts/verify-digest-player-report-postgres.mjs'
      - '.github/workflows/digest-report-regression.yml'
permissions:
  contents: read
jobs:
  report:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Render and report boundary regressions
        run: node --test __tests__/daily-digest.test.mjs __tests__/digest-figures-carry-separators.test.mjs
      - name: Install PostgreSQL 17 for report qualification
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17
      - name: Actual migration and PostgreSQL accounting boundaries
        env:
          PHASE6_POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: node scripts/verify-digest-player-report-postgres.mjs
  live-report:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Read the signed production digest without sending email
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DIGEST_DAY: ${{ inputs.day }}
          DIGEST_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/verify-digest-live.mjs
