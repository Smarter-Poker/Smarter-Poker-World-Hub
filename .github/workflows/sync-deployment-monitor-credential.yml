name: Sync deployment monitor credential

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deployment-monitor-credential
  cancel-in-progress: false

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify configuration safety
        run: python3 __tests__/test_deployment_monitor_config.py
      - name: Install the existing workers connection and pinned host key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_MONITOR_WORKERS_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_MONITOR_WORKERS_HOST_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-monitor"
          test -n "$SSH_KEY" && test -n "$HOST_KEY"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy-monitor/key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/deploy-monitor/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy-monitor/key" > /dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/deploy-monitor/known_hosts" > /dev/null
      - name: Validate Vercel and atomically stage only its workers credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_MONITOR_SSH_KEY_FILE: ${{ runner.temp }}/deploy-monitor/key
          DEPLOY_MONITOR_KNOWN_HOSTS_FILE: ${{ runner.temp }}/deploy-monitor/known_hosts
        run: python3 scripts/sync-deployment-monitor-credential.py
      - name: Remove temporary SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-monitor"
