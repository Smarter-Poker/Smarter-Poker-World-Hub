# ═══════════════════════════════════════════════════════════════════════════
# SILENT WRITE GUARD
#
# PostgREST answers an UPDATE or DELETE that matches ZERO ROWS with
# { data: null, error: null }. A caller that checks only `if (error)` then
# reports success having changed nothing.
#
# This is not theoretical. In the two days before this guard was written it had
# produced, in production code:
#
#   - a Stripe VIP grant that could take payment and grant nothing, and answer
#     200 so Stripe never retried;
#   - a diamond VIP purchase that deducted diamonds, failed to grant, and
#     skipped its own refund branch because that branch keys on `error`;
#   - a review DELETE that removed the row from the UI and wrote an
#     admin_audit_log entry for a deletion that never happened;
#   - a BBJ payout permanently blocked by its own un-released claim row;
#   - rake silently dropped whenever an optimistic lock lost twice;
#   - "Ticket Marked Resolved" on a ticket that stayed open.
#
# The fix is always the same: `.select(...)` and check the length.
#
# The baseline can only go DOWN. Raising a number in
# scripts/ci/silent-writes-baseline.json needs a reason in the PR that says why
# a write which may have changed nothing is safe to report as success.
#
# A genuinely fire-and-forget write is exempted in place with a
# `silent-write-ok:` comment AND A REASON, not by moving the baseline.
# ═══════════════════════════════════════════════════════════════════════════
name: Silent Write Guard

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: silent-write-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Named explicitly: a bare `check` job produces a status context that
    # collides with every other bare `check` job in this repo.
    name: No New Silent Writes
    # PULL REQUEST ONLY (2026-09-04). This ran again on every push to main -
    # on the squash commit of a pull request it had just passed - so every
    # merge queued a second full copy of this repo's thirteen workflows behind
    # the NEXT pull request's checks, on six runners. Measured on #1336: jobs
    # that ran in 0.2-2.1 minutes waited 8-14 minutes for a runner. The
    # ruleset enforces this check on the pull request; the merge commit is
    # the same tree. Club Arena made the same call on 2026-08-23.
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Same key as undefined-identifier-guard on purpose: same Node line, same
      # full install, so whichever of the two runs first warms the other. See
      # the note on the TypeScript Check job in build-safety-gate.yml.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-wh-guard-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # The fallback to `npm install` is kept as a net, but the reason this
        # comment used to give for it is no longer true (verified 2026-09-04:
        # `npm ci --dry-run` on the current lockfile succeeds under npm 10.8
        # AND npm 11.12). It said package-lock.json was out of sync and npm 11
        # refused it with "ajv@6.15.0 does not satisfy ajv@8.20.0"; that was
        # fixed on main since. Left here so nobody regenerates a healthy
        # lockfile on the strength of a stale sentence - and because the net
        # still costs nothing when `npm ci` works, which it does.
        run: |
          # LOUD, NOT SILENT (2026-09-09). This was `npm ci ... 2>/dev/null ||`.
          # The redirect threw away the only evidence of WHY npm ci failed, so
          # the job fell through to a slower, non-deterministic `npm install`
          # and reported success either way. That is how the lockfile break
          # this fallback was written for went unnoticed long enough to be
          # described in a comment as current when it had already been fixed.
          # The fallback stays - it costs nothing when npm ci works, which it
          # now does - but it says so.
          npm ci --prefer-offline --no-audit || {
            echo "::warning::npm ci failed here - falling back to npm install, which is slower and not lockfile-deterministic. The error is above."
            npm install --no-audit --no-fund
          }
        env:
          HUSKY: '0'

      - name: Check for new silent writes
        run: node scripts/ci/check-silent-writes.mjs --ci
