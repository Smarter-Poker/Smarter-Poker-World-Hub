  const bodyMat = new THREE.MeshPhysicalMaterial({ color: 0x0c1a2c, metalness: 0.9, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1.2 });
  const edgeMat = new THREE.MeshPhysicalMaterial({ color: 0xd9a531, metalness: 1, roughness: 0.22, clearcoat: 0.9, envMapIntensity: 1.2 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, th, 96), bodyMat); body.rotation.x = Math.PI / 2; chip.add(body);
  for (let i = 0; i < 8; i++) {
    const ins = new THREE.Mesh(new THREE.BoxGeometry(r * 0.3, th * 1.04, r * 0.05), i % 2 ? neon : edgeMat);
    const a = i / 8 * Math.PI * 2; ins.position.set(Math.cos(a) * (r - r * 0.02), Math.sin(a) * (r - r * 0.02), 0); ins.rotation.z = a + Math.PI / 2; ins.rotation.x = Math.PI / 2; chip.add(ins);
  }
  for (const s of [1, -1]) {
    const face = new THREE.Mesh(new THREE.RingGeometry(r * 0.56, r * 0.66, 96), edgeMat); face.position.z = s * (th / 2 + 0.002); if (s < 0) face.rotation.y = Math.PI; chip.add(face);
    const core = new THREE.Mesh(new THREE.CircleGeometry(r * 0.5, 96), new THREE.MeshPhysicalMaterial({ color: 0x08121f, metalness: 0.8, roughness: 0.3, envMapIntensity: 0.9 })); core.position.z = s * (th / 2 + 0.003); if (s < 0) core.rotation.y = Math.PI; chip.add(core);
    const spade = new THREE.Mesh(new THREE.CircleGeometry(r * 0.12, 48), neon); spade.position.z = s * (th / 2 + 0.005); if (s < 0) spade.rotation.y = Math.PI; chip.add(spade);
  }
  chip.position.copy(unprojectAt(958, 118, -1.5));
  scene.add(chip);
}

const v3 = new THREE.Vector3();
function toScreen(p) { v3.copy(p).project(camera); return [(v3.x + 1) / 2 * 1080, (1 - v3.y) / 2 * 1920]; }
const PT = [3.6, 2.4, 1.2]; // board: podium index -> base start time (1st last)

window.setTime = function (t) {
  const tm = t * K;                                  // main timeline (base seconds)
  const closeP = HAS_CLOSE ? eInOut(prog(t, CL, CL + 0.7)) : 0;
  // camera: slow push and drift
  const push = TPL === 'board'
    ? 0.9 * eInOut(prog(tm, 0, 12.5)) + 0.35 * eOut(prog(tm, 3.6, 4.6)) - 0.35 * eInOut(prog(tm, 8, 12))
    : 0.8 * eInOut(prog(tm, 0, BASE));
  camera.position.set(0.12 * Math.sin(t * 0.45), CAM0.y - 0.15 * prog(t, 0, DUR), CAM0.z - push);
  camera.lookAt(LOOK); camera.updateMatrixWorld();
  ped.forEach((P, i) => {
    const p = eBack(prog(tm, PT[i], PT[i] + (i === 0 ? 0.8 : 0.7)));
    const s = Math.max(0.001, p * (1 - closeP));
    P.g.scale.set(1, s, 1); P.g.visible = s > 0.02 && closeP < 0.98;
  });
  spot.intensity = TPL === 'board' ? 55 * eOut(prog(tm, 3.8, 4.4)) * (1 - closeP) : 0;
  { const sp = eOut(prog(tm, 0.3, 1.5)) * (1 - closeP); stage.material.opacity = sp; ring.material.opacity = (TPL === 'board' ? 0.4 : 0.3) * sp * (0.8 + 0.2 * Math.sin(t * 2)); glow.material.opacity = sp * GLOW_K;
    ring2.material.opacity = TPL === 'board' ? 0 : 0.28 * sp * (0.7 + 0.3 * Math.sin(t * 1.4 + 1)); ring2.rotation.z = t * 0.2; }
  rim.intensity = 60 + 25 * Math.sin(t * 1.3);
  for (const b of beams) {
    const a = b.gold ? 0.55 * eOut(prog(tm, 3.9, 4.6)) * (1 - prog(tm, 7, 9) * 0.6) * (1 - closeP)
      : (0.11 + 0.04 * Math.sin(t * 0.9 + b.phase)) * eOut(prog(t, 0.2, 1.4)) * (1 + closeP * 1.4);
    b.m.material.opacity = a; b.holder.rotation.z = b.gold ? 0 : Math.sin(t * 0.35 + b.phase) * 0.32;
  }
  for (let i = 0; i < N; i++) { const [x, y, z, sp, ph] = pbase[i]; pos[i * 3] = x + Math.sin(t * 0.3 + ph * 9) * 0.3; pos[i * 3 + 1] = ((y + 3 + t * sp) % 16) - 3; pos[i * 3 + 2] = z; }
  pg.attributes.position.needsUpdate = true;
  if (ped.length) {
    const st = tm - 4.05; sparks.material.opacity = st > 0 ? clamp(1 - st / 2.4) * (1 - closeP) : 0;
    const top1 = ped[0].g.position.y + ped[0].h;
    for (let i = 0; i < NS; i++) { const [ang, r, v, ph] = sbase[i]; const tt = Math.max(0, st); const rr = r * eOut(clamp(tt / 1.2)); spos[i * 3] = Math.cos(ang) * rr * 0.6; spos[i * 3 + 1] = top1 + 1.6 + Math.sin(ang) * rr * 0.6 - 1.2 * tt * tt * (0.5 + ph); spos[i * 3 + 2] = ZF + 0.4; }
    sg.attributes.position.needsUpdate = true;
  }
  { const cp = eBack(prog(t, 0.2, 1.2)); chip.scale.setScalar(Math.max(0.001, cp * (1 - closeP)));
    chip.rotation.set(0.35 + 0.1 * Math.sin(t * 0.7), t * 0.9, 0.18); }
  renderer.render(scene, camera);

  // ---------- HTML layer ----------
  const ui = $('ui');
  ui.style.opacity = 1 - closeP; ui.style.transform = `scale(${1 - 0.05 * closeP})`; ui.style.filter = closeP > 0 ? `blur(${closeP * 8}px)` : 'none';
  const hp = eOut(prog(tm, 0, 0.9));
  $('logo').style.opacity = hp; $('logo').style.transform = `translateY(${(1 - hp) * -24}px)`;
  $('logoShine').style.backgroundPosition = `${-60 + 220 * prog(tm, 0.5, 1.5)}% 0`;
  const tp = eOut(prog(tm, 0.25, 1.1));
  $('eyebrow').style.opacity = tp;
  $('title').style.opacity = tp; $('title').style.transform = `perspective(800px) rotateX(${(1 - tp) * 40}deg)`;
  const sw = $('title').querySelector('.sweep'); if (sw) sw.style.backgroundPosition = `${-60 + 220 * (prog(tm, 0.9, 2.0) + prog(tm, BASE * 0.69, BASE * 0.69 + 1.2))}% 0`;
  const cp = eOut(prog(tm, 0.6, 1.3)); $('chips').style.opacity = cp; $('chips').style.transform = `translateY(${(1 - cp) * 16}px)`;
  $('footer').style.opacity = eOut(prog(tm, 0.8, 1.6));

  if (TPL === 'board') {
    cards.forEach((el, i) => {
      const P = ped[i];
      const [px, py] = toScreen(new THREE.Vector3(P.g.position.x, P.g.position.y + P.h * P.g.scale.y, ZF));
      const w = POD[i].w;
      el.style.left = (px - w / 2) + 'px'; el.style.top = (py - el.offsetHeight - 4) + 'px';
      const a = eOut(prog(tm, PT[i] + 0.25, PT[i] + 0.75));
      el.style.opacity = a; el.style.transform = `perspective(900px) rotateX(${(1 - a) * 25}deg) scale(${0.9 + 0.1 * a})`;
      const c0 = PT[i] + 0.35, cd = i === 0 ? 1.5 : 1.0;
      countUp(el.querySelector('.pts'), eOut(prog(tm, c0, c0 + cd)));
      const sh = -1.2 + 2.6 * prog(tm, c0 + cd - 0.1, c0 + cd + 0.6) + 2.6 * prog(tm, 9.6 + (i + 1) * 0.15, 10.3 + (i + 1) * 0.15);
      el.querySelector('.inner').style.setProperty('--sh', sh > 1.4 ? -1.2 + (sh - 2.6) : sh);
    });
    if (cards.length) {
      const c1 = cards[0]; const cx = parseFloat(c1.style.left) + POD[0].w / 2, cy = parseFloat(c1.style.top);
      const cr = prog(tm, 4.0, 4.55); const crown = $('crown');
      crown.style.left = (cx - 62) + 'px'; crown.style.top = (cy - 92 - (1 - eBounce(cr)) * 140) + 'px';
      crown.style.opacity = cr > 0 ? 1 : 0; crown.style.transform = `rotate(${Math.sin(t * 1.6) * 2}deg)`;
      const bu = $('burst'); bu.style.left = (cx - 380) + 'px'; bu.style.top = (cy + 120 - 380) + 'px';
      bu.style.opacity = 0.9 * eOut(prog(tm, 4.1, 4.8)); bu.style.transform = `rotate(${t * 14}deg)`;
      const fl = $('flash'); fl.style.left = (cx - 450) + 'px'; fl.style.top = (cy + 60 - 450) + 'px';
      const fp = prog(tm, 4.15, 4.75); fl.style.opacity = fp > 0 && fp < 1 ? Math.sin(fp * Math.PI) * 0.85 : 0;
    } else { $('burst').style.opacity = 0; $('flash').style.opacity = 0; }
    rows.forEach((row, i) => {
      const t0 = 5.4 + 0.22 * i; const p = eOut(prog(tm, t0, t0 + 0.5));
      row.style.opacity = p; row.style.transform = `rotateX(${(1 - p) * -85}deg) translateY(${(1 - p) * 26}px)`;
      countUp(row.querySelector('.rpts'), eOut(prog(tm, t0 + 0.1, t0 + 0.7)));
      const s2 = 10.4 + i * 0.08;
      row.querySelector('.rin').style.setProperty('--sh', -1.2 + 2.6 * prog(tm, t0 + 0.4, t0 + 1.0) + (tm > s2 ? 2.6 * prog(tm, s2, s2 + 0.6) - 2.6 * (tm > s2 + 0.6 ? 1 : 0) : 0));
    });
    const ct = 5.4 + 0.22 * rows.length + 0.3;
    const hpp = eOut(prog(tm, ct, ct + 0.55)); const hm = $('callout'); hm.style.opacity = hpp; hm.style.transform = `translateY(${(1 - hpp) * 30}px) scale(${0.96 + 0.04 * hpp})`;
  } else {
    $('burst').style.opacity = 0; $('flash').style.opacity = 0;
  }
  if (TPL === 'list') {
    items.forEach((it, i) => {
      const t0 = 1.0 + 0.2 * i; const p = eOut(prog(tm, t0, t0 + 0.55));
      it.style.opacity = p; it.style.transform = `translateX(${(1 - p) * 120}px) rotateY(${(1 - p) * -38}deg)`;
      const v = it.querySelector('.ival .v'); if (v) countUp(v, eOut(prog(tm, t0 + 0.15, t0 + 0.85)));
      const s2 = BASE * 0.7 + i * 0.09;
      it.querySelector('.iin').style.setProperty('--sh', -1.2 + 2.6 * prog(tm, t0 + 0.35, t0 + 0.95) + (tm > s2 ? 2.6 * prog(tm, s2, s2 + 0.6) - 2.6 * (tm > s2 + 0.6 ? 1 : 0) : 0));
    });
  }
  if (TPL === 'stats') {
    tiles.forEach((tl, i) => {
      const t0 = 1.0 + 0.22 * i; const p = eBack(prog(tm, t0, t0 + 0.6)); const a = eOut(prog(tm, t0, t0 + 0.4));
      tl.style.opacity = a; tl.style.transform = `rotateX(${(1 - clamp(p)) * 70}deg) scale(${0.85 + 0.15 * p})`;
      countUp(tl.querySelector('.tv'), eOut(prog(tm, t0 + 0.2, t0 + 1.2)));
      const s2 = BASE * 0.72 + i * 0.1;
      tl.querySelector('.tin').style.setProperty('--sh', -1.2 + 2.6 * prog(tm, t0 + 0.6, t0 + 1.2) + (tm > s2 ? 2.6 * prog(tm, s2, s2 + 0.6) - 2.6 * (tm > s2 + 0.6 ? 1 : 0) : 0));
    });
  }
  // closing
  const cl = $('closing'); cl.style.opacity = closeP;
  if (HAS_CLOSE) {
    const cs = eBack(prog(t, CL + 0.2, CL + 0.9)); $('crest').style.transform = `scale(${0.6 + 0.4 * cs}) rotate(${(1 - cs) * -12}deg)`;
    ['cl1', 'cl2', 'cl3', 'cl4', 'cl5', 'cl6'].forEach((id, k) => { const q = eOut(prog(t, CL + 0.45 + k * 0.1, CL + 0.95 + k * 0.1)); $(id).style.opacity = q; $(id).style.transform = `translateY(${(1 - q) * 22}px)`; });
  }
};
window.setTime(0);
window.__ready = true;
</script>
